    const safeStorage = {
      getJSON(k, fb) {
        try {
          const r = localStorage.getItem(k);
          return r === null ? fb : JSON.parse(r);
        } catch (_) { return fb; }
      },
      setJSON(k, v) {
        try {
          localStorage.setItem(k, JSON.stringify(v));
          return true;
        } catch (_) { return false; }
      }
    };

    const loadIdList = (key, fb) => {
      const v = safeStorage.getJSON(key, null);
      return Array.isArray(v) ? v.filter((x) => typeof x === 'string') : fb;
    };

    const numOrNull = (v) => {
      if (v === null || v === undefined || v === '') return null;
      const n = Number(v);
      return Number.isFinite(n) && n >= 0 ? n : null;
    };
    const numOrZero = (v) => numOrNull(v) ?? 0;

    // カタカナ・ひらがな相互変換ヘルパー
    function katakanaToHiragana(str) {
      return String(str ?? '').replace(/[\u30a1-\u30f6]/g, (m) => String.fromCharCode(m.charCodeAt(0) - 0x60));
    }
    function hiraganaToKatakana(str) {
      return String(str ?? '').replace(/[\u3041-\u3096]/g, (m) => String.fromCharCode(m.charCodeAt(0) + 0x60));
    }
    const normalizeSearch = (s) => katakanaToHiragana(String(s ?? '').normalize('NFKC').toLowerCase());

    function expandSearchTerms(rawQuery) {
      const q = String(rawQuery ?? '').trim();
      if (!q) return [];
      const subQueries = q.split(/[\s　]+/).filter(Boolean);

      return subQueries.map((subQ) => {
        const hira = katakanaToHiragana(subQ.toLowerCase());
        const kata = hiraganaToKatakana(hira);
        const variants = new Set([subQ, hira, kata, subQ.toLowerCase()]);

        SYNONYM_DICTIONARY.forEach((entry) => {
          const matchKanji = entry.kanji.some(k => subQ.includes(k) || k.includes(subQ));
          const matchKana = entry.kana.some(k => hira.includes(k) || k.includes(hira));
          if (matchKanji || matchKana) {
            entry.kanji.forEach(k => {
              variants.add(k);
              variants.add(katakanaToHiragana(k));
              variants.add(hiraganaToKatakana(k));

    // 栄養素換算計算（廃棄率・可食部）
    function calculateScaledNutrients(food, grams, isPurchasedWeight = false) {
      if (!food) return null;
      const rawGrams = Math.max(0, Number(grams) || 0);
      const refuseRate = Number(food.refuseRate) || 0;
      const edibleGrams = isPurchasedWeight ? rawGrams * (1 - refuseRate / 100) : rawGrams;
      const ratio = edibleGrams / 100;

      const scaleNum = (val, decimals = 1) => (val === null || val === undefined) ? null : +(Number(val) * ratio).toFixed(decimals);
      const scaleInt = (val) => (val === null || val === undefined) ? null : Math.round(Number(val) * ratio);

      const energy = Math.round((food.energy ?? 0) * ratio);
      const energyKj = Math.round((food.energyKj ?? (food.energy ?? 0) * 4.184) * ratio);
      const water = scaleNum(food.water, 1);
      const protein = +( (food.protein ?? 0) * ratio ).toFixed(1);
      const proteinAmino = scaleNum(food.proteinAmino, 1);
      const fat = +( (food.fat ?? 0) * ratio ).toFixed(1);
      const carb = +( (food.carb ?? 0) * ratio ).toFixed(1);
      const fiber = +( (food.fiber ?? 0) * ratio ).toFixed(1);
      const fiberSoluble = scaleNum(food.fiberSoluble, 1);
      const fiberInsoluble = scaleNum(food.fiberInsoluble, 1);
      const sugar = +( (food.sugar ?? Math.max(0, (food.carb ?? 0) - (food.fiber ?? 0))) * ratio ).toFixed(1);
      const availableCarb = scaleNum(food.availableCarb, 1);
      const salt = +( (food.salt ?? 0) * ratio ).toFixed(2);
      const ash = scaleNum(food.ash, 1);

      // ミネラル 13種
      const sodium = scaleInt(food.sodium);
      const potassium = scaleInt(food.potassium);
      const calcium = scaleInt(food.calcium);
      const magnesium = scaleInt(food.magnesium);
      const phosphorus = scaleInt(food.phosphorus);
      const iron = scaleNum(food.iron, 2);
      const zinc = scaleNum(food.zinc, 2);
      const copper = scaleNum(food.copper, 2);
      const manganese = scaleNum(food.manganese, 2);
      const iodine = scaleNum(food.iodine, 1);
      const selenium = scaleNum(food.selenium, 1);
      const chromium = scaleNum(food.chromium, 1);
      const molybdenum = scaleNum(food.molybdenum, 1);

      // ビタミン 15項目
      const vitaminA = scaleInt(food.vitaminA);
      const retinol = scaleInt(food.retinol);
      const betaCarotene = scaleInt(food.betaCarotene);
      const vitaminD = scaleNum(food.vitaminD, 1);
      const vitaminE = scaleNum(food.vitaminE, 1);
      const vitaminK = scaleInt(food.vitaminK);
      const vitaminB1 = scaleNum(food.vitaminB1, 2);
      const vitaminB2 = scaleNum(food.vitaminB2, 2);
      const niacin = scaleNum(food.niacin, 1);
      const vitaminB6 = scaleNum(food.vitaminB6, 2);
      const vitaminB12 = scaleNum(food.vitaminB12, 1);
      const folate = scaleInt(food.folate);
      const pantothenicAcid = scaleNum(food.pantothenicAcid, 2);
      const biotin = scaleNum(food.biotin, 1);
      const vitaminC = scaleNum(food.vitaminC, 1);

      // 脂質詳細
      const saturatedFat = scaleNum(food.saturatedFat, 2);
      const monounsaturatedFat = scaleNum(food.monounsaturatedFat, 2);
      const polyunsaturatedFat = scaleNum(food.polyunsaturatedFat, 2);
      const n3Fat = scaleNum(food.n3Fat, 2);
      const n6Fat = scaleNum(food.n6Fat, 2);
      const cholesterol = scaleInt(food.cholesterol);

      // アミノ酸
      const isoleucine = scaleInt(food.isoleucine);
      const leucine = scaleInt(food.leucine);
      const valine = scaleInt(food.valine);
      const bcaaTotal = (isoleucine !== null && leucine !== null && valine !== null)
        ? +((isoleucine + leucine + valine) / 1000).toFixed(2)
        : null;
      const lysine = scaleInt(food.lysine);
      const methionine = scaleInt(food.methionine);
      const phenylalanine = scaleInt(food.phenylalanine);
      const threonine = scaleInt(food.threonine);
      const tryptophan = scaleInt(food.tryptophan);
      const histidine = scaleInt(food.histidine);
      const arginine = scaleInt(food.arginine);
      const alanine = scaleInt(food.alanine);
      const glutamicAcid = scaleInt(food.glutamicAcid);
      const asparticAcid = scaleInt(food.asparticAcid);

      // PFC比率
      const pKcal = protein * 4;
      const fKcal = fat * 9;
      const cKcal = carb * 4;
      const totalKcalPfc = pKcal + fKcal + cKcal;
      let pRatio = 0, fRatio = 0, cRatio = 0;
      if (totalKcalPfc > 0) {
        pRatio = Math.round((pKcal / totalKcalPfc) * 100);
        fRatio = Math.round((fKcal / totalKcalPfc) * 100);
        cRatio = Math.max(0, 100 - (pRatio + fRatio));
      }

      return {
        edibleGrams: Math.round(edibleGrams),
        energy, energyKj, water, protein, proteinAmino, fat, carb, sugar, availableCarb, fiber, fiberSoluble, fiberInsoluble, salt, ash,
        sodium, potassium, calcium, magnesium, phosphorus, iron, zinc, copper, manganese, iodine, selenium, chromium, molybdenum,
        vitaminA, retinol, betaCarotene, vitaminD, vitaminE, vitaminK, vitaminB1, vitaminB2, niacin, vitaminB6, vitaminB12, folate, pantothenicAcid, biotin, vitaminC,
        saturatedFat, monounsaturatedFat, polyunsaturatedFat, n3Fat, n6Fat, cholesterol,
        isoleucine, leucine, valine, bcaaTotal, lysine, methionine, phenylalanine, threonine, tryptophan, histidine, arginine, alanine, glutamicAcid, asparticAcid,
        aminoAcidScore: food.aminoAcidScore ?? null,
        giIndex: food.giIndex ?? null,
        pRatio, fRatio, cRatio
      };
    }

        portionUnits: [
          { name: '茶碗普通盛 (150g)', grams: 150, isPurchasedWeight: false, isDefault: true },
          { name: '茶碗小盛 (120g)', grams: 120, isPurchasedWeight: false, isDefault: false },
          { name: '100g', grams: 100, isPurchasedWeight: false, isDefault: false }
        ]
      },
      {
        id: 'food_06297', foodCode: '06297', source: 'mext_official',
        name: 'りょくとうもやし/生', displayName: '緑豆もやし（生）', shortName: 'もやし（緑豆）',
        kana: 'もやし りょくとうもやし 緑豆もやし 野菜 やさい モヤシ', categoryCode: '06', categoryName: '野菜類', categoryEmoji: '🌱',
        refuseRate: 0.0, energy: 15, energyKj: 63, water: 95.4, protein: 1.7, fat: 0.1, carb: 2.6, sugar: 1.3, fiber: 1.3, salt: 0.0,
        sodium: 2, potassium: 69, calcium: 10, magnesium: 10, iron: 0.2, zinc: 0.3, folate: 41, vitaminC: 8.0,
        portionUnits: [
          { name: '市販1袋 (200g)', grams: 200, isPurchasedWeight: false, isDefault: true },
          { name: '100g (半袋)', grams: 100, isPurchasedWeight: false, isDefault: false }
        ]
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [selectedFoodId, setSelectedFoodId] = useState('food_14003');

      const [foodMaster, setFoodMaster] = useState(INTRINSIC_OFFICIAL_FOODS);
      const [dbSyncStatus, setDbSyncStatus] = useState('synced');

      const [userGender, setUserGender] = useState('male');
      const [userAgeGroup, setUserAgeGroup] = useState('30-49');
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isHealthHubOpen, setIsHealthHubOpen] = useState(false);

      // 体組成ステート（iPhoneヘルスケア同期対応）
      const [bodyMetrics, setBodyMetrics] = useState(() => {
        return safeStorage.getJSON(STORAGE_KEYS.bodyMetrics, {
          heightCm: 172,
          weightKg: 68.5,
          bodyFatPct: 16.5,
          targetCalories: 2200,
          lastSyncTime: null
        });
      });

      const [detailGrams, setDetailGrams] = useState(12);
      const [activePortionUnit, setActivePortionUnit] = useState('大さじ1 (12g)');
      const [isPurchasedWeight, setIsPurchasedWeight] = useState(false);

      const [favorites, setFavorites] = useState(() => loadIdList(STORAGE_KEYS.favorites, ['food_14003', 'food_14001', 'food_11221']));
      const [history, setHistory] = useState(() => loadIdList(STORAGE_KEYS.history, ['food_14003', 'food_14001']));

      const [compareFoodA, setCompareFoodA] = useState({ id: 'food_14003', grams: 12, isPurchased: false });
      const [compareFoodB, setCompareFoodB] = useState({ id: 'food_14001', grams: 12, isPurchased: false });

      const savedRecipeData = useMemo(() => safeStorage.getJSON(STORAGE_KEYS.recipe, null), []);
      const [recipeTitle, setRecipeTitle] = useState(savedRecipeData?.title || 'マイレシピ');
      const [servings, setServings] = useState(savedRecipeData?.servings || 1);
      const [recipeItems, setRecipeItems] = useState(Array.isArray(savedRecipeData?.items) ? savedRecipeData.items : []);

      const [toastData, setToastData] = useState(null);
      const toastTimeoutRef = useRef(null);

      const showToast = (msg, actionLabel = null, onAction = null) => {
        if (toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current);
        setToastData({ msg, actionLabel, onAction });
        toastTimeoutRef.current = setTimeout(() => setToastData(null), 4000);
      };

      useEffect(() => {
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      }, [activeTab]);

      // Service Worker 登録（PWAオフライン対応）
      useEffect(() => {
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
      }, []);

      // 八訂公的データの自動フェッチ
      useEffect(() => {
        const fetchMext = async () => {
          try {
            const res = await fetch('./mext_foods.json');
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data) && data.length > 500) {
                setFoodMaster(prev => {
                  const map = new Map();
                  prev.forEach(f => map.set(f.foodCode, f));
                  data.forEach(f => map.set(f.foodCode, f));
                  return Array.from(map.values());
                });
                setDbSyncStatus('synced');
              }
            }
          } catch (_) {}
        };
        fetchMext();
      }, []);

      useEffect(() => { safeStorage.setJSON(STORAGE_KEYS.favorites, favorites); }, [favorites]);
      useEffect(() => { safeStorage.setJSON(STORAGE_KEYS.history, history); }, [history]);
      useEffect(() => { safeStorage.setJSON(STORAGE_KEYS.bodyMetrics, bodyMetrics); }, [bodyMetrics]);
      useEffect(() => { safeStorage.setJSON(STORAGE_KEYS.recipe, { title: recipeTitle, servings, items: recipeItems }); }, [recipeTitle, servings, recipeItems]);

      // 体組成の自動計算（BMI, LBM, BMR Katch-McArdle式）
      const calculatedBodyStats = useMemo(() => {
        const hMeter = (Number(bodyMetrics.heightCm) || 170) / 100;
        const wKg = Number(bodyMetrics.weightKg) || 65;
        const fatPct = Number(bodyMetrics.bodyFatPct) || 18;

        const bmi = +(wKg / (hMeter * hMeter)).toFixed(1);
        const lbm = +(wKg * (1 - (fatPct / 100))).toFixed(1);
        // Katch-McArdle式: 基礎代謝 = 370 + (21.6 * LBM)
        const bmr = Math.round(370 + (21.6 * lbm));

        return { bmi, lbm, bmr };
      }, [bodyMetrics]);

      const handleSelectFood = (foodId) => {
        const food = foodMaster.find((f) => f.id === foodId);
        if (!food) return;
        setSelectedFoodId(food.id);
        const defaultUnit = food.portionUnits?.[0] || { name: '100g', grams: 100, isPurchasedWeight: false };
        setDetailGrams(defaultUnit.grams);
        setActivePortionUnit(defaultUnit.name);
        setIsPurchasedWeight(!!defaultUnit.isPurchasedWeight);
        setHistory((prev) => [food.id, ...prev.filter((id) => id !== food.id)].slice(0, 20));
        setActiveTab('detail');
      };

      const handleAddToRecipe = (foodId, grams, unitName, isPurchased) => {
        const targetFood = foodMaster.find(f => f.id === foodId);
        setRecipeItems(prev => [
          ...prev,
          {
            foodId,
            grams: Number(grams) || 100,
            unitName: unitName || `${grams}g`,
            isPurchased: !!isPurchased
          }
        ]);
        showToast(
          `「${targetFood?.shortName || '食材'} (${grams}g)」を追加しました`,
          'レシピを開く ➔',
          () => setActiveTab('recipe')
        );
      };

      // Apple HealthKit 連携アクション（ショートカット / Nativeブリッジ）
      const handleRecordToHealthKit = (nutrientPayload, title = '食材記録') => {
        const dataJson = JSON.stringify({
          source: 'NutriDex',
          timestamp: new Date().toISOString(),
          title,
          ...nutrientPayload
        });

        // Capacitor Nativeブリッジの存在確認
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorHealthkit) {
          window.Capacitor.Plugins.CapacitorHealthkit.requestAuthorization({
            all: ['dietaryEnergy', 'dietaryProtein', 'dietaryFatTotal', 'dietaryCarbohydrates']
          }).then(() => {
            showToast('Appleヘルスケアに直接記録しました');
          }).catch(() => {
            showToast('ヘルスケア権限の取得に失敗しました');
          });
          return;
        }

        // Web/PWA環境：クリップボード格納 ＆ ショートカットURLスキーム起動
        if (navigator.clipboard) {
          navigator.clipboard.writeText(dataJson).catch(() => {});
        }
        showToast(`ヘルスケア連携用データを生成しました（${nutrientPayload.energy} kcal）`, '連携起動', () => {
          window.location.href = `shortcuts://run-shortcut?name=NutriDexToHealth`;
        });
      };

      const currentDri = useMemo(() => DETAILED_DRI_TABLE[userGender]?.[userAgeGroup] || DETAILED_DRI_TABLE.male['30-49'], [userGender, userAgeGroup]);

      const navItems = [
        { id: 'home', label: 'さがす', icon: Search },
        { id: 'detail', label: '詳細・分量', icon: Sliders },
        { id: 'compare', label: 'くらべる', icon: Scale },
        { id: 'recipe', label: 'けいさん', icon: Calculator, badgeCount: recipeItems.length },
        { id: 'favorites', label: '保存・履歴', icon: Bookmark }
      ];

      return (
        <div className="min-h-screen min-h-dvh w-full bg-[#F8FAFC] text-slate-800 flex flex-col font-sans selection:bg-slate-900 selection:text-white">
          
          {/* ヘッダー (モダン・グラスモーフィズム) */}
          <header className="sticky top-0 z-40 bg-white/80 backdrop-blur-xl border-b border-slate-200/80 shadow-subtle w-full pt-safe">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
              
              {/* ブランドロゴ */}
              <div className="flex items-center gap-2.5 cursor-pointer group shrink-0" onClick={() => setActiveTab('home')}>
                <div className="w-9 h-9 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-700 flex items-center justify-center font-black text-white shadow-card group-hover:scale-105 transition-all">
                  <Flame size={19} className="fill-white text-white" />
                </div>
                <div className="flex items-center gap-2">
                  <span className="font-extrabold tracking-tight text-lg text-slate-900">NutriDex</span>
                  <span className="text-[10px] font-black px-1.5 py-0.5 rounded-md bg-slate-900 text-white font-mono tracking-tighter shadow-sm">
                    {APP_VERSION}
                  </span>
                  <div className="hidden xs:flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-emerald-50 border border-emerald-200/80 text-[11px] font-bold text-emerald-800">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse" />
                    <span>八訂 {foodMaster.length}品目</span>
                  </div>
                </div>
              </div>

              {/* PCナビゲーション (ピル型) */}
              <nav className="hidden md:flex items-center gap-1 bg-slate-100/80 p-1 rounded-2xl border border-slate-200/60">
                {navItems.map((item) => {
                  const Icon = item.icon;
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 relative ${
                        isActive ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      <Icon size={15} />
                      <span>{item.label}</span>
                      {item.badgeCount > 0 && (
                        <span className="px-1.5 py-0.2 rounded-full bg-slate-900 text-white text-[10px] font-black">
                          {item.badgeCount}
                        </span>
                      )}
                    </button>
                  );
                })}
              </nav>

              {/* 右側アクション：ヘルスケア連携 ＆ ユーザー設定 */}
              <div className="flex items-center gap-1.5 sm:gap-2 shrink-0">
                <button
                  onClick={() => setIsHealthHubOpen(true)}
                  className="p-2 sm:px-3 sm:py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200/80 shadow-subtle flex items-center gap-1.5 transition-all active:scale-95"
                  title="Apple ヘルスケア連動 ＆ 体組成マネジメント"
                >
                  <Heart size={15} className="fill-rose-500 text-rose-500" />
                  <span className="text-xs font-black hidden sm:inline">体組成・Health</span>
                </button>

                <button
                  onClick={() => setIsSettingsOpen(true)}
                  className="px-2.5 py-1.5 rounded-xl bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 shadow-subtle transition-all flex items-center gap-1.5"
                >
                  <Settings size={14} className="text-slate-500" />
                  <span className="font-bold text-xs">{userGender === 'male' ? '男性' : '女性'} {userAgeGroup}</span>
                </button>
              </div>
            </div>
          </header>

          {/* メインコンテンツ */}
          <main className="flex-1 w-full max-w-6xl mx-auto p-4 sm:p-6 lg:p-8 pb-32 md:pb-16 box-border">
            {activeTab === 'home' && (
              <HomeScreen
                foods={foodMaster}
                totalCount={foodMaster.length}
                onSelectFood={handleSelectFood}
              />
            )}
            {activeTab === 'detail' && (
              <DetailScreen
                food={foodMaster.find(f => f.id === selectedFoodId) || foodMaster[0]}
                currentGrams={detailGrams}
                onChangeGrams={setDetailGrams}
                activeUnit={activePortionUnit}
                onChangeUnit={setActivePortionUnit}
                isPurchasedWeight={isPurchasedWeight}
                onChangePurchasedWeight={setIsPurchasedWeight}
                currentDri={currentDri}
                isFavorite={favorites.includes(selectedFoodId)}
                onToggleFavorite={() => {
                  setFavorites(prev => prev.includes(selectedFoodId) ? prev.filter(id => id !== selectedFoodId) : [...prev, selectedFoodId]);
                  showToast(favorites.includes(selectedFoodId) ? 'お気に入りを解除' : 'お気に入りに追加');
                }}
                onBack={() => setActiveTab('home')}
                onAddToRecipe={handleAddToRecipe}
                onAddToCompare={(id) => {
                  setCompareFoodB({ id, grams: 12, isPurchased: false });
                  setActiveTab('compare');
                }}
                onRecordToHealth={handleRecordToHealthKit}
                onCopySummary={(txt) => {
                  navigator.clipboard?.writeText(txt);
                  showToast('栄養サマリーをクリップボードにコピーしました！');
                }}
              />
            )}
            {activeTab === 'compare' && (
              <CompareScreen
                foodMaster={foodMaster}
                foodAConfig={compareFoodA}
                foodBConfig={compareFoodB}
                onChangeFoodA={setCompareFoodA}
                onChangeFoodB={setCompareFoodB}
              />
            )}
            {activeTab === 'recipe' && (
              <RecipeScreen
                foodMaster={foodMaster}
                title={recipeTitle}
                onChangeTitle={setRecipeTitle}
                servings={servings}
                onChangeServings={setServings}
                items={recipeItems}
                onChangeItems={setRecipeItems}
                onAddMore={() => setActiveTab('home')}
                onSelectFood={handleSelectFood}
                onRecordToHealth={handleRecordToHealthKit}
              />
            )}
            {activeTab === 'favorites' && (
              <FavoritesScreen
                foodMaster={foodMaster}
                favoriteIds={favorites}
                historyIds={history}
                onSelectFood={handleSelectFood}
              />
            )}
          </main>

          {/* モバイル用ボトムナビゲーション (iOS風) */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/85 backdrop-blur-xl border-t border-slate-200/80 px-2 py-1.5 flex items-center justify-around shadow-float pb-safe">
            {navItems.map((item) => {
              const Icon = item.icon;
              const isActive = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`flex flex-col items-center justify-center py-1 px-3 rounded-2xl transition-all relative ${
                    isActive ? 'text-slate-900 font-extrabold' : 'text-slate-400 hover:text-slate-600'
                  }`}
                >
                  <Icon size={20} className={isActive ? 'text-slate-900 scale-105' : ''} />
                  <span className="text-[10px] mt-0.5 tracking-tight">{item.label}</span>
                  {item.badgeCount > 0 && (
                    <span className="absolute top-0 right-2 min-w-[16px] h-4 px-1 bg-slate-900 text-white rounded-full text-[9px] flex items-center justify-center font-black">
                      {item.badgeCount}
                    </span>
                  )}
                </button>
              );
            })}
          </nav>

          {/* トースト表示 */}
          {toastData && (
            <div className="fixed bottom-20 md:bottom-8 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 text-white px-4 py-3 rounded-2xl shadow-float flex items-center gap-3 text-xs font-bold backdrop-blur-xl max-w-[92%] sm:max-w-md border border-slate-800">
              <Check size={16} className="text-emerald-400 shrink-0" />
              <span className="truncate flex-1">{toastData.msg}</span>
              {toastData.actionLabel && (
                <button
                  onClick={() => {
                    if (toastData.onAction) toastData.onAction();
                    setToastData(null);
                  }}
                  className="px-2.5 py-1 bg-white text-slate-900 rounded-lg font-black shrink-0 shadow-sm text-[11px]"
                >
                  {toastData.actionLabel}
                </button>
              )}
            </div>
          )}

          {/* Apple HealthKit & 体組成マネジメントモーダル */}
          {isHealthHubOpen && (
            <HealthBodyModal
              metrics={bodyMetrics}
              stats={calculatedBodyStats}
              onChangeMetrics={setBodyMetrics}
              onClose={() => setIsHealthHubOpen(false)}
              onShowToast={showToast}
            />
          )}

          {/* 設定モーダル */}
          {isSettingsOpen && (
            <SettingsModal
              userGender={userGender}
              onChangeGender={setUserGender}
              userAgeGroup={userAgeGroup}
              onChangeAgeGroup={setUserAgeGroup}
              onClose={() => setIsSettingsOpen(false)}
            />
          )}
        </div>
      );
    }

    // --- 検索画面 (HomeScreen) ---
    function HomeScreen({ foods, totalCount, onSelectFood }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');

      const filteredFoods = useMemo(() => {
        const queryGroups = expandSearchTerms(searchQuery);
        const hasQuery = queryGroups.length > 0;

        if (!hasQuery && selectedCategory === 'all') return foods.slice(0, 48);

        return foods.filter((f) => {
          const matchCat = selectedCategory === 'all' || f.categoryCode === selectedCategory;
          if (!matchCat) return false;
          if (!hasQuery) return true;

          const foodTargetString = normalizeSearch(
            `${f.name || ''} ${f.displayName || ''} ${f.shortName || ''} ${f.kana || ''} ${f.foodCode || ''}`
          );

          return queryGroups.every((synonymVariants) => {
            return synonymVariants.some((variant) => foodTargetString.includes(variant));
          });
        }).slice(0, 96);
      }, [foods, searchQuery, selectedCategory]);

      return (
        <div className="space-y-5 w-full">
          {/* Spotlight風 大型検索バー */}
          <div className="bg-white p-4 sm:p-5 rounded-3xl border border-slate-200/80 shadow-card space-y-4">
            <div className="flex items-center justify-between text-xs text-slate-500 font-bold px-1">
              <span>登録食品数: <span className="text-slate-900 font-extrabold tnum">{totalCount}品目</span></span>
              <span className="text-[11px] text-slate-400">漢字・ひらがな・カタカナ完全対応</span>
            </div>

            <div className="relative">
              <div className="absolute inset-y-0 left-4 flex items-center pointer-events-none text-slate-400">
                <Search size={20} />
              </div>
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="鶏もも肉, 豚バラ, 鮭, 玉ねぎ, 米油, もち麦 など検索"
                className="w-full bg-slate-50 border border-slate-200/80 rounded-2xl pl-12 pr-10 py-3.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-900 transition-all"
              />
              {searchQuery && (
                <button onClick={() => setSearchQuery('')} className="absolute inset-y-0 right-3.5 flex items-center text-slate-400 hover:text-slate-600 font-bold text-sm">×</button>
              )}
            </div>

            {/* カテゴリピル */}
            <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none">
              {[
                { id: 'all', name: 'すべて', emoji: '🍽️' },
                { id: '11', name: '肉類', emoji: '🍗' },
                { id: '10', name: '魚介類', emoji: '🐟' },
                { id: '06', name: '野菜類', emoji: '🥦' },
                { id: '14', name: '油脂類', emoji: '🫒' },
                { id: '01', name: '穀類', emoji: '🍚' },
                { id: '04', name: '豆類', emoji: '🫘' },
                { id: '12', name: '卵類', emoji: '🥚' },
                { id: '13', name: '乳類', emoji: '🧈' }
              ].map(cat => (
                <button
                  key={cat.id}
                  onClick={() => setSelectedCategory(cat.id)}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold border transition-all shrink-0 ${
                    selectedCategory === cat.id ? 'bg-slate-900 border-slate-900 text-white shadow-sm' : 'bg-white border-slate-200/80 text-slate-600 hover:bg-slate-50'
                  }`}
                >
                  <span>{cat.emoji}</span>
                  <span>{cat.name}</span>
                </button>
              ))}
            </div>
          </div>

          {/* 食品グリッドカード */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
            {filteredFoods.length === 0 ? (
              <div className="col-span-full bg-white p-12 rounded-3xl border border-dashed border-slate-200 text-center space-y-2">
                <span className="text-3xl">🔍</span>
                <p className="text-sm font-bold text-slate-800">「{searchQuery}」に一致する食品が見つかりませんでした</p>
                <p className="text-xs text-slate-400">漢字、ひらがな、カタカナのいずれでも検索できます。</p>
              </div>
            ) : (
              filteredFoods.map(food => (
                <div
                  key={food.id}
                  onClick={() => onSelectFood(food.id)}
                  className="bg-white hover:bg-slate-50/80 border border-slate-200/80 hover:border-slate-300 p-4 rounded-3xl cursor-pointer transition-all flex items-center justify-between shadow-subtle hover:shadow-card hover:-translate-y-0.5"
                >
                  <div className="flex items-center gap-3.5 min-w-0">
                    <div className="w-12 h-12 rounded-2xl bg-slate-100 flex items-center justify-center text-2xl shrink-0">
                      {food.categoryEmoji}
                    </div>
                    <div className="min-w-0">
                      <div className="flex items-center gap-1.5">
                        <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border ${sourceInfo(food.source).cls}`}>
                          {sourceInfo(food.source).label}
                        </span>
                        <span className="text-[10px] text-slate-400 font-mono truncate">#{food.foodCode}</span>
                      </div>
                      <h3 className="text-sm font-bold text-slate-900 truncate mt-0.5">{food.displayName}</h3>
                      <div className="flex items-center gap-2 mt-1 text-xs tnum">
                        <span className="font-extrabold text-slate-900">{food.energy} kcal</span>
                        <span className="text-rose-600 font-bold">P {food.protein}</span>
                        <span className="text-amber-600 font-bold">F {food.fat}</span>
                        <span className="text-sky-600 font-bold">C {food.carb}</span>
                      </div>
                    </div>
                  </div>
                  <ChevronRight size={18} className="text-slate-300 shrink-0" />
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    // --- 詳細画面 (DetailScreen: 60項目ロック完全展開) ---
    function DetailScreen({
      food, currentGrams, onChangeGrams, activeUnit, onChangeUnit,
      isPurchasedWeight, onChangePurchasedWeight, currentDri, isFavorite,
      onToggleFavorite, onBack, onAddToRecipe, onAddToCompare, onRecordToHealth, onCopySummary
    }) {
      const [activeNutrientCategory, setActiveNutrientCategory] = useState('all');
      const [nutrientFilterKeyword, setNutrientFilterKeyword] = useState('');

      const n = useMemo(() => calculateScaledNutrients(food, currentGrams, isPurchasedWeight), [food, currentGrams, isPurchasedWeight]);

      const mealDri = useMemo(() => {
        const res = {};
        Object.keys(currentDri).forEach((k) => {
          res[k] = (currentDri[k] ?? 0) / 3.0;
        });
        return res;
      }, [currentDri]);

      // ロックされた全60項目のデータドリブン展開
      const displayedNutrients = useMemo(() => {
        if (!n) return [];
        return LOCKED_NUTRIENT_REGISTRY.map((def) => {
          const val = n[def.key] ?? null;
          const dri = def.driKey ? mealDri[def.driKey] : null;
          let note = null;
          if (def.isNoteKey && n[def.isNoteKey] !== null && n[def.isNoteKey] !== undefined) {
            note = `${n[def.isNoteKey]}${def.noteSuffix || ''}`;
          }

          return {
            category: def.category,
            name: def.name,
            val,
            unit: def.unit,
            dri,
            isMaxLimit: !!def.isMaxLimit,
            highlight: !!def.isHighlight,
            note
          };
        });
      }, [n, mealDri]);

      const filteredNutrients = useMemo(() => {
        return displayedNutrients.filter((item) => {
          const matchCat = activeNutrientCategory === 'all' || item.category === activeNutrientCategory;
          const matchQuery = !nutrientFilterKeyword.trim() || item.name.toLowerCase().includes(nutrientFilterKeyword.trim().toLowerCase());
          return matchCat && matchQuery;
        });
      }, [displayedNutrients, activeNutrientCategory, nutrientFilterKeyword]);

      const summaryText = `【NutriDex 栄養サマリー】\n食材: ${food.displayName}\n分量: ${currentGrams}g (${activeUnit}${isPurchasedWeight ? ` → 可食部${n.edibleGrams}g` : ''})\nエネルギー: ${n.energy}kcal (${n.energyKj}kJ)\nPFC: P ${n.protein}g (${n.pRatio}%) / F ${n.fat}g (${n.fRatio}%) / C ${n.carb}g (${n.cRatio}%)\n糖質: ${n.sugar}g / 食物繊維: ${n.fiber}g\nカリウム: ${n.potassium ?? '—'}mg / カルシウム: ${n.calcium ?? '—'}mg / 鉄: ${n.iron ?? '—'}mg / ビタミンC: ${n.vitaminC ?? '—'}mg`;

      return (
        <div className="space-y-4 max-w-5xl mx-auto">
          {/* 上部アクションバー */}
          <div className="flex items-center justify-between">
            <button onClick={onBack} className="flex items-center gap-1.5 text-xs font-bold text-slate-500 hover:text-slate-900 transition-colors">
              <ArrowLeft size={16} />
              <span>さがすへ戻る</span>
            </button>
            <div className="flex items-center gap-2">
              <button onClick={onToggleFavorite} className={`p-2 rounded-xl border transition-all ${isFavorite ? 'bg-rose-50 border-rose-200 text-rose-500' : 'bg-white border-slate-200 text-slate-500'}`}>
                {isFavorite ? <BookmarkCheck size={18} /> : <Bookmark size={18} />}
              </button>
              <button onClick={() => onAddToCompare(food.id)} className="px-3 py-2 bg-white text-slate-700 hover:bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-subtle">
                <Scale size={14} />
                <span>VS比較</span>
              </button>
              <button
                onClick={() => onAddToRecipe(food.id, currentGrams, activeUnit, isPurchasedWeight)}
                className="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 hover:bg-slate-800 text-white flex items-center gap-1.5 shadow-card transition-all active:scale-95"
              >
                <Plus size={14} />
                <span>レシピに追加</span>
              </button>
            </div>
          </div>

          {/* 食品詳細カード */}
          <div className="bg-white p-5 sm:p-6 rounded-3xl border border-slate-200/80 shadow-card space-y-5">
            <div className="flex items-start justify-between gap-4">
              <div className="flex items-start gap-4">
                <div className="w-16 h-16 rounded-2xl bg-slate-100 flex items-center justify-center text-4xl shrink-0">
                  {food.categoryEmoji}
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border ${sourceInfo(food.source).cls}`}>{sourceInfo(food.source).label}</span>

                </div>
              </div>

              {/* ヘルスケアに記録アクション */}
              <button
                onClick={() => onRecordToHealth({
                  energy: n.energy,
                  protein: n.protein,
                  fat: n.fat,
                  carb: n.carb,
                  fiber: n.fiber,
                  sugar: n.sugar,
                  sodium: n.sodium
                }, food.shortName)}
                className="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 rounded-2xl text-xs font-bold flex items-center gap-1.5 shadow-subtle shrink-0"
                title="Appleヘルスケアに記録"
              >
                <AppleIcon size={15} />
                <span className="hidden sm:inline">ヘルスケアに記録</span>
              </button>
            </div>

            {/* iOS Segmented Control風 分量セレクター */}
            <div className="bg-slate-50 p-4 rounded-2xl space-y-3 border border-slate-200/60">
              <div className="flex justify-between items-center text-xs font-bold">
                <span className="text-slate-700">分量調整: <span className="text-slate-900 font-black tnum">{currentGrams}g</span> ({activeUnit})</span>
                {food.refuseRate > 0 && <span className="text-amber-700">廃棄率 {food.refuseRate}% (実可食部: {n.edibleGrams}g)</span>}
              </div>

              <div className="flex flex-wrap gap-1.5">
                {food.portionUnits?.map((u, i) => (
                  <button
                    key={i}
                    onClick={() => {
                      onChangeGrams(u.grams);
                      onChangeUnit(u.name);
                      onChangePurchasedWeight(!!u.isPurchasedWeight);
                    }}
                    className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all border ${
                      activeUnit === u.name ? 'bg-slate-900 border-slate-900 text-white shadow-sm' : 'bg-white border-slate-200/80 text-slate-700 hover:bg-slate-100'
                    }`}
                  >
                    {u.name}
                  </button>
                ))}
              </div>

              <input
                type="range"
                min="1"
                max={Math.max(300, currentGrams * 2)}
                step="1"
                value={currentGrams}
                onChange={(e) => { onChangeGrams(Number(e.target.value)); onChangeUnit('カスタム'); }}
                className="w-full accent-slate-900 cursor-pointer"
              />
            </div>

            {/* PFC ＆ 熱量 マクロダッシュボード */}
            <div className="grid grid-cols-4 gap-2 text-center tnum">
              <div className="bg-slate-900 p-3.5 rounded-2xl text-white">
                <div className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Energy</div>
                <div className="text-xl sm:text-2xl font-black mt-0.5">{n.energy} <span className="text-xs font-medium text-slate-300">kcal</span></div>
              </div>
              <div className="bg-rose-50/80 border border-rose-200/80 p-3.5 rounded-2xl text-rose-900">
                <div className="text-[10px] text-rose-600 font-bold">タンパク質 ({n.pRatio}%)</div>
                <div className="text-lg sm:text-xl font-black mt-0.5">{n.protein}<span className="text-xs font-normal">g</span></div>
              </div>
              <div className="bg-amber-50/80 border border-amber-200/80 p-3.5 rounded-2xl text-amber-900">
                <div className="text-[10px] text-amber-600 font-bold">脂質 ({n.fRatio}%)</div>
                <div className="text-lg sm:text-xl font-black mt-0.5">{n.fat}<span className="text-xs font-normal">g</span></div>
              </div>
              <div className="bg-sky-50/80 border border-sky-200/80 p-3.5 rounded-2xl text-sky-900">
                <div className="text-[10px] text-sky-600 font-bold">炭水化物 ({n.cRatio}%)</div>
                <div className="text-lg sm:text-xl font-black mt-0.5">{n.carb}<span className="text-xs font-normal">g</span></div>
              </div>
            </div>

            <button
              onClick={() => onCopySummary(summaryText)}
              className="w-full py-2.5 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 transition-colors"
            >
              <Copy size={14} />
              <span>栄養サマリーをクリップボードにコピー</span>
            </button>
          </div>

          {/* 全微量栄養素・ビタミン・脂肪酸・アミノ酸 (60項目ロックダッシュボード) */}
          <div className="bg-white p-5 rounded-3xl border border-slate-200/80 shadow-card space-y-4">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 pb-3">
              <div>
                <h3 className="text-sm sm:text-base font-extrabold text-slate-900 flex items-center gap-1.5">
                  <Activity size={18} className="text-emerald-600" />
                  <span>確定詳細栄養素一覧（{filteredNutrients.length}項目）</span>
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 border flex items-center gap-1">
                    <Lock size={10} />
                    <span>永久固定仕様</span>
                  </span>
                </h3>
                <p className="text-[11px] text-slate-400 mt-0.5">
                  厚生労働省「日本人の食事摂取基準」1食目安（1日の1/3）に対する充足率
                </p>
              </div>

              {/* インライン絞り込み */}
              <div className="relative w-full sm:w-44">
                <input
                  type="text"
                  value={nutrientFilterKeyword}
                  onChange={(e) => setNutrientFilterKeyword(e.target.value)}
                  placeholder="栄養素名で絞込..."
                  className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-slate-900"
                />
                {nutrientFilterKeyword && (
                  <button onClick={() => setNutrientFilterKeyword('')} className="absolute right-2 top-1.5 text-slate-400 text-xs font-bold">×</button>
                )}
              </div>
            </div>

            {/* カテゴリタブ */}
            <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none w-full">
              {NUTRIENT_TABS.map((tab) => (
                <button
                  key={tab.id}
                  onClick={() => setActiveNutrientCategory(tab.id)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all border shrink-0 ${
                    activeNutrientCategory === tab.id
                      ? 'bg-slate-900 border-slate-900 text-white shadow-sm'
                      : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            {/* 60項目データドリブングリッド */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5 max-h-[560px] overflow-y-auto pr-1">
              {filteredNutrients.map((item, idx) => {
                const hasVal = item.val !== null && item.val !== undefined;
                const ratio = (hasVal && item.dri && item.dri > 0) ? Math.round((Number(item.val) / item.dri) * 100) : null;
                const isOver = item.isMaxLimit && ratio && ratio > 100;

                return (
                  <div key={idx} className="p-3 rounded-2xl bg-slate-50/70 border border-slate-200/80 flex flex-col justify-between">
                    <div className="flex items-start justify-between gap-2">
                      <div>
                        <div className="flex items-center gap-1.5">
                          <span className="text-xs font-bold text-slate-800">{item.name}</span>
                          {item.highlight && <span className="text-[9px] px-1 py-0.2 rounded font-bold bg-slate-200 text-slate-700">主要</span>}
                        </div>
                        {item.note && <span className="text-[10px] text-slate-400">{item.note}</span>}
                      </div>

                      <div className="text-right shrink-0 tnum">
                        <span className="text-sm font-black text-slate-900">{hasVal ? item.val : '—'}</span>
                        {hasVal && item.unit && <span className="text-[11px] text-slate-500 font-medium ml-0.5">{item.unit}</span>}
                      </div>
                    </div>

                    {item.dri && (
                      <div className="mt-2 space-y-1">
                        <div className="flex justify-between text-[10px] text-slate-500 tnum">
                          <span>1食目安: {item.dri.toFixed(1)}{item.unit}</span>
                          {ratio !== null && (
                            <span className={isOver ? 'text-rose-600 font-extrabold' : 'text-slate-900 font-bold'}>
                              {item.isMaxLimit ? `上限比 ${ratio}%` : `${ratio}%`}
                            </span>
                          )}
                        </div>
                        <div className="h-1.5 w-full bg-slate-200 rounded-full overflow-hidden">
                          <div
                            style={{ width: `${Math.min(100, ratio ?? 0)}%` }}
                            className={`h-full rounded-full transition-all duration-300 ${isOver ? 'bg-rose-500' : 'bg-slate-900'}`}
                          />
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // --- くらべる画面 (CompareScreen) ---
    function CompareScreen({ foodMaster, foodAConfig, foodBConfig, onChangeFoodA, onChangeFoodB }) {
      const fA = foodMaster.find(f => f.id === foodAConfig.id) || foodMaster[0];
      const fB = foodMaster.find(f => f.id === foodBConfig.id) || foodMaster[1] || foodMaster[0];
      const nA = calculateScaledNutrients(fA, foodAConfig.grams);
      const nB = calculateScaledNutrients(fB, foodBConfig.grams);

      const handleSwap = () => {
        const temp = { ...foodAConfig };
        onChangeFoodA(foodBConfig);
        onChangeFoodB(temp);
      };

      return (
        <div className="max-w-3xl mx-auto space-y-4">
          <div className="flex items-center justify-between">
            <h2 className="text-base font-extrabold flex items-center gap-2"><Scale size={18} /> 食品くらべる (VS)</h2>
            <button onClick={handleSwap} className="px-3 py-1.5 bg-white border border-slate-200 text-xs font-bold rounded-xl flex items-center gap-1 shadow-subtle">
              <RotateCcw size={14} />
              <span>左右スワップ</span>
            </button>
          </div>

          <div className="grid grid-cols-2 gap-3">
            {[ { f: fA, n: nA, cfg: foodAConfig, setCfg: onChangeFoodA }, { f: fB, n: nB, cfg: foodBConfig, setCfg: onChangeFoodB } ].map((slot, i) => (
              <div key={i} className="bg-white p-4 rounded-3xl border border-slate-200/80 text-center space-y-2 shadow-card">
                <span className="text-3xl">{slot.f.categoryEmoji}</span>
                <select
                  value={slot.f.id}
                  onChange={(e) => slot.setCfg({ ...slot.cfg, id: e.target.value })}
                  className="w-full text-xs font-bold p-1.5 border rounded-xl bg-slate-50"
                >
                  {foodMaster.slice(0, 100).map(food => <option key={food.id} value={food.id}>{food.shortName}</option>)}
                </select>
                <div className="text-xs text-slate-500 font-bold">{slot.cfg.grams}g</div>
                <div className="text-lg font-black text-slate-900 tnum">{slot.n.energy} kcal</div>
              </div>
            ))}
          </div>

          <div className="bg-white p-5 rounded-3xl border border-slate-200/80 space-y-2.5 text-xs shadow-card tnum">
            <div className="flex justify-between border-b pb-1.5">
              <span className="text-slate-500 font-bold">タンパク質</span>
              <span className="font-extrabold">{nA.protein}g vs {nB.protein}g</span>
            </div>
            <div className="flex justify-between border-b pb-1.5">
              <span className="text-slate-500 font-bold">脂質</span>
              <span className="font-extrabold">{nA.fat}g vs {nB.fat}g</span>
            </div>
            <div className="flex justify-between border-b pb-1.5">
              <span className="text-slate-500 font-bold">食物繊維総量</span>
              <span className="font-extrabold">{nA.fiber}g vs {nB.fiber}g</span>
            </div>
            <div className="flex justify-between border-b pb-1.5">
              <span className="text-slate-500 font-bold">ビタミンE</span>
              <span className="font-extrabold">{nA.vitaminE ?? '—'}mg vs {nB.vitaminE ?? '—'}mg</span>
            </div>
            <div className="flex justify-between">
              <span className="text-slate-500 font-bold">食塩相当量</span>
              <span className="font-extrabold">{nA.salt}g vs {nB.salt}g</span>
            </div>
          </div>
        </div>
      );
    }

    // --- レシピ計算画面 (RecipeScreen) ---
    function RecipeScreen({ foodMaster, title, onChangeTitle, servings, onChangeServings, items, onChangeItems, onAddMore, onSelectFood, onRecordToHealth }) {
      const handleGramChange = (idx, delta) => {
        onChangeItems(items.map((it, i) => {
          if (i === idx) return { ...it, grams: Math.max(1, it.grams + delta) };
          return it;
        }));
      };

      const handleRemove = (idx) => onChangeItems(items.filter((_, i) => i !== idx));

      const totals = useMemo(() => {
        let energy = 0, protein = 0, fat = 0, carb = 0, sugar = 0, fiber = 0, salt = 0, sodium = 0;
        items.forEach(item => {
          const f = foodMaster.find(x => x.id === item.foodId);
          if (f) {
            const sc = calculateScaledNutrients(f, item.grams, item.isPurchased);
            energy += sc.energy;
            protein += sc.protein;
            fat += sc.fat;
            carb += sc.carb;
            sugar += sc.sugar;
            fiber += sc.fiber;
            salt += sc.salt;
            sodium += (sc.sodium || 0);
          }
        });

        const s = Math.max(1, Number(servings) || 1);
        const perServing = {
          energy: Math.round(energy / s),
          protein: +(protein / s).toFixed(1),
          fat: +(fat / s).toFixed(1),
          carb: +(carb / s).toFixed(1),
          sugar: +(sugar / s).toFixed(1),
          fiber: +(fiber / s).toFixed(1),
          salt: +(salt / s).toFixed(2),
          sodium: Math.round(sodium / s)
        };

        const pKcal = perServing.protein * 4;
        const fKcal = perServing.fat * 9;
        const cKcal = perServing.carb * 4;
        const totalPfc = pKcal + fKcal + cKcal;
        let pRatio = 0, fRatio = 0, cRatio = 0;
        if (totalPfc > 0) {
          pRatio = Math.round((pKcal / totalPfc) * 100);
          fRatio = Math.round((fKcal / totalPfc) * 100);
          cRatio = Math.max(0, 100 - (pRatio + fRatio));
        }

        return { totalEnergy: Math.round(energy), perServing, pRatio, fRatio, cRatio };
      }, [foodMaster, items, servings]);

      const recipeSummaryText = `【NutriDex レシピ計算】\n料理名: ${title}\n出来上がり: ${servings}人前 (総量 ${totals.totalEnergy} kcal)\n1人前あたり: ${totals.perServing.energy} kcal\nPFC: P ${totals.perServing.protein}g (${totals.pRatio}%) / F ${totals.perServing.fat}g (${totals.fRatio}%) / C ${totals.perServing.carb}g (${totals.cRatio}%)\n糖質: ${totals.perServing.sugar}g / 食物繊維: ${totals.perServing.fiber}g / 食塩: ${totals.perServing.salt}g`;

      return (
        <div className="max-w-3xl mx-auto space-y-4">
          <div className="bg-white p-4 sm:p-5 rounded-3xl border border-slate-200/80 space-y-3 shadow-card">
            <div className="flex items-center justify-between flex-wrap gap-2">
              <div className="flex items-center gap-2">
                <Calculator size={18} className="text-slate-900" />
                <span className="font-extrabold text-slate-900 text-sm">マイレシピ・合算栄養計算</span>
              </div>
              <div className="flex items-center gap-2 text-xs">
                <span className="text-slate-500 font-bold">出来上がり:</span>
                <select
                  value={servings}
                  onChange={(e) => onChangeServings(Number(e.target.value))}
                  className="bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1 text-slate-900 font-bold"
                >
                  {[1, 2, 3, 4, 5, 6].map(num => <option key={num} value={num}>{num} 人前</option>)}
                </select>
              </div>
            </div>

            <input
              type="text"
              value={title}
              onChange={(e) => onChangeTitle(e.target.value)}
              placeholder="料理名を入力（例: 鶏もも肉と野菜の健康炒め）"
              className="w-full bg-slate-50 border border-slate-200/80 rounded-2xl px-3.5 py-2.5 text-xs sm:text-sm font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900/10"
            />
          </div>

          <div className="space-y-2.5">
            <div className="flex items-center justify-between px-1 text-xs font-bold text-slate-500">
              <span>登録食材（{items.length}品）</span>
              <button onClick={onAddMore} className="flex items-center gap-1 text-slate-900 hover:text-slate-700 font-bold">
                <Plus size={15} />
                <span>食材を追加</span>
              </button>
            </div>

            {items.length === 0 ? (
              <div className="bg-white p-8 rounded-3xl border border-dashed border-slate-200 text-center space-y-3 shadow-subtle">
                <div className="w-12 h-12 rounded-2xl bg-slate-100 flex items-center justify-center mx-auto text-xl">🛒</div>
                <div className="space-y-1">
                  <h4 className="text-xs sm:text-sm font-extrabold text-slate-900">レシピに食材が入っていません</h4>
                  <p className="text-[11px] text-slate-400">食材詳細画面から「レシピに追加」を押すと、ここに食材が追加されます。</p>
                </div>
              </div>
            ) : (
              items.map((item, idx) => {
                const f = foodMaster.find(x => x.id === item.foodId);
                if (!f) return null;
                const sc = calculateScaledNutrients(f, item.grams, item.isPurchased);

                return (
                  <div key={idx} className="bg-white p-3.5 sm:p-4 rounded-3xl border border-slate-200/80 flex items-center justify-between gap-3 shadow-subtle">
                    <div className="flex items-center gap-3 min-w-0 flex-1 cursor-pointer" onClick={() => onSelectFood(f.id)}>
                      <span className="text-2xl sm:text-3xl shrink-0">{f.categoryEmoji}</span>
                      <div className="min-w-0 flex-1">
                        <h4 className="text-xs sm:text-sm font-bold text-slate-900 truncate">{f.shortName}</h4>
                        <p className="text-[11px] text-slate-500 mt-0.5 truncate tnum">
                          {item.grams}g • <span className="text-slate-900 font-black">{sc.energy} kcal</span> (P:{sc.protein}g F:{sc.fat}g C:{sc.carb}g)
                        </p>
                      </div>
                    </div>

                    <div className="flex items-center gap-1.5 shrink-0">
                      <div className="flex items-center bg-slate-50 rounded-xl border border-slate-200 p-0.5">
                        <button onClick={() => handleGramChange(idx, -10)} className="w-7 h-7 flex items-center justify-center text-slate-600 hover:bg-slate-200 rounded-lg">
                          <Minus size={13} />
                        </button>
                        <span className="px-2 text-xs font-bold text-slate-900 min-w-[2.5rem] text-center tnum">{item.grams}g</span>
                        <button onClick={() => handleGramChange(idx, 10)} className="w-7 h-7 flex items-center justify-center text-slate-600 hover:bg-slate-200 rounded-lg">
                          <Plus size={13} />
                        </button>
                      </div>
                      <button onClick={() => handleRemove(idx)} className="p-1.5 text-slate-400 hover:text-rose-500 rounded-xl">
                        <Trash2 size={16} />
                      </button>
                    </div>
                  </div>
                );
              })
            )}
          </div>

          {items.length > 0 && (
            <div className="bg-white p-5 rounded-3xl border border-slate-200/80 space-y-4 shadow-card">
              <div className="flex items-baseline justify-between border-b pb-3 flex-wrap gap-2">
                <div>
                  <span className="text-xs font-bold text-slate-500">1人前あたり ({servings}人前換算)</span>
                  <div className="flex items-baseline gap-1.5 mt-0.5 tnum">
                    <span className="text-3xl sm:text-4xl font-black text-slate-900">{totals.perServing.energy}</span>
                    <span className="text-sm font-bold text-slate-700">kcal</span>
                  </div>
                </div>

                <div className="text-right text-xs text-slate-600 space-y-0.5 tnum">
                  <div>糖質: <span className="font-bold text-slate-900">{totals.perServing.sugar}g</span></div>
                  <div>食物繊維: <span className="font-bold text-emerald-700">{totals.perServing.fiber}g</span></div>
                  <div>食塩: <span className="font-bold text-slate-900">{totals.perServing.salt}g</span></div>
                </div>
              </div>

              <div className="space-y-1.5">
                <div className="flex justify-between text-[11px] font-bold text-slate-600 tnum">
                  <span>PFC比率</span>
                  <span>P:{totals.pRatio}% / F:{totals.fRatio}% / C:{totals.cRatio}%</span>
                </div>
                <div className="h-3 w-full bg-slate-100 rounded-full overflow-hidden flex shadow-inner">
                  <div style={{ width: `${totals.pRatio}%` }} className="bg-rose-500" />
                  <div style={{ width: `${totals.fRatio}%` }} className="bg-amber-400" />
                  <div style={{ width: `${totals.cRatio}%` }} className="bg-sky-400" />
                </div>
              </div>

              <div className="grid grid-cols-3 gap-2 text-center text-xs tnum">
                <div className="bg-rose-50/80 border border-rose-200 rounded-2xl p-2.5">
                  <div className="text-[10px] text-rose-600 font-bold">タンパク質</div>
                  <div className="font-black text-slate-900 text-sm mt-0.5">{totals.perServing.protein}g</div>
                </div>
                <div className="bg-amber-50/80 border border-amber-200 rounded-2xl p-2.5">
                  <div className="text-[10px] text-amber-600 font-bold">脂質</div>
                  <div className="font-black text-slate-900 text-sm mt-0.5">{totals.perServing.fat}g</div>
                </div>
                <div className="bg-sky-50/80 border border-sky-200 rounded-2xl p-2.5">
                  <div className="text-[10px] text-sky-600 font-bold">炭水化物</div>
                  <div className="font-black text-slate-900 text-sm mt-0.5">{totals.perServing.carb}g</div>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2 pt-1">
                <button
                  onClick={() => onRecordToHealth(totals.perServing, `${title} (1人前)`)}
                  className="py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold rounded-2xl flex items-center justify-center gap-1.5 border border-rose-200 transition-colors"
                >
                  <AppleIcon size={14} />
                  <span>1人前をHealthKitへ</span>
                </button>

                <button
                  onClick={() => {
                    navigator.clipboard?.writeText(recipeSummaryText);
                    alert('レシピ栄養サマリーをコピーしました！');
                  }}
                  className="py-2.5 bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-bold rounded-2xl flex items-center justify-center gap-1.5 border border-slate-200 transition-colors"
                >
                  <Copy size={14} />
                  <span>サマリーをコピー</span>
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- お気に入り・履歴画面 (FavoritesScreen) ---
    function FavoritesScreen({ foodMaster, favoriteIds, onSelectFood }) {
      const favs = useMemo(() => favoriteIds.map(id => foodMaster.find(f => f.id === id)).filter(Boolean), [foodMaster, favoriteIds]);
      return (
        <div className="max-w-2xl mx-auto space-y-4">
          <h2 className="text-base font-extrabold flex items-center gap-2"><Bookmark size={18} /> お気に入り食材 ({favs.length})</h2>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {favs.map(f => (
              <div key={f.id} onClick={() => onSelectFood(f.id)} className="bg-white p-4 rounded-3xl border border-slate-200/80 flex items-center justify-between cursor-pointer shadow-subtle hover:shadow-card transition-all">
                <div className="flex items-center gap-2.5">
                  <span className="text-2xl">{f.categoryEmoji}</span>
                  <span className="text-xs font-bold text-slate-900">{f.displayName}</span>
                </div>
                <ChevronRight size={16} className="text-slate-400" />
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- 体組成・Apple HealthKit モーダル (新設) ---
    function HealthBodyModal({ metrics, stats, onChangeMetrics, onClose, onShowToast }) {
      const [editState, setEditState] = useState({ ...metrics });

      const handleSave = () => {
        onChangeMetrics(editState);
        onShowToast('体組成データを更新しました');
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/40 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white border border-slate-200 w-full max-w-lg rounded-3xl p-6 space-y-5 shadow-float max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center border-b pb-3">
              <div className="flex items-center gap-2">
                <Heart size={20} className="fill-rose-500 text-rose-500" />
                <h3 className="text-base font-black text-slate-900">体組成 ＆ Appleヘルスケア連動</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 font-bold text-sm">✕</button>
            </div>

            {/* リアルタイム解析生体指標 */}
            <div className="grid grid-cols-3 gap-2.5 text-center tnum">
              <div className="bg-slate-50 border border-slate-200/80 p-3 rounded-2xl">
                <div className="text-[10px] font-bold text-slate-500">BMI</div>
                <div className="text-lg font-black text-slate-900 mt-0.5">{stats.bmi}</div>
                <div className="text-[9px] text-slate-400">{stats.bmi >= 25 ? '肥満傾向' : stats.bmi < 18.5 ? '低体重' : '適正'}</div>
              </div>
              <div className="bg-slate-50 border border-slate-200/80 p-3 rounded-2xl">
                <div className="text-[10px] font-bold text-slate-500">LBM (除脂肪体重)</div>
                <div className="text-lg font-black text-slate-900 mt-0.5">{stats.lbm}<span className="text-xs">kg</span></div>
                <div className="text-[9px] text-slate-400">筋肉量目安</div>
              </div>
              <div className="bg-slate-50 border border-slate-200/80 p-3 rounded-2xl">
                <div className="text-[10px] font-bold text-slate-500">BMR (推定基礎代謝)</div>
                <div className="text-lg font-black text-slate-900 mt-0.5">{stats.bmr}<span className="text-xs">kcal</span></div>
                <div className="text-[9px] text-slate-400">Katch-McArdle式</div>
              </div>
            </div>

            {/* 入力フォーム */}
            <div className="space-y-3 text-xs font-bold text-slate-700">
              <div className="grid grid-cols-2 gap-3">
                <div className="space-y-1">
                  <label>身長 (cm)</label>
                  <input
                    type="number"
                    value={editState.heightCm}
                    onChange={(e) => setEditState({ ...editState, heightCm: Number(e.target.value) })}
                    className="w-full bg-slate-50 border rounded-xl p-2.5 text-slate-900 font-bold"
                  />
                </div>
                <div className="space-y-1">
                  <label>体重 (kg)</label>
                  <input
                    type="number"
                    step="0.1"
                    value={editState.weightKg}
                    onChange={(e) => setEditState({ ...editState, weightKg: Number(e.target.value) })}
                    className="w-full bg-slate-50 border rounded-xl p-2.5 text-slate-900 font-bold"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div className="space-y-1">
                  <label>体脂肪率 (%)</label>
                  <input
                    type="number"
                    step="0.1"
                    value={editState.bodyFatPct}
                    onChange={(e) => setEditState({ ...editState, bodyFatPct: Number(e.target.value) })}
                    className="w-full bg-slate-50 border rounded-xl p-2.5 text-slate-900 font-bold"
                  />
                </div>
                <div className="space-y-1">
                  <label>1日目標カロリー (kcal)</label>
                  <input
                    type="number"
                    value={editState.targetCalories}
                    onChange={(e) => setEditState({ ...editState, targetCalories: Number(e.target.value) })}
                    className="w-full bg-slate-50 border rounded-xl p-2.5 text-slate-900 font-bold"
                  />
                </div>
              </div>
            </div>

            {/* HealthKit連携案内 */}
            <div className="p-3.5 bg-slate-50 rounded-2xl border border-slate-200/80 text-[11px] text-slate-500 space-y-1">
              <div className="font-bold text-slate-800 flex items-center gap-1.5">
                <AppleIcon size={14} />
                <span>Appleヘルスケア自動連携について</span>
              </div>
              <p>Capacitor iOSネイティブアプリ実行時は直接同期されます。ブラウザ・PWA実行時は「ショートカット」アプリと連携してワンタップ記録が可能です。</p>
            </div>

            <div className="flex gap-2">
              <button onClick={onClose} className="flex-1 py-2.5 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold">キャンセル</button>
              <button onClick={handleSave} className="flex-1 py-2.5 bg-slate-900 text-white rounded-xl text-xs font-bold shadow-card">保存する</button>
            </div>
          </div>
        </div>
      );
    }

    // --- 設定モーダル ---
    function SettingsModal({ userGender, onChangeGender, userAgeGroup, onChangeAgeGroup, onClose }) {
      return (
        <div className="fixed inset-0 z-50 bg-slate-950/40 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white border border-slate-200 w-full max-w-md rounded-3xl p-5 space-y-4 shadow-float">
            <div className="flex justify-between items-center border-b pb-3">
              <h3 className="text-sm font-bold flex items-center gap-2"><Settings size={16} /> 各種設定 (厚生労働省基準)</h3>
              <button onClick={onClose} className="text-slate-400 font-bold">✕</button>
            </div>
            <div className="space-y-1.5">
              <label className="text-xs font-bold text-slate-700">性別</label>
              <div className="flex gap-2">
                <button onClick={() => onChangeGender('male')} className={`flex-1 py-2 text-xs font-bold rounded-xl border transition-all ${userGender === 'male' ? 'bg-slate-900 text-white border-slate-900' : 'bg-slate-50 border-slate-200 text-slate-700'}`}>男性</button>
                <button onClick={() => onChangeGender('female')} className={`flex-1 py-2 text-xs font-bold rounded-xl border transition-all ${userGender === 'female' ? 'bg-slate-900 text-white border-slate-900' : 'bg-slate-50 border-slate-200 text-slate-700'}`}>女性</button>
              </div>
            </div>
            <div className="space-y-1.5">
              <label className="text-xs font-bold text-slate-700">年齢区分 (厚生労働省基準)</label>
              <div className="grid grid-cols-3 gap-2">
                {['18-29', '30-49', '50-64'].map(age => (
                  <button
                    key={age}
                    onClick={() => onChangeAgeGroup(age)}
                    className={`py-2 text-xs font-bold rounded-xl border transition-all ${userAgeGroup === age ? 'bg-slate-900 text-white border-slate-900' : 'bg-slate-50 border-slate-200 text-slate-700'}`}
                  >
                    {age} 歳
                  </button>
                ))}
              </div>
            </div>
            <button onClick={onClose} className="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold shadow-card transition-all">保存して閉じる</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
