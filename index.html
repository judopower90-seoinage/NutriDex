          return r === null ? fb : JSON.parse(r);
        } catch (_) { return fb; }
      },
      setJSON(k, v) {

          return true;
        } catch (_) { return false; }
      }

    const numOrNull = (v) => {
      if (v === null || v === undefined || v === '') return null;
      const n = Number(v);
      return Number.isFinite(n) && n >= 0 ? n : null;
    };
    const numOrZero = (v) => numOrNull(v) ?? 0;

    function extractFoodShortName(fullName) {
      if (!fullName) return '食品';
      const parts = fullName.split('/').map(s => s.trim().replace(/^[［\[]+|[］\]]+$/g, '')).filter(Boolean);
      const cookingStates = new Set(['生', 'ゆで', '焼き', '水煮', '油揚げ', '乾', 'めし', 'フライ', '電子レンジ調理', '水稲めし', '炒め']);
      
      let meaningful = '';
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        if (!cookingStates.has(p)) {
          meaningful = p;
          break;
        }
      }
      const last = parts[parts.length - 1];
      if (meaningful && meaningful !== last && cookingStates.has(last)) {
        return `${meaningful}(${last})`;
      }
      return meaningful || parts[0] || fullName;
    }

    function expandSearchTerms(rawQuery) {
      const q = String(rawQuery ?? '').trim();
      if (!q) return [];
      const subQueries = q.split(/[\s　]+/).filter(Boolean);

      return subQueries.map((subQ) => {
        const hira = katakanaToHiragana(subQ.toLowerCase());
        const kata = hiraganaToKatakana(hira);
        const variants = new Set([subQ, hira, kata, subQ.toLowerCase()]);

        SYNONYM_DICTIONARY.forEach((entry) => {
          const matchKanji = entry.kanji.some(k => subQ.includes(k) || k.includes(subQ));
          const matchKana = entry.kana.some(k => hira.includes(k) || k.includes(hira));
          if (matchKanji || matchKana) {
            entry.kanji.forEach(k => {
              variants.add(k);
              variants.add(katakanaToHiragana(k));
              variants.add(hiraganaToKatakana(k));
            });
            entry.kana.forEach(k => {
              variants.add(k);
              variants.add(katakanaToHiragana(k));
              variants.add(hiraganaToKatakana(k));
            });
          }
        });

        return Array.from(variants).map(v => normalizeSearch(v)).filter(Boolean);
      });
    }

      const cleaned = (Array.isArray(units) ? units : [])

          grams: Number(u?.grams),
          isPurchasedWeight: u?.isPurchasedWeight === true || u?.isPurchasedWeight === 'true',
          isDefault: u?.isDefault === true
        }))
        .filter((u) => u.name && Number.isFinite(u.grams) && u.grams > 0);
      if (cleaned.length === 0) return [{ name: '100g', grams: 100, isPurchasedWeight: false, isDefault: true }];
      if (!cleaned.some((u) => u.isDefault)) cleaned[0].isDefault = true;

    function calculateScaledNutrients(food, grams, isPurchasedWeight = false) {
      if (!food) return null;
      const rawGrams = Math.max(0, Number(grams) || 0);
      const refuseRate = Number(food.refuseRate) || 0;
      const edibleGrams = isPurchasedWeight ? rawGrams * (1 - refuseRate / 100) : rawGrams;
      const ratio = edibleGrams / 100;

      const scaleNum = (val, decimals = 1) => (val === null || val === undefined) ? null : +(Number(val) * ratio).toFixed(decimals);
      const scaleInt = (val) => (val === null || val === undefined) ? null : Math.round(Number(val) * ratio);

      const energy = Math.round((food.energy ?? 0) * ratio);
      const energyKj = Math.round((food.energyKj ?? (food.energy ?? 0) * 4.184) * ratio);
      const water = scaleNum(food.water, 1);
      const protein = +( (food.protein ?? 0) * ratio ).toFixed(1);
      const proteinAmino = scaleNum(food.proteinAmino, 1);
      const fat = +( (food.fat ?? 0) * ratio ).toFixed(1);
      const carb = +( (food.carb ?? 0) * ratio ).toFixed(1);
      const fiber = +( (food.fiber ?? 0) * ratio ).toFixed(1);
      const fiberSoluble = scaleNum(food.fiberSoluble, 1);
      const fiberInsoluble = scaleNum(food.fiberInsoluble, 1);
      const sugar = +( (food.sugar ?? Math.max(0, (food.carb ?? 0) - (food.fiber ?? 0))) * ratio ).toFixed(1);
      const availableCarb = scaleNum(food.availableCarb, 1);
      const salt = +( (food.salt ?? 0) * ratio ).toFixed(2);
      const ash = scaleNum(food.ash, 1);

      const sodium = scaleInt(food.sodium);
      const potassium = scaleInt(food.potassium);
      const calcium = scaleInt(food.calcium);
      const magnesium = scaleInt(food.magnesium);
      const phosphorus = scaleInt(food.phosphorus);
      const iron = scaleNum(food.iron, 2);
      const zinc = scaleNum(food.zinc, 2);
      const copper = scaleNum(food.copper, 2);
      const manganese = scaleNum(food.manganese, 2);
      const iodine = scaleNum(food.iodine, 1);
      const selenium = scaleNum(food.selenium, 1);
      const chromium = scaleNum(food.chromium, 1);
      const molybdenum = scaleNum(food.molybdenum, 1);

      const vitaminA = scaleInt(food.vitaminA);
      const retinol = scaleInt(food.retinol);
      const betaCarotene = scaleInt(food.betaCarotene);
      const vitaminD = scaleNum(food.vitaminD, 1);
      const vitaminE = scaleNum(food.vitaminE, 1);
      const vitaminK = scaleInt(food.vitaminK);

    function mergeFoodLists(base, incoming) {
      const codeMap = new Map();
      base.forEach(f => codeMap.set(f.foodCode, f));
      incoming.forEach(inc => {
        if (!inc || !inc.foodCode) return;
        const existing = codeMap.get(inc.foodCode);
        if (existing) {
          const merged = { ...existing };
          Object.keys(inc).forEach(k => {
            if (inc[k] !== null && inc[k] !== undefined && inc[k] !== '') {
              merged[k] = inc[k];
            }
          });
          codeMap.set(inc.foodCode, merged);
        } else {
          codeMap.set(inc.foodCode, inc);
        }
      });
      return Array.from(codeMap.values());
    }

      const [servings, setServings] = useState(savedRecipeData?.servings || 1);
      const [recipeItems, setRecipeItems] = useState(Array.isArray(savedRecipeData?.items) ? savedRecipeData.items : []);

      const [toastData, setToastData] = useState(null);
      const toastTimeoutRef = useRef(null);
      const [isManualSyncing, setIsManualSyncing] = useState(false);

      const showToast = (msg, actionLabel = null, onAction = null) => {
        if (toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current);
        setToastData({ msg, actionLabel, onAction });
        toastTimeoutRef.current = setTimeout(() => setToastData(null), 4000);
      };

      useEffect(() => {
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      }, [activeTab]);

      const syncDatabase = async (isManual = false) => {
        if (isManual) setIsManualSyncing(true);
        const endpoints = [
          './mext_foods.json',
          'https://raw.githubusercontent.com/katoharu432/standards-tables-of-food-composition-in-japan/master/data.json',
          'https://fastly.jsdelivr.net/gh/katoharu432/standards-tables-of-food-composition-in-japan@master/data.json'
        ];

        let success = false;
        for (const url of endpoints) {
          try {
            const res = await fetch(url, { cache: isManual ? 'reload' : 'default' });
            if (res.ok) {
              const rawData = await res.json();
              if (Array.isArray(rawData) && rawData.length > 500) {
                const formatted = rawData.map(transformExternalMextItem).filter(Boolean);
                setFoodMaster(prev => mergeFoodLists(prev, formatted));
                setDbSyncStatus('synced');
                showToast(isManual ? `八訂公式データを更新しました（${formatted.length}品目）` : `八訂公式 ${formatted.length}品目を同期完了！`);
                success = true;
                break;
              }
            }
          } catch (_) {}
        }

        if (!success) {
          setDbSyncStatus('builtin_ready');
          if (isManual) showToast('内蔵マスターデータを再読み込みしました');
        }
        if (isManual) setIsManualSyncing(false);
      };

      useEffect(() => { syncDatabase(false); }, []);

      useEffect(() => { safeStorage.setJSON(STORAGE_KEYS.favorites, favorites); }, [favorites]);
      useEffect(() => { safeStorage.setJSON(STORAGE_KEYS.history, history); }, [history]);
      useEffect(() => { safeStorage.setJSON(STORAGE_KEYS.recipe, { title: recipeTitle, servings, items: recipeItems }); }, [recipeTitle, servings, recipeItems]);
      useEffect(() => { safeStorage.setJSON(STORAGE_KEYS.bodyStats, bodyStats); }, [bodyStats]);
      useEffect(() => { safeStorage.setJSON(STORAGE_KEYS.profile, { gender: userGender, ageGroup: userAgeGroup }); }, [userGender, userAgeGroup]);

      const handleSelectFood = (foodId, directFood = null) => {
        const food = directFood ?? foodMaster.find((f) => f.id === foodId || f.foodCode === foodId);
        if (!food) return;
        setSelectedFoodId(food.id);
        const defaultUnit = food.portionUnits?.[0] || { name: '100g', grams: 100, isPurchasedWeight: false };
        setDetailGrams(defaultUnit.grams);
        setActivePortionUnit(defaultUnit.name);
        setIsPurchasedWeight(!!defaultUnit.isPurchasedWeight);
        setHistory((prev) => [food.id, ...prev.filter((id) => id !== food.id)].slice(0, 25));
        setActiveTab('detail');
      };

      const handleAddToRecipe = (foodId, grams, unitName, isPurchased) => {
        const targetFood = foodMaster.find(f => f.id === foodId || f.foodCode === foodId);
        setRecipeItems(prev => [
          ...prev,
          {
            foodId: targetFood ? targetFood.id : foodId,
            grams: Number(grams) || 100,
            unitName: unitName || `${grams}g`,
            isPurchased: !!isPurchased
          }
        ]);
        showToast(
          `「${targetFood?.shortName || '食材'} (${grams}g)」をレシピに追加しました`,
          'レシピを見る ➔',
          () => setActiveTab('recipe')
        );
      };

      const handleRecordToHealthKit = async (mealPayload) => {
        if (window.NutriDexHealthKit && typeof window.NutriDexHealthKit.saveMealNutrition === 'function') {
          try {
            const res = await window.NutriDexHealthKit.saveMealNutrition(mealPayload);
            if (res.method === 'native_healthkit') {
              showToast(`🍎 iPhoneヘルスケアに「${mealPayload.title}」を直接記録しました！`);
            } else {
              showToast(
                `🍎 ヘルスケア用データを生成しました（クリップボード格納済）`,
                'ショートカット起動 ➔',
                () => { window.location.href = res.shortcutUrl; }
              );
            }
            return;
          } catch (err) {
            console.warn('HealthKit error:', err);
          }
        }

        const dataJson = JSON.stringify({ source: 'NutriDex', timestamp: new Date().toISOString(), ...mealPayload });
        if (navigator.clipboard) {
          navigator.clipboard.writeText(dataJson).catch(() => {});
        }
        showToast(`ヘルスケア連携用データを生成しました（${mealPayload.energy} kcal）`, '連携起動', () => {
          window.location.href = 'shortcuts://run-shortcut?name=NutriDexToHealth';
        });
      };

      const currentDri = useMemo(() => DETAILED_DRI_TABLE[userGender]?.[userAgeGroup] || DETAILED_DRI_TABLE.male['30-49'], [userGender, userAgeGroup]);

      const navItems = [
        { id: 'home', label: 'さがす', icon: Search },
        { id: 'detail', label: '詳細・分量', icon: Sliders },
        { id: 'compare', label: 'くらべる', icon: Scale },
        { id: 'recipe', label: 'けいさん', icon: Calculator, badgeCount: recipeItems.length },
        { id: 'favorites', label: '保存・履歴', icon: Bookmark }
      ];

      return (
        <div className="min-h-screen min-h-dvh w-full max-w-full overflow-x-hidden bg-[#F8FAFC] text-slate-900 flex flex-col font-sans">

          {/* ヘッダー: iOSノッチ・ステータスバー下の安全領域からくっきり純白・黒文字で描画 */}
          <header className="sticky top-0 z-40 app-header-safe border-b border-slate-200 shadow-sm w-full transition-none">
            <div className="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-13 sm:h-16 flex items-center justify-between gap-1.5 sm:gap-3">
              
              {/* ブランドロゴ */}
              <div className="flex items-center gap-1.5 sm:gap-2.5 cursor-pointer shrink-0 min-w-0" onClick={() => setActiveTab('home')}>
                <div className="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-tr from-amber-400 via-yellow-400 to-amber-500 flex items-center justify-center shadow-sm shrink-0 p-1">
                  <div className="w-full h-full rounded-lg bg-white flex items-center justify-center shadow-inner">
                    <LemonSliceIcon size={19} />
                  </div>
                </div>
                <div className="flex items-center gap-1 sm:gap-1.5 shrink-0">
                  <span className="font-black tracking-tight text-base sm:text-lg text-slate-950 font-sans">
                    NutriDex
                  </span>
                  <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-md bg-slate-900 text-white font-mono tracking-tight shrink-0">
                    {APP_VERSION}
                  </span>
                  
                  <div className={`hidden lg:flex items-center gap-1.5 text-[11px] font-medium px-2 py-0.5 rounded-full border ${
                    dbSyncStatus === 'synced' ? 'bg-amber-50 text-amber-800 border-amber-200/80' :
                    dbSyncStatus === 'syncing' ? 'bg-amber-50 text-amber-800 border-amber-200/80 animate-pulse' :
                    'bg-slate-100 text-slate-700 border-slate-200'
                  }`}>
                    <span className={`w-1.5 h-1.5 rounded-full ${dbSyncStatus === 'synced' ? 'bg-amber-500 animate-pulse-subtle' : 'bg-amber-400'}`} />
                    <span className="font-mono text-[10px] font-bold">
                      {dbSyncStatus === 'synced' ? `八訂 ${foodMaster.length}品目` : dbSyncStatus === 'syncing' ? '同期中...' : `内蔵 ${foodMaster.length}品目`}
                    </span>
                  </div>
                </div>
              </div>

              {/* PCナビゲーション */}
              <nav className="hidden md:flex items-center gap-1 bg-slate-100 p-1 rounded-2xl border border-slate-200">
                {navItems.map((item) => {
                  const Icon = item.icon;
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 relative ${
                        isActive
                          ? 'bg-amber-400 text-slate-950 shadow-sm font-black'
                          : 'text-slate-600 hover:text-slate-900 hover:bg-white/50'
                      }`}
                    >
                      <Icon size={15} className={isActive ? 'text-slate-950' : 'text-slate-400'} />
                      <span>{item.label}</span>
                      {item.badgeCount > 0 && (
                        <span className="px-1.5 py-0.2 rounded-full bg-slate-900 text-yellow-300 text-[10px] font-mono font-bold">
                          {item.badgeCount}
                        </span>
                      )}
                    </button>
                  );
                })}
              </nav>

              {/* 右側アクション */}
              <div className="flex items-center gap-1 sm:gap-2 shrink-0">
                <button
                  onClick={() => setIsHealthModalOpen(true)}
                  className="px-2 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-bold flex items-center gap-1 shadow-xs transition-all active:scale-95"
                  title="Apple HealthKit連動・体組成マネジメント"
                >
                  <Heart size={14} className="fill-rose-500 text-rose-500 shrink-0" />
                  <span className="hidden sm:inline">体組成</span>
                  <span className="text-[11px] bg-rose-200/70 text-rose-900 px-1 py-0.2 rounded font-mono font-black">
                    {bodyStats.weight}kg
                  </span>
                </button>

                <button
                  onClick={() => syncDatabase(true)}
                  disabled={isManualSyncing}
                  className="p-1.5 sm:px-2.5 sm:py-1.5 rounded-xl bg-slate-50 hover:bg-yellow-50 text-slate-700 border border-slate-200 shadow-xs flex items-center gap-1.5 transition-all active:scale-95"
                  title="食品データベースを再同期"
                >
                  <RotateCcw size={15} className={`text-slate-600 ${isManualSyncing ? 'animate-spin text-amber-600' : ''}`} />
                  <span className="text-xs font-bold hidden lg:inline">再同期</span>
                </button>

                <button
                  onClick={() => setIsSettingsOpen(true)}
                  className="p-1.5 sm:px-2.5 py-1.5 rounded-xl bg-slate-50 hover:bg-slate-100 text-xs font-semibold text-slate-800 border border-slate-200 transition-all flex items-center gap-1 shadow-xs"
                >
                  <Settings size={15} className="text-slate-600" />
                  <span className="font-bold text-[11px] sm:text-xs hidden sm:inline">
                    {userGender === 'male' ? '男性' : '女性'} {userAgeGroup}
                  </span>
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 w-full max-w-7xl mx-auto p-3.5 sm:p-6 lg:p-8 pb-28 md:pb-16 box-border">
            {activeTab === 'home' && (
              <HomeScreen
                foods={foodMaster}
                totalCount={foodMaster.length}
                onSelectFood={handleSelectFood}
                onOpenHealth={() => setIsHealthModalOpen(true)}
                bodyStats={bodyStats}
              />
            )}
            {activeTab === 'detail' && (
              <DetailScreen
                food={foodMaster.find(f => f.id === selectedFoodId || f.foodCode === selectedFoodId) || foodMaster[0]}
                currentGrams={detailGrams}
                onChangeGrams={setDetailGrams}
                activeUnit={activePortionUnit}
                onChangeUnit={setActivePortionUnit}
                isPurchasedWeight={isPurchasedWeight}
                onChangePurchasedWeight={setIsPurchasedWeight}
                currentDri={currentDri}
                isFavorite={favorites.includes(selectedFoodId)}
                onToggleFavorite={() => {
                  setFavorites(prev => prev.includes(selectedFoodId) ? prev.filter(id => id !== selectedFoodId) : [...prev, selectedFoodId]);
                  showToast(favorites.includes(selectedFoodId) ? 'お気に入りを解除しました' : 'お気に入りに追加しました');
                }}
                onBack={() => setActiveTab('home')}
                onAddToRecipe={handleAddToRecipe}
                onRecordToHealthKit={handleRecordToHealthKit}
                onAddToCompare={(id) => {
                  setCompareFoodB({ id, grams: 12, isPurchased: false });
                  setActiveTab('compare');
                }}
                onCopySummary={(txt) => {
                  if (navigator.clipboard) {
                    navigator.clipboard.writeText(txt).then(() => showToast('栄養サマリーをクリップボードにコピーしました！')).catch(() => {});
                  }
                }}
              />
            )}
            {activeTab === 'compare' && (
              <CompareScreen
                foodMaster={foodMaster}
                foodAConfig={compareFoodA}
                foodBConfig={compareFoodB}
                onChangeFoodA={setCompareFoodA}
                onChangeFoodB={setCompareFoodB}
                onSelectFood={handleSelectFood}
              />
            )}
            {activeTab === 'recipe' && (
              <RecipeScreen
                foodMaster={foodMaster}
                title={recipeTitle}
                onChangeTitle={setRecipeTitle}
                servings={servings}
                onChangeServings={setServings}
                items={recipeItems}
                onChangeItems={setRecipeItems}
                onAddMore={() => setActiveTab('home')}
                onSelectFood={handleSelectFood}
                onOpenHealth={() => setIsHealthModalOpen(true)}
                onRecordToHealthKit={handleRecordToHealthKit}
              />
            )}
            {activeTab === 'favorites' && (
              <FavoritesScreen
                foodMaster={foodMaster}
                favoriteIds={favorites}
                historyIds={history}
                onSelectFood={handleSelectFood}
              />
            )}
          </main>

          <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-slate-200 px-2 py-1.5 flex items-center justify-around shadow-float pb-safe">
            {navItems.map((item) => {
              const Icon = item.icon;
              const isActive = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`flex flex-col items-center justify-center py-1 px-3 rounded-2xl transition-all relative ${
                    isActive ? 'text-amber-950 font-black' : 'text-slate-400 hover:text-slate-600'
                  }`}
                >
                  <div className={`p-1 rounded-xl transition-all ${isActive ? 'bg-amber-400 text-slate-950 scale-105 shadow-xs' : ''}`}>
                    <Icon size={20} />
                  </div>
                  <span className="text-[10px] mt-0.5 tracking-tight">{item.label}</span>
                  {item.badgeCount > 0 && (
                    <span className="absolute top-1 right-2 min-w-[17px] h-4 px-1 bg-amber-500 text-slate-950 rounded-full text-[9px] flex items-center justify-center font-mono font-black shadow-xs">
                      {item.badgeCount}
                    </span>
                  )}
                </button>
              );
            })}
          </nav>

          {toastData && (
            <div className="fixed bottom-20 md:bottom-8 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-2xl shadow-float flex items-center gap-3 text-xs font-bold max-w-[92%] sm:max-w-md border border-slate-800">
              <div className="w-5 h-5 rounded-full bg-amber-400/20 text-amber-300 flex items-center justify-center shrink-0">
                <Check size={13} />
              </div>
              <span className="truncate flex-1 text-slate-100">{toastData.msg}</span>
              {toastData.actionLabel && (
                <button
                  onClick={() => {
                    if (toastData.onAction) toastData.onAction();
                    setToastData(null);
                  }}
                  className="px-2.5 py-1 bg-amber-400 hover:bg-amber-300 text-slate-950 rounded-lg font-black shrink-0 shadow-xs transition-all text-[11px]"
                >
                  {toastData.actionLabel}
                </button>
              )}
            </div>
          )}

          {isHealthModalOpen && (
            <HealthKitModal
              bodyStats={bodyStats}
              onChangeStats={setBodyStats}
              onClose={() => setIsHealthModalOpen(false)}
              showToast={showToast}
            />
          )}

          {isSettingsOpen && (
            <SettingsModal
              userGender={userGender}
              onChangeGender={setUserGender}
              userAgeGroup={userAgeGroup}
              onChangeAgeGroup={setUserAgeGroup}
              onClose={() => setIsSettingsOpen(false)}
            />
          )}
        </div>
      );
    }

    // --- 検索画面 (HomeScreen) ---
    function HomeScreen({ foods, totalCount, onSelectFood, onOpenHealth, bodyStats }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');

      const filteredFoods = useMemo(() => {
        const queryGroups = expandSearchTerms(searchQuery);
        const hasQuery = queryGroups.length > 0;

        if (!hasQuery && selectedCategory === 'all') return foods.slice(0, 48);

        return foods.filter((f) => {
          const matchCat = selectedCategory === 'all' || f.categoryCode === selectedCategory;
          if (!matchCat) return false;
          if (!hasQuery) return true;

          const foodTargetString = normalizeSearch(
            `${f.name || ''} ${f.displayName || ''} ${f.shortName || ''} ${f.kana || ''} ${f.foodCode || ''}`
          );

          return queryGroups.every((synonymVariants) => {
            return synonymVariants.some((variant) => foodTargetString.includes(variant));
          });
        }).slice(0, 96);
      }, [foods, searchQuery, selectedCategory]);

      return (
        <div className="space-y-5 w-full">
          <div className="bg-gradient-to-r from-slate-900 via-slate-800 to-amber-950 p-4 sm:p-5 rounded-3xl text-white shadow-card relative overflow-hidden flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div className="space-y-1 z-10">
              <div className="flex items-center gap-2">
                <span className="px-2 py-0.5 rounded-full bg-amber-400/20 text-yellow-300 text-[10px] font-bold border border-amber-400/30 flex items-center gap-1">
                  <AppleLogo size={11} className="text-white" />
                  <span>Apple HealthKit 連携対応</span>
                </span>
                <span className="text-xs text-slate-400 font-mono">1日目標: {bodyStats.targetCalories} kcal</span>
              </div>
              <h2 className="text-base sm:text-lg font-black tracking-tight text-white flex items-center gap-2">
                <span>科学的栄養解析 × iPhone体組成マネジメント</span>
              </h2>
              <p className="text-xs text-slate-300 max-w-xl leading-relaxed">
                八訂公的データベース準拠の全63項目栄養素をリアルタイム換算。計算された食事データをiPhoneヘルスケアに直接書き込みできます。
              </p>
            </div>

            <div className="flex items-center gap-2 shrink-0 z-10">
              <div className="bg-white/10 backdrop-blur-md px-3.5 py-2 rounded-2xl border border-white/15 text-center">
                <div className="text-[10px] text-slate-300 font-bold">体重</div>
                <div className="text-sm font-mono font-black text-white">{bodyStats.weight} <span className="text-[10px] font-normal">kg</span></div>
              </div>
              <div className="bg-white/10 backdrop-blur-md px-3.5 py-2 rounded-2xl border border-white/15 text-center">
                <div className="text-[10px] text-slate-300 font-bold">体脂肪率</div>
                <div className="text-sm font-mono font-black text-yellow-300">{bodyStats.bodyFat} <span className="text-[10px] font-normal">%</span></div>
              </div>
              <button
                onClick={onOpenHealth}
                className="px-3.5 py-2 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs rounded-2xl shadow-glow transition-all active:scale-95 flex items-center gap-1.5"
              >
                <span>体組成管理</span>
                <ChevronRight size={14} />
              </button>
            </div>

            <div className="absolute right-0 top-0 bottom-0 w-80 bg-gradient-to-l from-yellow-400/10 to-transparent pointer-events-none" />
          </div>

          <div className="bg-white p-4 sm:p-5 rounded-3xl border border-slate-200/80 shadow-card space-y-3.5">
            <div className="flex items-center justify-between px-1 text-xs text-slate-500 font-medium">
              <span className="flex items-center gap-1.5 font-bold">
                <Search size={14} className="text-amber-600" />
                <span>食品データベース検索:</span>
                <span className="text-slate-900 font-mono font-black">{totalCount.toLocaleString()}</span>
                <span className="text-slate-400 font-normal">品目</span>
              </span>
              <span className="text-[11px] text-slate-400 hidden sm:inline">
                ※漢字・ひらがな・カタカナ・日常語シノニム完全対応
              </span>
            </div>

            <div className="relative">
              <div className="absolute inset-y-0 left-3.5 flex items-center pointer-events-none text-slate-400">
                <Search size={18} />
              </div>
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="食材名で検索（例: 鶏もも肉, 豚バラ, 鮭, 玉ねぎ, 米油, レモン, もち麦...）"
                className="w-full bg-slate-50 border border-slate-200/80 rounded-2xl pl-11 pr-10 py-3 text-slate-900 placeholder-slate-400 font-medium focus:outline-none focus:ring-2 focus:ring-amber-400/40 focus:border-amber-400 transition-all shadow-inner"
              />
              {searchQuery && (
                <button
                  onClick={() => setSearchQuery('')}
                  className="absolute inset-y-0 right-3 flex items-center text-slate-400 hover:text-slate-600 p-1"
                >
                  <XIcon size={16} />
                </button>
              )}
            </div>

            <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none pt-0.5">
              {[
                { id: 'all', name: 'すべて', emoji: '🍽️' },
                { id: '11', name: '肉類', emoji: '🍗' },
                { id: '10', name: '魚介類', emoji: '🐟' },
                { id: '06', name: '野菜類', emoji: '🥦' },
                { id: '14', name: '油脂類', emoji: '🫒' },
                { id: '01', name: '穀類', emoji: '🍚' },
                { id: '04', name: '豆類', emoji: '🫘' },
                { id: '12', name: '卵類', emoji: '🥚' },
                { id: '13', name: '乳類', emoji: '🥛' },
                { id: '07', name: '果実類', emoji: '🍋' },
                { id: '08', name: 'きのこ類', emoji: '🍄' },
                { id: '09', name: '藻類', emoji: '🌿' }
              ].map(cat => {
                const isSelected = selectedCategory === cat.id;
                return (
                  <button
                    key={cat.id}
                    onClick={() => setSelectedCategory(cat.id)}
                    className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all shrink-0 border ${
                      isSelected
                        ? 'bg-slate-900 text-yellow-300 border-slate-900 shadow-sm font-black'
                        : 'bg-white hover:bg-yellow-50/60 border-slate-200/80 text-slate-600'
                    }`}
                  >
                    <span>{cat.emoji}</span>
                    <span>{cat.name}</span>
                  </button>
                );
              })}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-3.5">
            {filteredFoods.length === 0 ? (

                      <div className="flex items-center gap-1.5 flex-wrap">

                        </span>
                        <span className="text-slate-300">•</span>
                        <span className="text-[11px] font-mono">
                          <span className="text-rose-600 font-bold">P</span> {food.protein}g
                        </span>
                        <span className="text-[11px] font-mono">
                          <span className="text-amber-600 font-bold">F</span> {food.fat}g
                        </span>
                        <span className="text-[11px] font-mono">
                          <span className="text-sky-600 font-bold">C</span> {food.carb}g

                    <ChevronRight size={16} />
                  </div>
                </div>
              ))

          </div>
        </div>
      );
    }

    // --- 詳細画面 (DetailScreen) ---
    function DetailScreen({
      food, currentGrams, onChangeGrams, activeUnit, onChangeUnit,
      isPurchasedWeight, onChangePurchasedWeight, currentDri, isFavorite,
      onToggleFavorite, onBack, onAddToRecipe, onRecordToHealthKit, onAddToCompare, onCopySummary

      const [justAdded, setJustAdded] = useState(false);

      const n = useMemo(() => calculateScaledNutrients(food, currentGrams, isPurchasedWeight), [food, currentGrams, isPurchasedWeight]);

      const mealDri = useMemo(() => {
        const res = {};
        Object.keys(currentDri).forEach((k) => {
          res[k] = (currentDri[k] ?? 0) / 3.0;
        });
        return res;
      }, [currentDri]);

      const handleAddClick = () => {
        onAddToRecipe(food.id, currentGrams, activeUnit, isPurchasedWeight);
        setJustAdded(true);
        setTimeout(() => setJustAdded(false), 2000);
      };

      const handleHealthKitClick = () => {
        onRecordToHealthKit({
          title: `${food.displayName} (${currentGrams}g)`,
          energy: n.energy,
          protein: n.protein,
          fat: n.fat,
          carb: n.carb,
          fiber: n.fiber,
          sugar: n.sugar,
          salt: n.salt,
          saturatedFat: n.saturatedFat,
          n3Fat: n.n3Fat,
          potassium: n.potassium,
          calcium: n.calcium,
          magnesium: n.magnesium,
          iron: n.iron,
          vitaminA: n.vitaminA,
          vitaminD: n.vitaminD,
          vitaminE: n.vitaminE,
          vitaminC: n.vitaminC
        });
        setJustHealthLogged(true);
        setTimeout(() => setJustHealthLogged(false), 3000);
      };

      const displayedNutrients = useMemo(() => {
        if (!n) return [];
        return LOCKED_NUTRIENT_REGISTRY.map((def) => {
          const val = n[def.key] ?? null;
          const dri = def.driKey ? mealDri[def.driKey] : null;
          let note = null;
          if (def.isNoteKey && n[def.isNoteKey] !== null && n[def.isNoteKey] !== undefined) {
            note = `${n[def.isNoteKey]}${def.noteSuffix || ''}`;
          }

          return {
            category: def.category,
            name: def.name,
            val,
            unit: def.unit,
            dri,
            isMaxLimit: !!def.isMaxLimit,
            highlight: !!def.isHighlight,
            note
          };
        });
      }, [n, mealDri]);

      const filteredNutrients = useMemo(() => {
        return displayedNutrients.filter((item) => {
          const matchCat = activeNutrientCategory === 'all' || item.category === activeNutrientCategory;
          const matchQuery = !nutrientFilterKeyword.trim() || item.name.toLowerCase().includes(nutrientFilterKeyword.trim().toLowerCase());
          return matchCat && matchQuery;
        });
      }, [displayedNutrients, activeNutrientCategory, nutrientFilterKeyword]);

      const summaryText = `【NutriDex 栄養サマリー】\n食材: ${food.displayName}\n分量: ${currentGrams}g (${activeUnit}${isPurchasedWeight ? ` → 可食部${n.edibleGrams}g` : ''})\nエネルギー: ${n.energy}kcal (${n.energyKj}kJ)\nPFC: P ${n.protein}g (${n.pRatio}%) / F ${n.fat}g (${n.fRatio}%) / C ${n.carb}g (${n.cRatio}%)\n糖質: ${n.sugar}g / 食物繊維: ${n.fiber}g\nカリウム: ${n.potassium ?? '—'}mg / カルシウム: ${n.calcium ?? '—'}mg / 鉄: ${n.iron ?? '—'}mg / ビタミンC: ${n.vitaminC ?? '—'}mg / ビタミンE: ${n.vitaminE ?? '—'}mg\n出典: ${sourceInfo(food.source).label}`;

              <span>検索結果一覧へ戻る</span>

            <div className="flex items-center gap-2">
              <button
                onClick={onToggleFavorite}
                className={`p-2 rounded-xl border transition-all ${
                  isFavorite ? 'bg-rose-50 border-rose-200 text-rose-500 shadow-xs' : 'bg-white border-slate-200/80 text-slate-600 hover:bg-slate-50'

              <button
                onClick={() => onAddToCompare(food.id)}

                <Scale size={15} className="text-amber-600" />
                <span>VS比較</span>
              </button>

              <button
                onClick={handleHealthKitClick}

                  justHealthLogged
                    ? 'bg-rose-600 text-white border-rose-600'
                    : 'bg-rose-50 hover:bg-rose-100 text-rose-800 border-rose-200'

                title="iPhoneのヘルスケア（食事記録）に直接同期"
              >
                <AppleLogo size={13} className={justHealthLogged ? 'text-white' : 'text-rose-600'} />

              <button
                onClick={handleAddClick}
                className={`px-3.5 py-2 rounded-xl text-xs font-black flex items-center gap-1.5 shadow-sm transition-all active:scale-95 ${
                  justAdded
                    ? 'bg-amber-500 text-slate-950 ring-2 ring-yellow-300'
                    : 'bg-amber-400 hover:bg-amber-300 text-slate-950 shadow-amber-400/30'

                <span>{justAdded ? '追加完了！' : 'レシピに追加'}</span>
              </button>
            </div>
          </div>

          <div className="bg-white p-5 sm:p-6 rounded-3xl border border-slate-200/80 shadow-card space-y-5">
            <div className="flex items-start gap-4">
              <div className="w-16 h-16 sm:w-20 sm:h-20 rounded-3xl bg-gradient-to-tr from-amber-50 to-yellow-100/60 border border-yellow-200/80 flex items-center justify-center text-4xl sm:text-5xl shrink-0 shadow-xs">
                {food.categoryEmoji}
              </div>
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className={`text-[10px] px-2 py-0.5 rounded-full border ${sourceInfo(food.source).cls}`}>
                    {sourceInfo(food.source).label}

                  <span className="text-xs text-slate-400 font-mono font-bold">食品番号: #{food.foodCode}</span>
                  <span className="text-xs text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md font-medium">
                    {food.categoryName}
                  </span>
                </div>
                <h1 className="text-xl sm:text-2xl font-black text-slate-950 mt-1.5 tracking-tight">
                  {food.displayName}
                </h1>
                {food.shortName && food.shortName !== food.displayName && (
                  <p className="text-xs text-slate-400 mt-0.5 font-medium">短縮表記: {food.shortName}</p>
                )}
              </div>
            </div>

            <div className="bg-slate-50/80 p-4 sm:p-5 rounded-2xl border border-slate-200/60 space-y-3.5">
              <div className="flex justify-between items-center text-xs font-bold">
                <span className="flex items-center gap-1.5 text-slate-800">
                  <Sliders size={14} className="text-amber-600" />
                  <span>食べる分量: <span className="font-mono text-base font-black text-amber-800">{currentGrams}</span> g</span>
                  <span className="text-slate-500 font-normal">（{activeUnit}）</span>
                </span>
                {food.refuseRate > 0 && (
                  <span className="text-amber-800 bg-amber-50 border border-amber-300 px-2 py-0.5 rounded-md text-[11px]">
                    廃棄率: {food.refuseRate}% (実可食部: {n.edibleGrams}g)
                  </span>
                )}
              </div>

              <div className="flex flex-wrap gap-1.5">
                {food.portionUnits?.map((u, i) => {
                  const isUnitActive = activeUnit === u.name;
                  return (
                    <button
                      key={i}
                      onClick={() => {
                        onChangeGrams(u.grams);
                        onChangeUnit(u.name);
                        onChangePurchasedWeight(!!u.isPurchasedWeight);
                      }}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all border ${
                        isUnitActive
                          ? 'bg-slate-900 text-yellow-300 border-slate-900 shadow-xs font-black'
                          : 'bg-white hover:bg-yellow-50/60 border-slate-200 text-slate-700'
                      }`}
                    >
                      {u.name}
                    </button>
                  );
                })}
              </div>

              <div className="space-y-1">
                <input
                  type="range"
                  min="1"
                  max={Math.max(400, currentGrams * 1.5)}
                  step="1"
                  value={currentGrams}
                  onChange={(e) => { onChangeGrams(Number(e.target.value)); onChangeUnit('カスタム'); }}
                  className="w-full"
                />
                <div className="flex justify-between text-[10px] text-slate-400 font-mono">
                  <span>1g</span>
                  <span>100g</span>
                  <span>200g</span>
                  <span>{Math.round(Math.max(400, currentGrams * 1.5))}g</span>
                </div>
              </div>
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
              <div className="bg-slate-900 text-white p-4 rounded-2xl flex flex-col justify-between shadow-sm">
                <div className="text-[11px] text-slate-400 font-bold flex items-center justify-between">
                  <span>エネルギー</span>
                  <LemonSliceIcon size={14} className="text-yellow-400" />
                </div>
                <div className="mt-2">
                  <span className="text-2xl sm:text-3xl font-mono font-black tracking-tight">{n.energy}</span>
                  <span className="text-xs text-yellow-300 font-medium ml-1">kcal</span>
                </div>
                <div className="text-[10px] text-slate-400 font-mono mt-1">{n.energyKj} kJ</div>
              </div>

              <div className="bg-rose-50/70 border border-rose-100 p-4 rounded-2xl flex flex-col justify-between">
                <div className="text-[11px] text-rose-700 font-bold flex items-center justify-between">
                  <span>タンパク質 (P)</span>
                  <span className="text-[10px] font-mono bg-rose-100 px-1.5 py-0.2 rounded font-bold">{n.pRatio}%</span>
                </div>
                <div className="mt-2">
                  <span className="text-2xl sm:text-3xl font-mono font-black text-rose-900 tracking-tight">{n.protein}</span>
                  <span className="text-xs text-rose-700 font-medium ml-1">g</span>
                </div>
                <div className="text-[10px] text-rose-600 font-mono mt-1">{Math.round(n.protein * 4)} kcal</div>
              </div>

              <div className="bg-amber-50/70 border border-amber-200/80 p-4 rounded-2xl flex flex-col justify-between">
                <div className="text-[11px] text-amber-800 font-bold flex items-center justify-between">
                  <span>脂質 (F)</span>
                  <span className="text-[10px] font-mono bg-amber-100 px-1.5 py-0.2 rounded font-bold">{n.fRatio}%</span>
                </div>
                <div className="mt-2">
                  <span className="text-2xl sm:text-3xl font-mono font-black text-amber-950 tracking-tight">{n.fat}</span>
                  <span className="text-xs text-amber-800 font-medium ml-1">g</span>
                </div>
                <div className="text-[10px] text-amber-700 font-mono mt-1">{Math.round(n.fat * 9)} kcal</div>
              </div>

              <div className="bg-sky-50/70 border border-sky-100 p-4 rounded-2xl flex flex-col justify-between">
                <div className="text-[11px] text-sky-700 font-bold flex items-center justify-between">
                  <span>炭水化物 (C)</span>
                  <span className="text-[10px] font-mono bg-sky-100 px-1.5 py-0.2 rounded font-bold">{n.cRatio}%</span>
                </div>
                <div className="mt-2">
                  <span className="text-2xl sm:text-3xl font-mono font-black text-sky-900 tracking-tight">{n.carb}</span>
                  <span className="text-xs text-sky-700 font-medium ml-1">g</span>
                </div>
                <div className="text-[10px] text-sky-600 font-mono mt-1">糖質 {n.sugar}g / 食物繊維 {n.fiber}g</div>
              </div>
            </div>

            <div className="space-y-1.5">
              <div className="flex justify-between text-[11px] font-bold text-slate-500">
                <span>PFC カロリー比率バランス</span>
                <span className="font-mono">P {n.pRatio}% : F {n.fRatio}% : C {n.cRatio}%</span>
              </div>
              <div className="h-3 w-full bg-slate-100 rounded-full overflow-hidden flex shadow-inner">
                <div style={{ width: `${n.pRatio}%` }} className="bg-rose-500 transition-all duration-300" />
                <div style={{ width: `${n.fRatio}%` }} className="bg-amber-400 transition-all duration-300" />
                <div style={{ width: `${n.cRatio}%` }} className="bg-sky-400 transition-all duration-300" />
              </div>
            </div>

            <button
              onClick={() => onCopySummary(summaryText)}
              className="w-full py-2.5 bg-yellow-50/50 hover:bg-yellow-50 text-amber-900 border border-yellow-200 rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 transition-colors"
            >
              <Copy size={14} className="text-amber-700" />
              <span>栄養サマリーをクリップボードにコピー</span>
            </button>
          </div>

          <div className="bg-white p-5 sm:p-6 rounded-3xl border border-slate-200/80 shadow-card space-y-4">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-4">
              <div>
                <h3 className="text-base font-extrabold text-slate-900 flex items-center gap-2">
                  <Activity size={18} className="text-amber-600" />
                  <span>確定全栄養素一覧（全63項目完全網羅）</span>
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-50 text-amber-800 border border-amber-300 flex items-center gap-1">
                    <Lock size={10} />
                    <span>永久固定仕様</span>
                  </span>
                </h3>
                <p className="text-xs text-slate-400 mt-0.5">
                  厚生労働省「日本人の食事摂取基準」1食目安（1日の1/3）に対する充足率バー付き
                </p>
              </div>

              <div className="relative w-full sm:w-56">
                <input
                  type="text"
                  value={nutrientFilterKeyword}
                  onChange={(e) => setNutrientFilterKeyword(e.target.value)}
                  placeholder="栄養素名で絞込..."
                  className="w-full text-xs bg-slate-50 border border-slate-200/80 rounded-xl px-3 py-2 focus:outline-none focus:ring-1 focus:ring-amber-400 font-medium"
                />
                {nutrientFilterKeyword && (
                  <button onClick={() => setNutrientFilterKeyword('')} className="absolute right-2.5 top-2 text-slate-400 hover:text-slate-600">
                    <XIcon size={14} />
                  </button>
                )}
              </div>
            </div>

            <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none w-full">
              {NUTRIENT_TABS.map((tab) => (
                <button
                  key={tab.id}
                  onClick={() => setActiveNutrientCategory(tab.id)}
                  className={`px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all border shrink-0 ${
                    activeNutrientCategory === tab.id
                      ? 'bg-slate-900 border-slate-900 text-yellow-300 shadow-xs font-black'
                      : 'bg-slate-50 border-slate-200/80 text-slate-600 hover:bg-yellow-50/50'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5 max-h-[620px] overflow-y-auto pr-1">
              {filteredNutrients.map((item, idx) => {
                const hasVal = item.val !== null && item.val !== undefined;
                const ratio = (hasVal && item.dri && item.dri > 0) ? Math.round((Number(item.val) / item.dri) * 100) : null;
                const isOver = item.isMaxLimit && ratio && ratio > 100;

                return (
                  <div
                    key={idx}
                    className="p-3.5 rounded-2xl bg-slate-50/70 border border-slate-200/70 hover:border-amber-300 hover:bg-white transition-all flex flex-col justify-between"
                  >
                    <div className="flex items-start justify-between gap-2">
                      <div>
                        <div className="flex items-center gap-1.5 flex-wrap">
                          <span className="text-xs font-bold text-slate-800">{item.name}</span>
                          {item.highlight && (
                            <span className="text-[9px] px-1.5 py-0.2 rounded font-black bg-amber-100 text-amber-900 border border-amber-300">
                              主要
                            </span>
                          )}
                        </div>
                        {item.note && <span className="text-[10px] text-slate-400 font-mono">{item.note}</span>}
                      </div>

                      <div className="text-right shrink-0">
                        <span className="text-sm font-mono font-black text-slate-950">
                          {hasVal ? item.val : '—'}
                        </span>
                        {hasVal && item.unit && (
                          <span className="text-[11px] text-slate-500 font-medium ml-0.5">{item.unit}</span>
                        )}
                      </div>

                    {item.dri && (
                      <div className="mt-2.5 space-y-1">

                            </span>

                              isOver ? 'bg-rose-500' : 'bg-amber-400'
                            }`}

      );

    // --- くらべる画面 (CompareScreen) ---
    function CompareScreen({ foodMaster, foodAConfig, foodBConfig, onChangeFoodA, onChangeFoodB, onSelectFood }) {
      const fA = foodMaster.find(f => f.id === foodAConfig.id || f.foodCode === foodAConfig.id) || foodMaster[0];
      const fB = foodMaster.find(f => f.id === foodBConfig.id || f.foodCode === foodBConfig.id) || foodMaster[1] || foodMaster[0];
      const nA = calculateScaledNutrients(fA, foodAConfig.grams);
      const nB = calculateScaledNutrients(fB, foodBConfig.grams);

      const compareOptions = useMemo(() => {
        const set = new Map();
        if (fA) set.set(fA.id, fA);
        if (fB) set.set(fB.id, fB);
        foodMaster.slice(0, 200).forEach(f => set.set(f.id, f));
        return Array.from(set.values());
      }, [foodMaster, fA, fB]);

      const handleSwap = () => {
        const temp = { ...foodAConfig };
        onChangeFoodA(foodBConfig);
        onChangeFoodB(temp);
      };

      const compareRows = [
        { label: 'エネルギー', valA: nA.energy, valB: nB.energy, unit: 'kcal' },
        { label: 'タンパク質', valA: nA.protein, valB: nB.protein, unit: 'g' },
        { label: '脂質', valA: nA.fat, valB: nB.fat, unit: 'g' },
        { label: '炭水化物', valA: nA.carb, valB: nB.carb, unit: 'g' },
        { label: '糖質', valA: nA.sugar, valB: nB.sugar, unit: 'g' },

    // --- レシピ計算画面 (RecipeScreen) ---
    function RecipeScreen({ foodMaster, title, onChangeTitle, servings, onChangeServings, items, onChangeItems, onAddMore, onSelectFood, onOpenHealth, onRecordToHealthKit }) {
      const [justHealthLogged, setJustHealthLogged] = useState(false);

      const handleGramChange = (idx, delta) => {
        onChangeItems(items.map((it, i) => {
          if (i === idx) {
            const nextG = Math.max(1, it.grams + delta);
            return { ...it, grams: nextG };
          }
          return it;
        }));
      };

      const handleRemove = (idx) => {
        onChangeItems(items.filter((_, i) => i !== idx));
      };

      const totals = useMemo(() => {
        let energy = 0, protein = 0, fat = 0, carb = 0, sugar = 0, fiber = 0, salt = 0, saturatedFat = 0, n3Fat = 0, potassium = 0, calcium = 0, magnesium = 0, iron = 0, vitaminA = 0, vitaminD = 0, vitaminE = 0, vitaminC = 0;
        items.forEach(item => {
          const f = foodMaster.find(x => x.id === item.foodId || x.foodCode === item.foodId);
          if (f) {
            const sc = calculateScaledNutrients(f, item.grams, item.isPurchased);
            energy += sc.energy;
            protein += sc.protein;
            fat += sc.fat;
            carb += sc.carb;
            sugar += sc.sugar;
            fiber += sc.fiber;
            salt += sc.salt;
            saturatedFat += sc.saturatedFat || 0;
            n3Fat += sc.n3Fat || 0;
            potassium += sc.potassium || 0;
            calcium += sc.calcium || 0;
            magnesium += sc.magnesium || 0;
            iron += sc.iron || 0;
            vitaminA += sc.vitaminA || 0;
            vitaminD += sc.vitaminD || 0;
            vitaminE += sc.vitaminE || 0;
            vitaminC += sc.vitaminC || 0;
          }
        });

        const s = Math.max(1, Number(servings) || 1);
        const perServing = {
          energy: Math.round(energy / s),
          protein: +(protein / s).toFixed(1),
          fat: +(fat / s).toFixed(1),
          carb: +(carb / s).toFixed(1),
          sugar: +(sugar / s).toFixed(1),
          fiber: +(fiber / s).toFixed(1),
          salt: +(salt / s).toFixed(2),
          saturatedFat: +(saturatedFat / s).toFixed(2),
          n3Fat: +(n3Fat / s).toFixed(2),
          potassium: Math.round(potassium / s),
          calcium: Math.round(calcium / s),
          magnesium: Math.round(magnesium / s),
          iron: +(iron / s).toFixed(1),
          vitaminA: Math.round(vitaminA / s),
          vitaminD: +(vitaminD / s).toFixed(1),
          vitaminE: +(vitaminE / s).toFixed(1),
          vitaminC: Math.round(vitaminC / s)
        };

        const pKcal = perServing.protein * 4;
        const fKcal = perServing.fat * 9;
        const cKcal = perServing.carb * 4;
        const totalPfc = pKcal + fKcal + cKcal;
        let pRatio = 0, fRatio = 0, cRatio = 0;
        if (totalPfc > 0) {
          pRatio = Math.round((pKcal / totalPfc) * 100);
          fRatio = Math.round((fKcal / totalPfc) * 100);
          cRatio = Math.max(0, 100 - (pRatio + fRatio));
        }

        return {
          totalEnergy: Math.round(energy),
          perServing,
          pRatio, fRatio, cRatio
        };
      }, [foodMaster, items, servings]);

      const handleHealthKitRecord = () => {
        onRecordToHealthKit({
          title: `${title} (1人前)`,
          energy: totals.perServing.energy,
          protein: totals.perServing.protein,
          fat: totals.perServing.fat,
          carb: totals.perServing.carb,
          fiber: totals.perServing.fiber,
          sugar: totals.perServing.sugar,
          salt: totals.perServing.salt,
          saturatedFat: totals.perServing.saturatedFat,
          n3Fat: totals.perServing.n3Fat,
          potassium: totals.perServing.potassium,
          calcium: totals.perServing.calcium,
          magnesium: totals.perServing.magnesium,
          iron: totals.perServing.iron,
          vitaminA: totals.perServing.vitaminA,
          vitaminD: totals.perServing.vitaminD,
          vitaminE: totals.perServing.vitaminE,
          vitaminC: totals.perServing.vitaminC
        });
        setJustHealthLogged(true);
        setTimeout(() => setJustHealthLogged(false), 3000);
      };

      const recipeSummaryText = `【NutriDex レシピ計算】\n料理名: ${title}\n登録食材: ${items.length}品\n出来上がり: ${servings}人前\n1人前あたり: ${totals.perServing.energy} kcal\nPFC: P ${totals.perServing.protein}g (${totals.pRatio}%) / F ${totals.perServing.fat}g (${totals.fRatio}%) / C ${totals.perServing.carb}g (${totals.cRatio}%)\n糖質: ${totals.perServing.sugar}g / 食物繊維: ${totals.perServing.fiber}g / 食塩: ${totals.perServing.salt}g`;

      const copyToClipboard = () => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(recipeSummaryText).then(() => {
            alert('レシピ栄養サマリーをクリップボードにコピーしました！');
          }).catch(() => {});
        }
      };

      return (
        <div className="max-w-3xl mx-auto space-y-4">
          <div className="bg-white p-4 sm:p-5 rounded-3xl border border-slate-200/80 shadow-card space-y-3">
            <div className="flex items-center justify-between flex-wrap gap-2">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
                  <Calculator size={18} />
                </div>
                <span className="font-extrabold text-slate-900 text-sm">マイレシピ・合算栄養計算</span>
              </div>
              <div className="flex items-center gap-2 text-xs">
                <span className="text-slate-500 font-bold">出来上がり人数:</span>
                <select
                  value={servings}
                  onChange={(e) => onChangeServings(Number(e.target.value))}
                  className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-1 text-slate-900 font-bold focus:outline-none"
                >
                  {[1, 2, 3, 4, 5, 6].map(num => <option key={num} value={num}>{num} 人前</option>)}
                </select>
              </div>
            </div>

            <input
              type="text"

              className="w-full bg-slate-50 border border-slate-200/80 rounded-2xl px-3.5 py-2.5 text-xs sm:text-sm font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-400/40"
            />
          </div>

          <div className="space-y-2.5">
            <div className="flex items-center justify-between px-1 text-xs font-bold text-slate-500">
              <span>登録食材（{items.length}品）</span>
              <button
                onClick={onAddMore}
                className="flex items-center gap-1 text-amber-800 hover:text-amber-950 font-black"
              >
                <Plus size={15} />
                <span>食材を検索して追加</span>
              </button>
            </div>

            {items.length === 0 ? (
              <div className="bg-white p-8 rounded-3xl border border-dashed border-slate-300 text-center space-y-3 shadow-subtle">
                <div className="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center mx-auto text-xl">
                  🛒
                </div>
                <div className="space-y-1">
                  <h4 className="text-xs sm:text-sm font-extrabold text-slate-800">レシピに食材が入っていません</h4>
                  <p className="text-xs text-slate-400">
                    「さがす」画面や食材詳細画面の <span className="font-bold text-amber-800">「レシピに追加」</span> ボタンを押すと、ここに食材が追加されて合計栄養が自動計算されます。
                  </p>
                </div>
                <button
                  onClick={onAddMore}
                  className="px-4 py-2 bg-amber-400 hover:bg-amber-300 text-slate-950 rounded-xl text-xs font-black shadow-xs inline-flex items-center gap-1.5"
                >
                  <Search size={14} />
                  <span>食材を探しにいく</span>
                </button>
              </div>
            ) : (
              items.map((item, idx) => {
                const f = foodMaster.find(x => x.id === item.foodId || x.foodCode === item.foodId);
                if (!f) return null;
                const sc = calculateScaledNutrients(f, item.grams, item.isPurchased);

                return (
                  <div key={idx} className="bg-white p-3.5 sm:p-4 rounded-3xl border border-slate-200/80 flex items-center justify-between gap-3 shadow-subtle">
                    <div
                      className="flex items-center gap-3 min-w-0 flex-1 cursor-pointer"
                      onClick={() => onSelectFood(f.id)}
                      title="タップして詳細を確認"
                    >
                      <span className="text-2xl sm:text-3xl shrink-0">{f.categoryEmoji}</span>
                      <div className="min-w-0 flex-1">
                        <h4 className="text-xs sm:text-sm font-bold text-slate-800 truncate hover:text-amber-800">{f.shortName || f.displayName}</h4>
                        <p className="text-[11px] text-slate-500 mt-0.5 truncate font-mono">
                          {item.grams}g • <span className="text-slate-900 font-bold">{sc.energy} kcal</span> (P:{sc.protein} F:{sc.fat} C:{sc.carb})
                        </p>
                      </div>
                    </div>

                    <div className="flex items-center gap-1 sm:gap-2 shrink-0">
                      <div className="flex items-center bg-slate-50 rounded-xl border border-slate-200 p-0.5">
                        <button
                          onClick={() => handleGramChange(idx, -10)}
                          className="w-7 h-7 flex items-center justify-center text-slate-600 hover:bg-slate-200 rounded-lg"
                        >
                          <Minus size={13} />
                        </button>
                        <span className="px-2 text-xs font-mono font-bold text-slate-900 min-w-[2.5rem] text-center">
                          {item.grams}g
                        </span>
                        <button
                          onClick={() => handleGramChange(idx, 10)}

                          <Plus size={13} />
                        </button>
                      </div>

                      <button

                      >
                        <Trash2 size={16} />
                      </button>
                    </div>
                  </div>
                );
              })
            )}
          </div>

          {items.length > 0 && (
            <div className="bg-gradient-to-br from-yellow-50/80 via-white to-amber-50/50 p-4 sm:p-5 rounded-3xl border border-amber-300/80 space-y-4 shadow-card">
              <div className="flex items-baseline justify-between border-b border-amber-200 pb-3 flex-wrap gap-2">
                <div>
                  <span className="text-xs font-bold text-amber-900">
                    1人前あたり ({servings}人前換算 / 料理全体 {totals.totalEnergy} kcal)
                  </span>
                  <div className="flex items-baseline gap-1.5 mt-0.5">

                  <span>P:{totals.pRatio}% / F:{totals.fRatio}% / C:{totals.cRatio}%</span>
                </div>
                <div className="h-3 w-full bg-slate-100 rounded-full overflow-hidden flex shadow-inner">
                  <div style={{ width: `${totals.pRatio}%` }} className="bg-rose-500" />

                  <div className="font-mono font-black text-slate-900 text-sm mt-0.5">{totals.perServing.protein}g</div>
                </div>

    // --- iPhoneヘルスケア & 体組成連動モーダル (HealthKitModal) ---
    function HealthKitModal({ bodyStats, onChangeStats, onClose, showToast }) {
      const [localStats, setLocalStats] = useState(bodyStats);
      const [activeSubTab, setActiveSubTab] = useState('overview');
      const [isSyncing, setIsSyncing] = useState(false);

      const heightM = (localStats.height || 170) / 100;
      const bmi = +(localStats.weight / (heightM * heightM)).toFixed(1);
      const lbm = +(localStats.weight * (1 - (localStats.bodyFat || 15) / 100)).toFixed(1);
      const estimatedBmr = Math.round(370 + (21.6 * lbm));

      const handleHealthKitSync = async () => {
        setIsSyncing(true);
        try {
          if (window.NutriDexHealthKit && typeof window.NutriDexHealthKit.queryLatestBodyStats === 'function') {
            await window.NutriDexHealthKit.requestAuthorization();
            const stats = await window.NutriDexHealthKit.queryLatestBodyStats();
            if (stats && stats.weight) {
              setLocalStats(prev => ({
                ...prev,
                weight: stats.weight,
                bodyFat: stats.bodyFat || prev.bodyFat,
                lastHealthKitSync: new Date().toLocaleTimeString()
              }));
              showToast(`🍎 ヘルスケアから最新の体組成（体重: ${stats.weight}kg）を同期しました！`);
              setIsSyncing(false);
              return;
            }
          }
          showToast('ヘルスケア連携モジュール待機中（入力値を保持します）');
        } catch (err) {
          showToast(`ヘルスケア同期: ${err.message || 'データ取得完了'}`);
        }
        setIsSyncing(false);
      };

      const handleSave = () => {
        onChangeStats(localStats);
        showToast('体組成設定を保存しました');
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-3.5 sm:p-4">
          <div className="bg-white border border-slate-200/80 w-full max-w-lg rounded-3xl p-5 sm:p-6 space-y-4 shadow-float max-h-[92vh] overflow-y-auto">
            
            <div className="flex justify-between items-center border-b border-slate-100 pb-3">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-xl bg-rose-50 text-rose-500 flex items-center justify-center">
                  <AppleLogo size={18} className="text-rose-600" />
                </div>
                <div>
                  <h3 className="text-sm sm:text-base font-extrabold text-slate-900">Apple HealthKit ＆ 体組成マネジメント</h3>
                  <p className="text-[11px] text-slate-400">iPhoneヘルスケア同期 & 体組成スケーリング</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1">
                <XIcon size={18} />
              </button>
            </div>

            <div className="flex gap-1.5 p-1 bg-slate-100 rounded-xl text-xs font-bold">
              <button
                onClick={() => setActiveSubTab('overview')}
                className={`flex-1 py-1.5 rounded-lg transition-all ${activeSubTab === 'overview' ? 'bg-white shadow-xs text-slate-900' : 'text-slate-500'}`}
              >
                体組成データ & 同期
              </button>
              <button
                onClick={() => setActiveSubTab('healthkit')}
                className={`flex-1 py-1.5 rounded-lg transition-all ${activeSubTab === 'healthkit' ? 'bg-white shadow-xs text-slate-900' : 'text-slate-500'}`}
              >
                ヘルスケア連携仕様
              </button>
            </div>

            {activeSubTab === 'overview' ? (
              <div className="space-y-4">
                <button
                  onClick={handleHealthKitSync}
                  disabled={isSyncing}
                  className="w-full py-3 bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-bold text-xs rounded-2xl shadow-sm flex items-center justify-center gap-2 transition-all active:scale-98"
                >
                  <AppleLogo size={15} className="text-white" />
                  <span>{isSyncing ? 'ヘルスケアと同期中...' : 'iPhoneヘルスケアから最新の体重・体組成を自動同期'}</span>
                </button>

                {localStats.lastHealthKitSync && (
                  <div className="text-[10px] text-center text-slate-400 font-mono">
                    最終ヘルスケア同期: {localStats.lastHealthKitSync}
                  </div>
                )}

                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200/80 space-y-1">
                    <label className="text-[11px] font-bold text-slate-500">体重 (kg)</label>
                    <input
                      type="number"
                      step="0.1"
                      value={localStats.weight}
                      onChange={(e) => setLocalStats({ ...localStats, weight: Number(e.target.value) })}
                      className="w-full text-base font-mono font-bold bg-transparent focus:outline-none"
                    />
                  </div>
                  <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200/80 space-y-1">
                    <label className="text-[11px] font-bold text-slate-500">体脂肪率 (%)</label>
                    <input
                      type="number"
                      step="0.1"
                      value={localStats.bodyFat}
                      onChange={(e) => setLocalStats({ ...localStats, bodyFat: Number(e.target.value) })}
                      className="w-full text-base font-mono font-bold bg-transparent focus:outline-none text-emerald-700"
                    />
                  </div>
                  <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200/80 space-y-1">
                    <label className="text-[11px] font-bold text-slate-500">身長 (cm)</label>
                    <input
                      type="number"
                      value={localStats.height}
                      onChange={(e) => setLocalStats({ ...localStats, height: Number(e.target.value) })}
                      className="w-full text-base font-mono font-bold bg-transparent focus:outline-none"
                    />
                  </div>
                  <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200/80 space-y-1">
                    <label className="text-[11px] font-bold text-slate-500">1日目標摂取カロリー</label>
                    <input
                      type="number"
                      step="50"
                      value={localStats.targetCalories}
                      onChange={(e) => setLocalStats({ ...localStats, targetCalories: Number(e.target.value) })}
                      className="w-full text-base font-mono font-bold bg-transparent focus:outline-none text-slate-900"
                    />
                  </div>
                </div>

                <div className="bg-gradient-to-br from-slate-900 to-slate-800 text-white p-4 rounded-2xl space-y-3 shadow-md">
                  <div className="text-xs font-bold text-slate-300 flex items-center gap-1.5">
                    <Activity size={14} className="text-emerald-400" />
                    <span>体組成メトリクス解析結果</span>
                  </div>
                  <div className="grid grid-cols-3 gap-2 text-center">
                    <div>
                      <div className="text-[10px] text-slate-400">BMI</div>
                      <div className="text-lg font-mono font-black mt-0.5">{bmi}</div>
                    </div>
                    <div>
                      <div className="text-[10px] text-slate-400">除脂肪体重 (LBM)</div>
                      <div className="text-lg font-mono font-black mt-0.5 text-emerald-400">{lbm} <span className="text-xs font-normal">kg</span></div>
                    </div>
                    <div>
                      <div className="text-[10px] text-slate-400">推定基礎代謝 (BMR)</div>
                      <div className="text-lg font-mono font-black mt-0.5 text-sky-400">{estimatedBmr} <span className="text-xs font-normal">kcal</span></div>
                    </div>
                  </div>
                </div>
              </div>
            ) : (
              <div className="space-y-3.5 text-xs leading-relaxed text-slate-600 bg-slate-50 p-4 rounded-2xl border border-slate-200/80">
                <div className="flex items-start gap-2">
                  <AppleLogo size={18} className="text-slate-900 shrink-0 mt-0.5" />
                  <div>
                    <h4 className="font-bold text-slate-900">Apple HealthKit 相互通信仕様</h4>
                    <p className="text-[11px] text-slate-500 mt-0.5">
                      NutriDex は iOS Native (Capacitor) および PWA ショートカット連携の双方で、Appleヘルスケアの下記データ型と完全同期します。
                    </p>
                  </div>
                </div>

                <div className="space-y-2">
                  <div className="font-bold text-slate-700">【読み込み項目 (HealthKit ➔ NutriDex)】</div>
                  <div className="grid grid-cols-2 gap-1.5 font-mono text-[11px]">
                    <div className="bg-white p-2 rounded-xl border">✓ 体重 (Body Mass)</div>
                    <div className="bg-white p-2 rounded-xl border">✓ 体脂肪率 (Body Fat %)</div>
                    <div className="bg-white p-2 rounded-xl border">✓ 除脂肪体重 (Lean Mass)</div>
                    <div className="bg-white p-2 rounded-xl border">✓ 身長 (Height)</div>
                  </div>

                  <div className="font-bold text-slate-700 pt-1">【書き込み項目 (NutriDex ➔ ヘルスケア)】</div>
                  <div className="grid grid-cols-2 gap-1.5 font-mono text-[11px]">
                    <div className="bg-white p-2 rounded-xl border">✓ 食事エネルギー (kcal)</div>
                    <div className="bg-white p-2 rounded-xl border">✓ タンパク質 / 脂質 / 炭水化物</div>
                    <div className="bg-white p-2 rounded-xl border">✓ 飽和脂肪酸 / オメガ3脂肪酸</div>
                    <div className="bg-white p-2 rounded-xl border">✓ 食物繊維 / 糖質 / 食塩相当量</div>
                    <div className="bg-white p-2 rounded-xl border">✓ 各種ビタミン (A, C, D, E等)</div>
                    <div className="bg-white p-2 rounded-xl border">✓ 各種ミネラル (鉄, カルシウム, マグネシウム等)</div>
                  </div>
                </div>
              </div>
            )}

            <div className="flex gap-2 pt-2">
              <button onClick={onClose} className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all">
                キャンセル
              </button>
              <button onClick={handleSave} className="flex-1 py-2.5 bg-amber-400 hover:bg-amber-300 text-slate-950 rounded-xl text-xs font-black shadow-xs transition-all">
                設定を保存
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- 設定モーダル (SettingsModal) ---
    function SettingsModal({ userGender, onChangeGender, userAgeGroup, onChangeAgeGroup, onClose }) {
      return (
        <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white border border-slate-200/80 w-full max-w-md rounded-3xl p-5 sm:p-6 space-y-4 shadow-float">
            <div className="flex justify-between items-center border-b border-slate-100 pb-3">
              <h3 className="text-sm sm:text-base font-bold flex items-center gap-2 text-slate-900">
                <Settings size={16} className="text-slate-500" />
                <span>ユーザー設定・食事摂取基準</span>
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                <XIcon size={18} />
              </button>
            </div>

            <div className="space-y-3">
              <div className="space-y-1.5">
                <label className="text-xs font-bold text-slate-700">性別</label>
                <div className="flex gap-2">
                  <button
                    onClick={() => onChangeGender('male')}
                    className={`flex-1 py-2 text-xs font-bold rounded-xl border transition-all ${
                      userGender === 'male' ? 'bg-slate-900 text-yellow-300 border-slate-900 shadow-xs font-black' : 'bg-slate-50 border-slate-200 text-slate-700'
                    }`}
                  >
                    男性
                  </button>
                  <button
                    onClick={() => onChangeGender('female')}
                    className={`flex-1 py-2 text-xs font-bold rounded-xl border transition-all ${
                      userGender === 'female' ? 'bg-slate-900 text-yellow-300 border-slate-900 shadow-xs font-black' : 'bg-slate-50 border-slate-200 text-slate-700'
                    }`}
                  >
                    女性
                  </button>
                </div>
              </div>

              <div className="space-y-1.5">
                <label className="text-xs font-bold text-slate-700">年齢区分 (厚生労働省基準)</label>
                <div className="grid grid-cols-3 gap-2">
                  {['18-29', '30-49', '50-64'].map(age => (
                    <button
                      key={age}
                      onClick={() => onChangeAgeGroup(age)}
                      className={`py-2 text-xs font-bold rounded-xl border transition-all ${
                        userAgeGroup === age ? 'bg-slate-900 text-yellow-300 border-slate-900 shadow-xs font-black' : 'bg-slate-50 border-slate-200 text-slate-700'
                      }`}
                    >
                      {age} 歳
                    </button>
                  ))}
                </div>
              </div>
            </div>

            <button
              onClick={onClose}
              className="w-full py-2.5 bg-amber-400 hover:bg-amber-300 text-slate-950 rounded-xl text-xs font-black shadow-xs transition-all"
            >
              保存して閉じる
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
