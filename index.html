    function calculateScaledNutrients(food, grams, isPurchasedWeight = false) {
      if (!food) return null;
      const rawGrams = Math.max(0, Number(grams) || 0);
      const refuseRate = Number(food.refuseRate) || 0;
      const edibleGrams = isPurchasedWeight ? rawGrams * (1 - refuseRate / 100) : rawGrams;
      const ratio = edibleGrams / 100;

      const scaleNum = (val, decimals = 1) => (val === null || val === undefined) ? null : +(Number(val) * ratio).toFixed(decimals);
      const scaleInt = (val) => (val === null || val === undefined) ? null : Math.round(Number(val) * ratio);

      const energy = Math.round((food.energy ?? 0) * ratio);
      const energyKj = Math.round((food.energyKj ?? (food.energy ?? 0) * 4.184) * ratio);
      const protein = +( (food.protein ?? 0) * ratio ).toFixed(1);
      const fat = +( (food.fat ?? 0) * ratio ).toFixed(1);
      const carb = +( (food.carb ?? 0) * ratio ).toFixed(1);
      const fiber = +( (food.fiber ?? 0) * ratio ).toFixed(1);
      const sugar = +( (food.sugar ?? Math.max(0, (food.carb ?? 0) - (food.fiber ?? 0))) * ratio ).toFixed(1);
      const salt = +( (food.salt ?? 0) * ratio ).toFixed(2);

      const potassium = scaleInt(food.potassium);
      const calcium = scaleInt(food.calcium);
      const magnesium = scaleInt(food.magnesium);
      const iron = scaleNum(food.iron, 2);
      const zinc = scaleNum(food.zinc, 2);
      const vitaminA = scaleInt(food.vitaminA);
      const vitaminD = scaleNum(food.vitaminD, 1);
      const vitaminE = scaleNum(food.vitaminE, 1);
      const vitaminK = scaleInt(food.vitaminK);
      const vitaminB1 = scaleNum(food.vitaminB1, 2);
      const vitaminB2 = scaleNum(food.vitaminB2, 2);
      const vitaminC = scaleNum(food.vitaminC, 1);
      const saturatedFat = scaleNum(food.saturatedFat, 2);
      const monounsaturatedFat = scaleNum(food.monounsaturatedFat, 2);
      const polyunsaturatedFat = scaleNum(food.polyunsaturatedFat, 2);

      const pKcal = protein * 4;
      const fKcal = fat * 9;
      const cKcal = carb * 4;
      const totalKcalPfc = pKcal + fKcal + cKcal;
      let pRatio = 0, fRatio = 0, cRatio = 0;
      if (totalKcalPfc > 0) {
        pRatio = Math.round((pKcal / totalKcalPfc) * 100);
        fRatio = Math.round((fKcal / totalKcalPfc) * 100);
        cRatio = Math.max(0, 100 - (pRatio + fRatio));
      }

      return {
        edibleGrams: Math.round(edibleGrams),
        energy, energyKj, protein, fat, carb, sugar, fiber, salt,
        potassium, calcium, magnesium, iron, zinc,
        vitaminA, vitaminD, vitaminE, vitaminK, vitaminB1, vitaminB2, vitaminC,
        saturatedFat, monounsaturatedFat, polyunsaturatedFat,
        pRatio, fRatio, cRatio
      };
    }

    function transformExternalMextItem(raw, idx) {
      if (!raw || typeof raw !== 'object') return null;
      const code = String(raw.foodId || raw.foodCode || `MEXT-${idx}`).padStart(5, '0');
      const grp = String(raw.groupId || code.slice(0, 2)).padStart(2, '0');
      const cat = CATEGORY_MAP[grp] || { name: '一般食品', emoji: '🍽️' };
      const name = String(raw.foodName || raw.displayName || raw.name || '食品');
      const energy = numOrZero(raw.enercKcal ?? raw.energy);
      const protein = numOrZero(raw.prot ?? raw.protein);
      const fat = numOrZero(raw.fat);
      const carb = numOrZero(raw.chocdf ?? raw.carb);
      const fiber = numOrZero(raw.fib ?? raw.fiber);
      const sugar = numOrNull(raw.choavlm ?? raw.sugar) ?? Math.max(0, carb - fiber);
      const salt = numOrZero(raw.naclEq ?? raw.salt);
      const refuseRate = numOrZero(raw.refuse ?? raw.refuseRate);

      let kana = String(raw.kana || name);
      if (code === '14001' || name.includes('オリーブ油')) kana += ' おりーぶおいる オリーブオイル エクストラバージン';
      if (code === '14003' || name.includes('米ぬか油')) kana += ' こめあぶら こめゆ まいゆ 米油 こめ油 ライスオイル';
      if (code === '14002' || name.includes('ごま油')) kana += ' ごまあぶら ごまゆ 胡麻油';
      if (code === '14004' || name.includes('なたね油')) kana += ' きゃのーらゆ キャノーラ油 菜種油 サラダ油';

      let portionUnits = raw.portionUnits;
      if (!portionUnits || portionUnits.length === 0) {
        if (grp === '14') {
          portionUnits = [
            { name: '大さじ1 (12g)', grams: 12, isPurchasedWeight: false, isDefault: true },
            { name: '小さじ1 (4g)', grams: 4, isPurchasedWeight: false, isDefault: false },
            { name: '100g', grams: 100, isPurchasedWeight: false, isDefault: false }
          ];
        } else {
          portionUnits = [{ name: '100g', grams: 100, isPurchasedWeight: false, isDefault: true }];
        }
      }

      return {
        id: `mext_${code}`,
        foodCode: code,
        source: 'mext_official',
        name,
        displayName: name,
        shortName: name.split('/')[name.split('/').length - 1].split(' ')[0],
        kana,
        categoryCode: grp,
        categoryName: cat.name,
        categoryEmoji: cat.emoji,
        refuseRate,
        energy,
        energyKj: Math.round(energy * 4.184),
        protein,
        fat,
        carb,
        sugar,
        fiber,
        salt,
        potassium: numOrNull(raw.k ?? raw.potassium),
        calcium: numOrNull(raw.ca ?? raw.calcium),
        magnesium: numOrNull(raw.mg ?? raw.magnesium),
        iron: numOrNull(raw.fe ?? raw.iron),
        zinc: numOrNull(raw.zn ?? raw.zinc),
        vitaminA: numOrNull(raw.vitaRae ?? raw.vitaminA),
        vitaminD: numOrNull(raw.vitD ?? raw.vitaminD),
        vitaminE: numOrNull(raw.tocphA ?? raw.vitaminE),
        vitaminK: numOrNull(raw.vitK ?? raw.vitaminK),
        vitaminB1: numOrNull(raw.thia ?? raw.vitaminB1),
        vitaminB2: numOrNull(raw.ribf ?? raw.vitaminB2),
        vitaminC: numOrNull(raw.vitC ?? raw.vitaminC),
        saturatedFat: numOrNull(raw.fasat ?? raw.saturatedFat),
        monounsaturatedFat: numOrNull(raw.fams ?? raw.monounsaturatedFat),
        polyunsaturatedFat: numOrNull(raw.fapu ?? raw.polyunsaturatedFat),
        portionUnits: sanitizePortionUnits(portionUnits)
      };
    }

    function mergeFoodLists(base, incoming) {
      const codeMap = new Map();
      base.forEach(f => codeMap.set(f.foodCode, f));
      incoming.forEach(f => {
        if (f && f.foodCode) codeMap.set(f.foodCode, f);
      });
      return Array.from(codeMap.values());
    }

                  { id: 'recipe', label: 'けいさん', icon: Calculator, badge: recipeItems.length || null },
                  { id: 'favorites', label: '保存・履歴', icon: Bookmark, dot: favorites.length > 0 }
                ].map((item) => {
                  const Icon = item.icon;
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`px-3 lg:px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${
                        isActive ? 'bg-emerald-50 text-emerald-700 border border-emerald-200 shadow-sm' : 'text-slate-600 hover:bg-slate-100'
                      }`}
                    >
                      <Icon size={16} />
                      <span>{item.label}</span>
                      {item.badge && <span className="w-4 h-4 bg-emerald-600 text-white rounded-full text-[9px] flex items-center justify-center">{item.badge}</span>}
                    </button>
                  );
                })}
              </nav>

              <div className="flex items-center gap-1.5 sm:gap-2">
                <button
                  onClick={() => setIsSettingsOpen(true)}
                  className="px-2.5 py-1.5 rounded-xl bg-white hover:bg-emerald-50 text-xs font-semibold text-slate-700 border border-slate-200 transition-all flex items-center gap-1.5 shadow-sm"
                >
                  <Settings size={14} className="text-emerald-600" />
                  <span className="font-bold">{userGender === 'male' ? '男性' : '女性'} {userAgeGroup}</span>
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 w-full max-w-7xl mx-auto p-3.5 sm:p-6 lg:p-8 pb-28 box-border">
            {activeTab === 'home' && (
              <HomeScreen
                foods={foodMaster}
                totalCount={foodMaster.length}
                onSelectFood={handleSelectFood}
              />
            )}
            {activeTab === 'detail' && (
              <DetailScreen
                food={foodMaster.find(f => f.id === selectedFoodId) || foodMaster[0]}
                currentGrams={detailGrams}
                onChangeGrams={setDetailGrams}
                activeUnit={activePortionUnit}
                onChangeUnit={setActivePortionUnit}
                isPurchasedWeight={isPurchasedWeight}
                onChangePurchasedWeight={setIsPurchasedWeight}
                currentDri={currentDri}
                isFavorite={favorites.includes(selectedFoodId)}
                onToggleFavorite={() => {
                  setFavorites(prev => prev.includes(selectedFoodId) ? prev.filter(id => id !== selectedFoodId) : [...prev, selectedFoodId]);
                  showToast(favorites.includes(selectedFoodId) ? 'お気に入りを解除' : 'お気に入りに追加');
                }}
                onBack={() => setActiveTab('home')}
                onAddToRecipe={(id, g, u, p) => {
                  setRecipeItems(prev => [...prev, { foodId: id, grams: g, unitName: u, isPurchased: p }]);
                  showToast('マイレシピに追加しました');
                }}
                onAddToCompare={(id) => {
                  setCompareFoodB({ id, grams: 12, isPurchased: false });
                  setActiveTab('compare');
                }}
                onCopySummary={(txt) => {
                  const el = document.createElement('textarea');
                  el.value = txt;
                  document.body.appendChild(el);
                  el.select();
                  document.execCommand('copy');
                  document.body.removeChild(el);
                  showToast('栄養サマリーをコピーしました！');
                }}
              />
            )}
            {activeTab === 'compare' && (
              <CompareScreen
                foodMaster={foodMaster}
                foodAConfig={compareFoodA}
                foodBConfig={compareFoodB}
                onChangeFoodA={setCompareFoodA}
                onChangeFoodB={setCompareFoodB}
              />
            )}
            {activeTab === 'recipe' && (
              <RecipeScreen
                foodMaster={foodMaster}
                title={recipeTitle}
                onChangeTitle={setRecipeTitle}
                servings={servings}
                onChangeServings={setServings}
                items={recipeItems}
                onChangeItems={setRecipeItems}
                onAddMore={() => setActiveTab('home')}
              />
            )}
            {activeTab === 'favorites' && (
              <FavoritesScreen
                foodMaster={foodMaster}
                favoriteIds={favorites}
                historyIds={history}
                onSelectFood={handleSelectFood}
              />
            )}
          </main>

          {/* 右下バージョン */}
          <aside className="fixed bottom-14 md:bottom-3 right-3 z-30 pointer-events-none select-none">
            <span className="px-2 py-0.5 rounded-full bg-slate-900/80 text-white text-[10px] font-mono font-black shadow border border-white/20">
              {APP_VERSION}
            </span>
          </aside>

          {/* トースト */}
          {toastMessage && (
            <div className="fixed bottom-24 md:bottom-8 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 text-white px-4 py-2.5 rounded-2xl shadow-xl flex items-center gap-2 text-xs font-bold backdrop-blur-md">
              <Check size={16} className="text-emerald-400" />
              <span>{toastMessage}</span>
            </div>
          )}

          {/* 設定モーダル */}
          {isSettingsOpen && (
            <SettingsModal
              userGender={userGender}
              onChangeGender={setUserGender}
              userAgeGroup={userAgeGroup}
              onChangeAgeGroup={setUserAgeGroup}
              onClose={() => setIsSettingsOpen(false)}
            />
          )}
        </div>
      );
    }

    function HomeScreen({ foods, totalCount, onSelectFood }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');

      const filteredFoods = useMemo(() => {
        const q = normalizeSearch(searchQuery.trim());
        if (!q && selectedCategory === 'all') return foods.slice(0, 48);
        return foods.filter((f) => {
          const matchQ = !q || [f.name, f.displayName, f.shortName, f.kana, f.foodCode].some(v => normalizeSearch(v).includes(q));
          const matchCat = selectedCategory === 'all' || f.categoryCode === selectedCategory;
          return matchQ && matchCat;
        }).slice(0, 96);
      }, [foods, searchQuery, selectedCategory]);

      return (
        <div className="space-y-4 w-full">
          {/* 検索入力 */}
          <div className="bg-white p-4 sm:p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3">
            <div className="flex items-center justify-between px-1 text-xs text-slate-500 font-bold">
              <span>登録食品数: <span className="text-emerald-700 font-extrabold">{totalCount}品目</span></span>
              <span>※米油・オリーブ油・主要食材は即座に検索可能</span>
            </div>

            <div className="relative">
              <div className="absolute inset-y-0 left-3.5 flex items-center pointer-events-none text-emerald-600">
                <Search size={19} />
              </div>
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="米ぬか油, 米油, こめ油, オリーブ油, 鶏もも肉 など"
                className="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-11 pr-10 py-3 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
              />
              {searchQuery && (
                <button onClick={() => setSearchQuery('')} className="absolute inset-y-0 right-3 flex items-center text-slate-400">×</button>
              )}
            </div>

            {/* カテゴリ */}
            <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none">
              {[
                { id: 'all', name: 'すべて', emoji: '🍽️' },
                { id: '14', name: '油脂類', emoji: '🫒' },
                { id: '11', name: '肉類', emoji: '🍗' },
                { id: '06', name: '野菜類', emoji: '🥦' },
                { id: '10', name: '魚介類', emoji: '🐟' },
                { id: '01', name: '穀類', emoji: '🍚' },
                { id: '04', name: '豆類', emoji: '🫘' },
                { id: '12', name: '卵類', emoji: '🥚' },
                { id: '13', name: '乳類', emoji: '🧈' }
              ].map(cat => (
                <button
                  key={cat.id}
                  onClick={() => setSelectedCategory(cat.id)}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold border shrink-0 ${
                    selectedCategory === cat.id ? 'bg-emerald-50 border-emerald-300 text-emerald-800' : 'bg-white border-slate-200 text-slate-600'
                  }`}
                >
                  <span>{cat.emoji}</span>
                  <span>{cat.name}</span>
                </button>
              ))}
            </div>
          </div>

          {/* 一覧 */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
            {filteredFoods.map(food => (
              <div
                key={food.id}
                onClick={() => onSelectFood(food.id)}
                className="bg-white hover:bg-emerald-50/40 border border-slate-200 hover:border-emerald-300 p-4 rounded-3xl cursor-pointer transition-all flex items-center justify-between shadow-sm"
              >
                <div className="flex items-center gap-3 min-w-0">
                  <div className="w-12 h-12 rounded-2xl bg-emerald-50 border border-emerald-100 flex items-center justify-center text-2xl shrink-0">
                    {food.categoryEmoji}
                  </div>
                  <div className="min-w-0">
                    <div className="flex items-center gap-1.5">
                      <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${sourceInfo(food.source).cls}`}>
                        {sourceInfo(food.source).label}
                      </span>
                      <span className="text-[10px] text-slate-400 font-mono truncate">#{food.foodCode}</span>
                    </div>
                    <h3 className="text-sm font-bold text-slate-900 truncate mt-0.5">{food.displayName}</h3>
                    <p className="text-xs text-slate-600 mt-0.5 truncate">
                      <span className="font-black text-slate-900">{food.energy} kcal</span> • P {food.protein}g • F {food.fat}g • C {food.carb}g
                    </p>
                  </div>
                </div>
                <ChevronRight size={18} className="text-slate-400 shrink-0" />
              </div>
            ))}
          </div>
        </div>
      );
    }

    function DetailScreen({
      food, currentGrams, onChangeGrams, activeUnit, onChangeUnit,
      isPurchasedWeight, onChangePurchasedWeight, currentDri, isFavorite,
      onToggleFavorite, onBack, onAddToRecipe, onAddToCompare, onCopySummary
    }) {
      const n = useMemo(() => calculateScaledNutrients(food, currentGrams, isPurchasedWeight), [food, currentGrams, isPurchasedWeight]);

      const mealDri = useMemo(() => {
        const res = {};
        Object.keys(currentDri).forEach(k => {
          res[k] = (currentDri[k] ?? 0) / 3.0;
        });
        return res;
      }, [currentDri]);

      const summaryText = `【NutriDex 栄養サマリー】\n食材: ${food.displayName}\n分量: ${currentGrams}g (${activeUnit})\nエネルギー: ${n.energy}kcal (${n.energyKj}kJ)\nPFC: P ${n.protein}g (${n.pRatio}%) / F ${n.fat}g (${n.fRatio}%) / C ${n.carb}g (${n.cRatio}%)\nビタミンE: ${n.vitaminE ?? '—'}mg / ビタミンK: ${n.vitaminK ?? '—'}μg\n出典: ${sourceInfo(food.source).label}`;

      return (
        <div className="space-y-4 max-w-5xl mx-auto">
          <div className="flex items-center justify-between">
            <button onClick={onBack} className="flex items-center gap-1 text-xs font-bold text-slate-500 hover:text-slate-800">
              <ArrowLeft size={16} />
              <span>検索へ戻る</span>
            </button>
            <div className="flex items-center gap-2">
              <button onClick={onToggleFavorite} className={`p-2 rounded-xl border ${isFavorite ? 'bg-rose-50 border-rose-200 text-rose-500' : 'bg-white border-slate-200 text-slate-600'}`}>
                {isFavorite ? <BookmarkCheck size={18} /> : <Bookmark size={18} />}
              </button>
              <button onClick={() => onAddToCompare(food.id)} className="px-3 py-2 bg-white text-emerald-700 border border-slate-200 rounded-xl text-xs font-bold flex items-center gap-1 shadow-sm">
                <Scale size={14} />
                <span>VS比較</span>
              </button>
              <button onClick={() => onAddToRecipe(food.id, currentGrams, activeUnit, isPurchasedWeight)} className="px-3 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold flex items-center gap-1 shadow-sm">
                <Plus size={14} />
                <span>レシピへ</span>
              </button>
            </div>
          </div>

          <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-4">
            <div className="flex items-start gap-4">
              <div className="w-16 h-16 rounded-2xl bg-emerald-50 border border-emerald-100 flex items-center justify-center text-4xl shrink-0">
                {food.categoryEmoji}
              </div>
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-1.5 flex-wrap">
                  <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${sourceInfo(food.source).cls}`}>{sourceInfo(food.source).label}</span>
                  <span className="text-xs text-slate-400 font-mono">コード: {food.foodCode}</span>
                </div>
                <h1 className="text-lg sm:text-xl font-black text-slate-900 mt-1">{food.displayName}</h1>
              </div>
            </div>

            {/* 分量スライダー & 生活単位 */}
            <div className="bg-slate-50 p-4 rounded-2xl space-y-3">
              <div className="flex justify-between items-center text-xs font-bold">
                <span>食べる分量: {currentGrams}g ({activeUnit})</span>
                {food.refuseRate > 0 && <span className="text-amber-700">廃棄率: {food.refuseRate}% (可食部: {n.edibleGrams}g)</span>}
              </div>

              <div className="flex flex-wrap gap-1.5">
                {food.portionUnits?.map((u, i) => (
                  <button
                    key={i}
                    onClick={() => {
                      onChangeGrams(u.grams);
                      onChangeUnit(u.name);
                      onChangePurchasedWeight(!!u.isPurchasedWeight);
                    }}
                    className={`px-2.5 py-1.5 rounded-xl text-xs font-bold border transition-all ${
                      activeUnit === u.name ? 'bg-emerald-600 border-emerald-600 text-white' : 'bg-white border-slate-200 text-slate-700'
                    }`}
                  >
                    {u.name}
                  </button>
                ))}
              </div>

              <input
                type="range"
                min="1"
                max="200"
                step="1"
                value={currentGrams}
                onChange={(e) => { onChangeGrams(Number(e.target.value)); onChangeUnit('カスタム'); }}
                className="w-full accent-emerald-600"
              />
            </div>

            {/* PFCサマリー */}
            <div className="grid grid-cols-4 gap-2 text-center">
              <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                <div className="text-[10px] text-slate-500 font-bold">エネルギー</div>
                <div className="text-lg font-black text-slate-900 mt-0.5">{n.energy} <span className="text-xs">kcal</span></div>
              </div>
              <div className="bg-rose-50 p-3 rounded-2xl text-rose-700 border border-rose-100">
                <div className="text-[10px] font-bold">タンパク質 ({n.pRatio}%)</div>
                <div className="text-lg font-black mt-0.5">{n.protein}g</div>
              </div>
              <div className="bg-amber-50 p-3 rounded-2xl text-amber-700 border border-amber-100">
                <div className="text-[10px] font-bold">脂質 ({n.fRatio}%)</div>
                <div className="text-lg font-black mt-0.5">{n.fat}g</div>
              </div>
              <div className="bg-sky-50 p-3 rounded-2xl text-sky-700 border border-sky-100">
                <div className="text-[10px] font-bold">炭水化物 ({n.cRatio}%)</div>
                <div className="text-lg font-black mt-0.5">{n.carb}g</div>
              </div>
            </div>

            <button
              onClick={() => onCopySummary(summaryText)}
              className="w-full py-2.5 bg-slate-50 hover:bg-slate-100 text-slate-700 border rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5"
            >
              <Copy size={14} />
              <span>栄養サマリーをクリップボードにコピー</span>
            </button>
          </div>

          {/* 詳細栄養素 */}
          <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3">
            <h3 className="text-sm font-extrabold text-slate-900 flex items-center gap-1.5">
              <Activity size={18} className="text-emerald-600" />
              <span>詳細栄養成分（微量栄養素・脂肪酸）</span>
            </h3>

            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5 text-xs">
              <div className="p-3 bg-slate-50 rounded-2xl border">
                <span className="text-slate-500 block">ビタミンE (α-トコフェロール)</span>
                <span className="text-base font-black text-slate-900">{n.vitaminE ?? '—'} <span className="text-xs">mg</span></span>
              </div>
              <div className="p-3 bg-slate-50 rounded-2xl border">
                <span className="text-slate-500 block">ビタミンK</span>
                <span className="text-base font-black text-slate-900">{n.vitaminK ?? '—'} <span className="text-xs">μg</span></span>
              </div>
              <div className="p-3 bg-slate-50 rounded-2xl border">
                <span className="text-slate-500 block">一価不飽和脂肪酸 (オレイン酸等)</span>
                <span className="text-base font-black text-slate-900">{n.monounsaturatedFat ?? '—'} <span className="text-xs">g</span></span>
              </div>
              <div className="p-3 bg-slate-50 rounded-2xl border">
                <span className="text-slate-500 block">多価不飽和脂肪酸 (リノール酸等)</span>
                <span className="text-base font-black text-slate-900">{n.polyunsaturatedFat ?? '—'} <span className="text-xs">g</span></span>
              </div>
              <div className="p-3 bg-slate-50 rounded-2xl border">
                <span className="text-slate-500 block">飽和脂肪酸</span>
                <span className="text-base font-black text-slate-900">{n.saturatedFat ?? '—'} <span className="text-xs">g</span></span>
              </div>
              <div className="p-3 bg-slate-50 rounded-2xl border">
                <span className="text-slate-500 block">食塩相当量</span>
                <span className="text-base font-black text-slate-900">{n.salt} <span className="text-xs">g</span></span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function CompareScreen({ foodMaster, foodAConfig, foodBConfig, onChangeFoodA, onChangeFoodB }) {
      const fA = foodMaster.find(f => f.id === foodAConfig.id) || foodMaster[0];
      const fB = foodMaster.find(f => f.id === foodBConfig.id) || foodMaster[1] || foodMaster[0];
      const nA = calculateScaledNutrients(fA, foodAConfig.grams);
      const nB = calculateScaledNutrients(fB, foodBConfig.grams);

      const handleSwap = () => {
        const temp = { ...foodAConfig };
        onChangeFoodA(foodBConfig);
        onChangeFoodB(temp);
      };

      return (
        <div className="max-w-3xl mx-auto space-y-4">
          <div className="flex items-center justify-between">
            <h2 className="text-base font-extrabold flex items-center gap-2"><Scale size={18} /> 食品くらべる (VS)</h2>
            <button onClick={handleSwap} className="px-3 py-1.5 bg-white border border-slate-200 text-xs font-bold rounded-xl flex items-center gap-1 shadow-sm">
              <RotateCcw size={14} />
              <span>左右スワップ</span>
            </button>
          </div>

          <div className="grid grid-cols-2 gap-3">
            {[ { f: fA, n: nA, cfg: foodAConfig, setCfg: onChangeFoodA }, { f: fB, n: nB, cfg: foodBConfig, setCfg: onChangeFoodB } ].map((slot, i) => (
              <div key={i} className="bg-white p-4 rounded-3xl border border-slate-200 text-center space-y-2 shadow-sm">
                <span className="text-3xl">{slot.f.categoryEmoji}</span>
                <select
                  value={slot.f.id}
                  onChange={(e) => slot.setCfg({ ...slot.cfg, id: e.target.value })}
                  className="w-full text-xs font-bold p-1 border rounded-lg"
                >
                  {foodMaster.slice(0, 100).map(food => <option key={food.id} value={food.id}>{food.shortName}</option>)}
                </select>
                <div className="text-xs text-slate-500 font-bold">{slot.cfg.grams}g</div>
                <div className="text-base font-black text-slate-900">{slot.n.energy} kcal</div>
              </div>
            ))}
          </div>

          <div className="bg-white p-4 rounded-3xl border border-slate-200 space-y-2 text-xs">
            <div className="flex justify-between border-b pb-1">
              <span>脂質</span>
              <span>{nA.fat}g vs {nB.fat}g</span>
            </div>
            <div className="flex justify-between border-b pb-1">
              <span>一価不飽和脂肪酸（オレイン酸等）</span>
              <span>{nA.monounsaturatedFat ?? '—'}g vs {nB.monounsaturatedFat ?? '—'}g</span>
            </div>
            <div className="flex justify-between border-b pb-1">
              <span>ビタミンE</span>
              <span>{nA.vitaminE ?? '—'}mg vs {nB.vitaminE ?? '—'}mg</span>
            </div>
            <div className="flex justify-between">
              <span>ビタミンK</span>
              <span>{nA.vitaminK ?? '—'}μg vs {nB.vitaminK ?? '—'}μg</span>
            </div>
          </div>
        </div>
      );
    }

    function RecipeScreen({ foodMaster, title, onChangeTitle, servings, onChangeServings, items, onChangeItems, onAddMore }) {
      const totalKcal = useMemo(() => {
        return items.reduce((acc, item) => {
          const f = foodMaster.find(x => x.id === item.foodId);
          return acc + (f ? calculateScaledNutrients(f, item.grams).energy : 0);
        }, 0);
      }, [foodMaster, items]);

      return (
        <div className="max-w-2xl mx-auto space-y-4">
          <div className="bg-white p-4 rounded-3xl border border-slate-200 space-y-3 shadow-sm">
            <input
              type="text"
              value={title}
              onChange={(e) => onChangeTitle(e.target.value)}
              className="w-full text-sm font-bold border-b pb-2 focus:outline-none"
            />
            <div className="flex justify-between items-center text-xs">
              <span className="font-bold">合計: {totalKcal} kcal ({servings}人前: {Math.round(totalKcal / servings)} kcal/人)</span>
              <button onClick={onAddMore} className="text-emerald-700 font-bold flex items-center gap-1"><Plus size={14} /> 食材追加</button>
            </div>
          </div>

          <div className="space-y-2">
            {items.map((item, idx) => {
              const f = foodMaster.find(x => x.id === item.foodId);
              if (!f) return null;
              return (
                <div key={idx} className="bg-white p-3 rounded-2xl border flex items-center justify-between text-xs">
                  <div>
                    <span className="font-bold">{f.shortName}</span>
                    <span className="text-slate-400 ml-2">({item.grams}g)</span>
                  </div>
                  <button onClick={() => onChangeItems(items.filter((_, i) => i !== idx))} className="text-rose-500 font-bold">削除</button>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function FavoritesScreen({ foodMaster, favoriteIds, onSelectFood }) {
      const favs = useMemo(() => favoriteIds.map(id => foodMaster.find(f => f.id === id)).filter(Boolean), [foodMaster, favoriteIds]);
      return (
        <div className="max-w-2xl mx-auto space-y-3">
          <h2 className="text-base font-extrabold flex items-center gap-2"><Bookmark size={18} /> お気に入り食品 ({favs.length})</h2>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {favs.map(f => (
              <div key={f.id} onClick={() => onSelectFood(f.id)} className="bg-white p-4 rounded-2xl border flex items-center justify-between cursor-pointer shadow-sm">
                <div className="flex items-center gap-2">
                  <span className="text-2xl">{f.categoryEmoji}</span>
                  <span className="text-xs font-bold">{f.displayName}</span>
                </div>
                <ChevronRight size={16} className="text-slate-400" />
              </div>
            ))}
          </div>
        </div>
      );
    }

    function SettingsModal({ userGender, onChangeGender, userAgeGroup, onChangeAgeGroup, onClose }) {
      return (
        <div className="fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4">
          <div className="bg-white border w-full max-w-md rounded-3xl p-5 space-y-4 shadow-2xl">
            <div className="flex justify-between items-center border-b pb-3">
              <h3 className="text-sm font-bold flex items-center gap-2"><Settings size={16} /> 各種設定</h3>
              <button onClick={onClose} className="text-slate-400 font-bold">✕</button>
            </div>
            <div className="space-y-1">
              <label className="text-xs font-semibold text-slate-700">性別</label>
              <div className="flex gap-2">
                <button onClick={() => onChangeGender('male')} className={`flex-1 py-1.5 text-xs font-bold rounded-lg border ${userGender === 'male' ? 'bg-emerald-600 text-white' : 'bg-slate-50'}`}>男性</button>
                <button onClick={() => onChangeGender('female')} className={`flex-1 py-1.5 text-xs font-bold rounded-lg border ${userGender === 'female' ? 'bg-emerald-600 text-white' : 'bg-slate-50'}`}>女性</button>
              </div>
            </div>
            <div className="space-y-1">
              <label className="text-xs font-semibold text-slate-700">年齢区分</label>
              <div className="grid grid-cols-3 gap-2">
                {['18-29', '30-49', '50-64'].map(age => (
                  <button
                    key={age}
                    onClick={() => onChangeAgeGroup(age)}
                    className={`py-1.5 text-xs font-bold rounded-lg border ${userAgeGroup === age ? 'bg-emerald-600 text-white' : 'bg-slate-50'}`}
                  >
                    {age}
                  </button>
                ))}
              </div>
            </div>
            <button onClick={onClose} className="w-full py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold">保存して閉じる</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
