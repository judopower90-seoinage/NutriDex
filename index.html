    function calculateScaledNutrients(food, grams, isPurchasedWeight = false) {
      if (!food) return null;

      const rawGrams = Math.max(0, Number(grams) || 0);
      const refuseRate = Number(food.refuseRate) || 0;
      const edibleGrams = isPurchasedWeight ? rawGrams * (1 - refuseRate / 100) : rawGrams;
      const ratio = edibleGrams / 100;

      const scaleNum = (val, decimals = 1) => (val === null || val === undefined) ? null : +(Number(val) * ratio).toFixed(decimals);
      const scaleInt = (val) => (val === null || val === undefined) ? null : Math.round(Number(val) * ratio);

      // 基本・熱量
      const energy = Math.round((food.energy ?? 0) * ratio);
      const energyKj = Math.round((food.energyKj ?? (food.energy ?? 0) * 4.184) * ratio);
      const water = scaleNum(food.water, 1);
      const protein = +( (food.protein ?? 0) * ratio ).toFixed(1);
      const proteinAmino = scaleNum(food.proteinAmino, 1);
      const fat = +( (food.fat ?? 0) * ratio ).toFixed(1);
      const carb = +( (food.carb ?? 0) * ratio ).toFixed(1);
      const fiber = +( (food.fiber ?? 0) * ratio ).toFixed(1);
      const fiberSoluble = scaleNum(food.fiberSoluble, 1);
      const fiberInsoluble = scaleNum(food.fiberInsoluble, 1);
      const sugar = +( (food.sugar ?? Math.max(0, (food.carb ?? 0) - (food.fiber ?? 0))) * ratio ).toFixed(1);
      const availableCarb = scaleNum(food.availableCarb, 1);
      const salt = +( (food.salt ?? 0) * ratio ).toFixed(2);
      const ash = scaleNum(food.ash, 1);

      // 無機質（ミネラル 13種）
      const sodium = scaleInt(food.sodium);
      const potassium = scaleInt(food.potassium);
      const calcium = scaleInt(food.calcium);
      const magnesium = scaleInt(food.magnesium);
      const phosphorus = scaleInt(food.phosphorus);
      const iron = scaleNum(food.iron, 2);
      const zinc = scaleNum(food.zinc, 2);
      const copper = scaleNum(food.copper, 2);
      const manganese = scaleNum(food.manganese, 2);
      const iodine = scaleNum(food.iodine, 1);
      const selenium = scaleNum(food.selenium, 1);
      const chromium = scaleNum(food.chromium, 1);
      const molybdenum = scaleNum(food.molybdenum, 1);

      // ビタミン（13種＋詳細項目）
      const vitaminA = scaleInt(food.vitaminA);
      const retinol = scaleInt(food.retinol);
      const betaCarotene = scaleInt(food.betaCarotene);
      const vitaminD = scaleNum(food.vitaminD, 1);
      const vitaminE = scaleNum(food.vitaminE, 1);
      const vitaminK = scaleInt(food.vitaminK);
      const vitaminB1 = scaleNum(food.vitaminB1, 2);

    function mergeFoodLists(base, incoming) {
      const codeMap = new Map();
      base.forEach(f => codeMap.set(f.foodCode, f));
      incoming.forEach(f => {
        if (f && f.foodCode) codeMap.set(f.foodCode, f);
      });
      return Array.from(codeMap.values());
    }

    async function geminiFetch(path, apiKey, init = {}, timeoutMs = 40000) {
      const base = 'https://generativelanguage.googleapis.com/v1beta/';
      const attempts = [
        { url: `${base}${path}${path.includes('?') ? '&' : '?'}key=${encodeURIComponent(apiKey)}`, headers: {} },
        { url: `${base}${path}`, headers: { 'x-goog-api-key': apiKey } }
      ];
      let firstError = '';
      for (const a of attempts) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeoutMs);
        try {
          const res = await fetch(a.url, { ...init, headers: { ...(init.headers || {}), ...a.headers }, signal: ctrl.signal });
          clearTimeout(timer);
          if (res.ok) return res;
        } catch (e) {
          clearTimeout(timer);
          firstError = e.message || '通信エラー';
        }
      }
      throw new Error(firstError || '接続できませんでした');
    }

    async function fetchFoodFromAi(foodQuery, apiKey) {
      if (!apiKey) throw new Error('NO_API_KEY');
      const prompt = `「${foodQuery}」の可食部100gあたりの成分値を八訂を参考に推計し、JSONのみを出力してください:
{"displayName":"${foodQuery}","categoryCode":"06","categoryName":"野菜類","categoryEmoji":"🥦","refuseRate":0,"energy":50,"protein":2,"fat":0.5,"carb":10,"sugar":8,"fiber":2,"salt":0.05,"potassium":200,"calcium":30,"iron":0.8,"vitaminC":15,"portionUnits":[{"name":"1人前(100g)","grams":100,"isDefault":true}]}`;
      const res = await geminiFetch(`models/gemini-2.5-flash:generateContent`, apiKey, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }] })
      });
      const data = await res.json();
      const rawText = data?.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '';
      const match = rawText.match(/\{[\s\S]*\}/);
      if (!match) throw new Error('解析失敗');
      const p = JSON.parse(match[0]);
      return {
        id: `food_ai_${Date.now().toString(36)}`,
        foodCode: 'AI-EST',
        source: 'ai_estimate',
        name: p.displayName || foodQuery,
        displayName: p.displayName || foodQuery,
        shortName: p.displayName || foodQuery,
        kana: p.displayName || foodQuery,
        categoryCode: p.categoryCode || '06',
        categoryName: p.categoryName || '食品',
        categoryEmoji: p.categoryEmoji || '🍽️',
        refuseRate: numOrZero(p.refuseRate),
        energy: numOrZero(p.energy),
        energyKj: Math.round(numOrZero(p.energy) * 4.184),
        protein: numOrZero(p.protein),
        fat: numOrZero(p.fat),
        carb: numOrZero(p.carb),
        sugar: numOrZero(p.sugar),
        fiber: numOrZero(p.fiber),
        salt: numOrZero(p.salt),
        potassium: numOrNull(p.potassium),
        calcium: numOrNull(p.calcium),
        iron: numOrNull(p.iron),
        vitaminC: numOrNull(p.vitaminC),
        portionUnits: sanitizePortionUnits(p.portionUnits)
      };
    }

    function HomeScreen({ foods, dbSyncStatus, onSelectFood, onQueryAi, isFetchingAi }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');

      const filteredFoods = useMemo(() => {
        const q = normalizeSearch(searchQuery.trim());
        if (!q && selectedCategory === 'all') return foods.slice(0, 48);
        return foods.filter((f) => {
          const matchQ = !q || [f.name, f.displayName, f.shortName, f.kana, f.foodCode].some(v => normalizeSearch(v).includes(q));
          const matchCat = selectedCategory === 'all' || f.categoryCode === selectedCategory;
          return matchQ && matchCat;
        }).slice(0, 96);
      }, [foods, searchQuery, selectedCategory]);

      return (
        <div className="space-y-4 w-full">
          {/* 検索入力 */}
          <div className="bg-white p-4 sm:p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3">
            <div className="relative">
              <div className="absolute inset-y-0 left-3.5 flex items-center pointer-events-none text-emerald-600">
                <Search size={19} />
              </div>
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="菊芋, すじこ, 鶏もも肉, 白米, アボカド など2,500品目から検索"
                className="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-11 pr-10 py-3 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
              />
              {searchQuery && (
                <button onClick={() => setSearchQuery('')} className="absolute inset-y-0 right-3 flex items-center text-slate-400">×</button>
              )}
            </div>

            {/* カテゴリ */}
            <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none">
              {[
                { id: 'all', name: 'すべて', emoji: '🍽️' },
                { id: '11', name: '肉類', emoji: '🍗' },
                { id: '06', name: '野菜類', emoji: '🥦' },
                { id: '10', name: '魚介類', emoji: '🐟' },
                { id: '01', name: '穀類', emoji: '🍚' },

                  }`}
                >
                  <span>{cat.emoji}</span>
                  <span>{cat.name}</span>
                </button>
              ))}
            </div>
          </div>

          {/* AI推計フォールバック */}
          {searchQuery.trim() && filteredFoods.length === 0 && (
            <div className="bg-amber-50 border border-amber-200 p-4 rounded-2xl flex items-center justify-between">
              <div>
                <p className="text-xs font-bold text-amber-900">八訂公的データに見つかりません</p>
                <p className="text-[11px] text-amber-700">市販品・外食メニューとしてAI推計しますか？</p>
              </div>
              <button
                onClick={() => onQueryAi(searchQuery.trim())}
                disabled={isFetchingAi}
                className="px-3.5 py-1.5 bg-amber-600 hover:bg-amber-500 text-white rounded-xl text-xs font-bold flex items-center gap-1"
              >

          { category: 'lipid', categoryName: '脂質・脂肪酸', name: '一価不飽和脂肪酸 (MUFA)', val: n.monounsaturatedFat, unit: 'g', dri: null },

          { category: 'lipid', categoryName: '脂質・脂肪酸', name: 'n-3系脂肪酸 (オメガ3)', val: n.n3Fat, unit: 'g', dri: null, highlight: true },
          { category: 'lipid', categoryName: '脂質・脂肪酸', name: 'n-6系脂肪酸 (オメガ6)', val: n.n6Fat, unit: 'g', dri: null },

          { category: 'amino', categoryName: 'アミノ酸組成', name: 'リシン (リジン/必須)', val: n.lysine, unit: 'mg', dri: null },
          { category: 'amino', categoryName: 'アミノ酸組成', name: 'メチオニン (必須)', val: n.methionine, unit: 'mg', dri: null },
          { category: 'amino', categoryName: 'アミノ酸組成', name: 'フェニルアラニン (必須)', val: n.phenylalanine, unit: 'mg', dri: null },
          { category: 'amino', categoryName: 'アミノ酸組成', name: 'トレオニン (スレオニン/必須)', val: n.threonine, unit: 'mg', dri: null },
          { category: 'amino', categoryName: 'アミノ酸組成', name: 'トリプトファン (必須)', val: n.tryptophan, unit: 'mg', dri: null },
          { category: 'amino', categoryName: 'アミノ酸組成', name: 'ヒスチジン (必須)', val: n.histidine, unit: 'mg', dri: null },
          { category: 'amino', categoryName: 'アミノ酸組成', name: 'アルギニン', val: n.arginine, unit: 'mg', dri: null },
          { category: 'amino', categoryName: 'アミノ酸組成', name: 'アラニン', val: n.alanine, unit: 'mg', dri: null },
          { category: 'amino', categoryName: 'アミノ酸組成', name: 'グルタミン酸', val: n.glutamicAcid, unit: 'mg', dri: null },
          { category: 'amino', categoryName: 'アミノ酸組成', name: 'アスパラギン酸', val: n.asparticAcid, unit: 'mg', dri: null }
        ];
      }, [n, mealDri]);

      const filteredNutrients = useMemo(() => {
        return allNutrientDefinitions.filter(item => {
          const matchCat = activeNutrientCategory === 'all' || item.category === activeNutrientCategory;
          const matchQuery = !nutrientFilterKeyword.trim() || item.name.toLowerCase().includes(nutrientFilterKeyword.trim().toLowerCase());
          return matchCat && matchQuery;
        });
      }, [allNutrientDefinitions, activeNutrientCategory, nutrientFilterKeyword]);

      const summaryText = `【NutriDex 栄養サマリー】\n食材: ${food.displayName}\n分量: ${currentGrams}g (${activeUnit}${isPurchasedWeight ? ` → 可食部${n.edibleGrams}g` : ''})\nエネルギー: ${n.energy}kcal (${n.energyKj}kJ)\nPFC: P ${n.protein}g (${n.pRatio}%) / F ${n.fat}g (${n.fRatio}%) / C ${n.carb}g (${n.cRatio}%)\n糖質: ${n.sugar}g / 食物繊維: ${n.fiber}g\nカリウム: ${n.potassium ?? '—'}mg / カルシウム: ${n.calcium ?? '—'}mg / 鉄: ${n.iron ?? '—'}mg / ビタミンC: ${n.vitaminC ?? '—'}mg\n出典: ${sourceInfo(food.source).label}`;

      return (

            <button onClick={onBack} className="flex items-center gap-1 text-xs font-bold text-slate-500 hover:text-slate-800">
              <ArrowLeft size={16} />
              <span>検索へ戻る</span>

            <div className="flex items-center gap-2">
              <button onClick={onToggleFavorite} className={`p-2 rounded-xl border ${isFavorite ? 'bg-rose-50 border-rose-200 text-rose-500' : 'bg-white border-slate-200 text-slate-600'}`}>

              <button onClick={() => onAddToCompare(food.id)} className="px-3 py-2 bg-white text-emerald-700 border border-slate-200 rounded-xl text-xs font-bold flex items-center gap-1 shadow-sm">
                <Scale size={14} />
                <span>VS比較</span>

                <Plus size={14} />
                <span>レシピへ</span>

          </div>

          {/* 食品ヘッダーカード */}

              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-1.5 flex-wrap">

                <span>食べる分量: {currentGrams}g ({activeUnit})</span>
                {food.refuseRate > 0 && <span className="text-amber-700">廃棄率: {food.refuseRate}% (可食部: {n.edibleGrams}g)</span>}
              </div>

              {/* 生活単位チップ */}
              <div className="flex flex-wrap gap-1.5">
                {food.portionUnits?.map((u, i) => (
                  <button
                    key={i}
                    onClick={() => {
                      onChangeGrams(u.grams);
                      onChangeUnit(u.name);
                      onChangePurchasedWeight(!!u.isPurchasedWeight);
                    }}
                    className={`px-2.5 py-1.5 rounded-xl text-xs font-bold border transition-all ${
                      activeUnit === u.name ? 'bg-emerald-600 border-emerald-600 text-white' : 'bg-white border-slate-200 text-slate-700'
                    }`}
                  >
                    {u.name}
                  </button>
                ))}
              </div>

              {/* 廃棄率トグル */}
              {food.refuseRate > 0 && (
                <div className="flex bg-slate-200 p-0.5 rounded-xl text-[11px] font-bold">
                  <button
                    onClick={() => onChangePurchasedWeight(false)}
                    className={`flex-1 py-1 rounded-lg ${!isPurchasedWeight ? 'bg-white text-emerald-800 shadow-sm' : 'text-slate-600'}`}
                  >
                    可食部の重さ
                  </button>
                  <button
                    onClick={() => onChangePurchasedWeight(true)}
                    className={`flex-1 py-1 rounded-lg ${isPurchasedWeight ? 'bg-white text-emerald-800 shadow-sm' : 'text-slate-600'}`}
                  >
                    購入時の重さ（皮や骨込）
                  </button>
                </div>
              )}

              <input
                type="range"
                min="5"
                max="500"
                step="5"
                value={currentGrams}
                onChange={(e) => { onChangeGrams(Number(e.target.value)); onChangeUnit('カスタム'); }}
                className="w-full accent-emerald-600"
              />
            </div>

            {/* PFCサマリー */}
            <div className="grid grid-cols-4 gap-2 text-center">
              <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                <div className="text-[10px] text-slate-500 font-bold">エネルギー</div>
                <div className="text-lg font-black text-slate-900 mt-0.5">{n.energy} <span className="text-xs">kcal</span></div>
              </div>
              <div className="bg-rose-50 p-3 rounded-2xl text-rose-700 border border-rose-100">
                <div className="text-[10px] font-bold">タンパク質 ({n.pRatio}%)</div>
                <div className="text-lg font-black mt-0.5">{n.protein}g</div>
              </div>
              <div className="bg-amber-50 p-3 rounded-2xl text-amber-700 border border-amber-100">
                <div className="text-[10px] font-bold">脂質 ({n.fRatio}%)</div>
                <div className="text-lg font-black mt-0.5">{n.fat}g</div>
              </div>
              <div className="bg-sky-50 p-3 rounded-2xl text-sky-700 border border-sky-100">
                <div className="text-[10px] font-bold">炭水化物 ({n.cRatio}%)</div>
                <div className="text-lg font-black mt-0.5">{n.carb}g</div>
              </div>
            </div>

            <button
              onClick={() => onCopySummary(summaryText)}
              className="w-full py-2.5 bg-slate-50 hover:bg-slate-100 text-slate-700 border rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5"
            >
              <Copy size={14} />
              <span>栄養サマリーをクリップボードにコピー</span>
            </button>
          </div>

          {}
          <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-4">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 pb-3">
              <div>
                <h3 className="text-sm sm:text-base font-extrabold text-slate-900 flex items-center gap-1.5">
                  <Activity size={18} className="text-emerald-600" />
                  <span>カロリースリム準拠 詳細栄養素（{filteredNutrients.length}項目）</span>
                </h3>
                <p className="text-[11px] text-slate-400 mt-0.5">厚労省「食事摂取基準」1食目安（1日の1/3）に対する充足率バー付き</p>
              </div>

              {/* 栄養素検索 */}
              <div className="relative w-full sm:w-44">
                <input
                  type="text"
                  value={nutrientFilterKeyword}
                  onChange={(e) => setNutrientFilterKeyword(e.target.value)}
                  placeholder="ビタミンC, カリウム等..."
                  className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-emerald-500"
                />
                {nutrientFilterKeyword && (
                  <button onClick={() => setNutrientFilterKeyword('')} className="absolute right-2 top-1 text-slate-400 text-xs">×</button>
                )}
              </div>
            </div>

            {/* カテゴリ切り替えタブ */}
            <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none w-full">
              {[
                { id: 'all', label: 'すべて' },
                { id: 'basic', label: '熱量・基本' },
                { id: 'carb_fiber', label: '糖質・食物繊維' },
                { id: 'mineral', label: 'ミネラル (13種)' },
                { id: 'vitamin', label: 'ビタミン (13種)' },
                { id: 'lipid', label: '脂質・脂肪酸' },
                { id: 'amino', label: 'アミノ酸組成' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveNutrientCategory(tab.id)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all border shrink-0 ${
                    activeNutrientCategory === tab.id
                      ? 'bg-emerald-600 border-emerald-600 text-white shadow-sm'
                      : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            {/* 詳細栄養素一覧カードグリッド */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 max-h-[560px] overflow-y-auto pr-1">
              {filteredNutrients.map((item, idx) => {
                const hasVal = item.val !== null && item.val !== undefined;
                const ratio = (hasVal && item.dri && item.dri > 0) ? Math.round((Number(item.val) / item.dri) * 100) : null;
                const isOver = item.isMaxLimit && ratio && ratio > 100;

                return (
                  <div key={idx} className="p-3 rounded-2xl bg-slate-50/70 border border-slate-200/90 flex flex-col justify-between">
                    <div className="flex items-start justify-between gap-2">
                      <div>
                        <div className="flex items-center gap-1.5">
                          <span className="text-xs font-bold text-slate-800">{item.name}</span>
                          {item.highlight && <span className="text-[9px] px-1 py-0.5 rounded font-bold bg-emerald-100 text-emerald-800">主要</span>}
                        </div>

                      </div>
                      <div className="text-right">

                            <span className={isOver ? 'text-rose-600 font-extrabold' : 'text-emerald-700 font-bold'}>

                            </span>
                          )}

                            style={{ width: `${Math.min(100, ratio ?? 0)}%` }}

                          />
                        </div>

                );
              })}

          </div>

    function CompareScreen({ foodMaster, foodAConfig, foodBConfig, onChangeFoodA, onChangeFoodB }) {
      const fA = foodMaster.find(f => f.id === foodAConfig.id) || foodMaster[0];
      const fB = foodMaster.find(f => f.id === foodBConfig.id) || foodMaster[1] || foodMaster[0];
      const nA = calculateScaledNutrients(fA, foodAConfig.grams);
      const nB = calculateScaledNutrients(fB, foodBConfig.grams);

      const handleSwap = () => {
        const temp = { ...foodAConfig };
        onChangeFoodA(foodBConfig);
        onChangeFoodB(temp);
      };

      return (
        <div className="max-w-3xl mx-auto space-y-4">
          <div className="flex items-center justify-between">
            <h2 className="text-base font-extrabold flex items-center gap-2"><Scale size={18} /> 食品くらべる (VS)</h2>
            <button onClick={handleSwap} className="px-3 py-1.5 bg-white border border-slate-200 text-xs font-bold rounded-xl flex items-center gap-1 shadow-sm">
              <RotateCcw size={14} />
              <span>左右スワップ</span>
            </button>
          </div>

          <div className="grid grid-cols-2 gap-3">
            {[ { f: fA, n: nA, cfg: foodAConfig, setCfg: onChangeFoodA }, { f: fB, n: nB, cfg: foodBConfig, setCfg: onChangeFoodB } ].map((slot, i) => (
              <div key={i} className="bg-white p-4 rounded-3xl border border-slate-200 text-center space-y-2 shadow-sm">
                <span className="text-3xl">{slot.f.categoryEmoji}</span>
                <select
                  value={slot.f.id}
                  onChange={(e) => slot.setCfg({ ...slot.cfg, id: e.target.value })}
                  className="w-full text-xs font-bold p-1 border rounded-lg"
                >
                  {foodMaster.slice(0, 100).map(food => <option key={food.id} value={food.id}>{food.shortName}</option>)}
                </select>
                <div className="text-xs text-slate-500 font-bold">{slot.cfg.grams}g</div>
                <div className="text-base font-black text-slate-900">{slot.n.energy} kcal</div>
              </div>
            ))}
          </div>

          <div className="bg-white p-4 rounded-3xl border border-slate-200 space-y-2 text-xs">
            <div className="flex justify-between border-b pb-1">
              <span>たんぱく質</span>
              <span>{nA.protein}g vs {nB.protein}g</span>
            </div>
            <div className="flex justify-between border-b pb-1">
              <span>食物繊維</span>
              <span>{nA.fiber}g vs {nB.fiber}g</span>
            </div>
            <div className="flex justify-between border-b pb-1">
              <span>カリウム</span>
              <span>{nA.potassium ?? '—'}mg vs {nB.potassium ?? '—'}mg</span>
            </div>
            <div className="flex justify-between">
              <span>ビタミンC</span>
              <span>{nA.vitaminC ?? '—'}mg vs {nB.vitaminC ?? '—'}mg</span>
            </div>
          </div>
        </div>
      );
    }

    function RecipeScreen({ foodMaster, title, onChangeTitle, servings, onChangeServings, items, onChangeItems, onAddMore }) {
      const totalKcal = useMemo(() => {
        return items.reduce((acc, item) => {
          const f = foodMaster.find(x => x.id === item.foodId);
          return acc + (f ? calculateScaledNutrients(f, item.grams).energy : 0);
        }, 0);
      }, [foodMaster, items]);

      return (
        <div className="max-w-2xl mx-auto space-y-4">
          <div className="bg-white p-4 rounded-3xl border border-slate-200 space-y-3 shadow-sm">
            <input
              type="text"
              value={title}
              onChange={(e) => onChangeTitle(e.target.value)}
              className="w-full text-sm font-bold border-b pb-2 focus:outline-none"
            />
            <div className="flex justify-between items-center text-xs">
              <span className="font-bold">合計: {totalKcal} kcal ({servings}人前換算: {Math.round(totalKcal / servings)} kcal/人)</span>
              <button onClick={onAddMore} className="text-emerald-700 font-bold flex items-center gap-1"><Plus size={14} /> 食材追加</button>
            </div>
          </div>

          <div className="space-y-2">
            {items.map((item, idx) => {
              const f = foodMaster.find(x => x.id === item.foodId);
              if (!f) return null;
              return (
                <div key={idx} className="bg-white p-3 rounded-2xl border flex items-center justify-between text-xs">
                  <div>
                    <span className="font-bold">{f.shortName}</span>
                    <span className="text-slate-400 ml-2">({item.grams}g)</span>
                  </div>
                  <button onClick={() => onChangeItems(items.filter((_, i) => i !== idx))} className="text-rose-500 font-bold">削除</button>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function FavoritesScreen({ foodMaster, favoriteIds, onSelectFood }) {
      const favs = useMemo(() => favoriteIds.map(id => foodMaster.find(f => f.id === id)).filter(Boolean), [foodMaster, favoriteIds]);
      return (
        <div className="max-w-2xl mx-auto space-y-3">
          <h2 className="text-base font-extrabold flex items-center gap-2"><Bookmark size={18} /> お気に入り食品 ({favs.length})</h2>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {favs.map(f => (
              <div key={f.id} onClick={() => onSelectFood(f.id)} className="bg-white p-4 rounded-2xl border flex items-center justify-between cursor-pointer shadow-sm">
                <div className="flex items-center gap-2">
                  <span className="text-2xl">{f.categoryEmoji}</span>
                  <span className="text-xs font-bold">{f.displayName}</span>
                </div>
                <ChevronRight size={16} className="text-slate-400" />
              </div>
            ))}
          </div>
        </div>
      );
    }

        <div className="fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4">
          <div className="bg-white border w-full max-w-md rounded-3xl p-5 space-y-4 shadow-2xl">
            <div className="flex justify-between items-center border-b pb-3">
              <h3 className="text-sm font-bold flex items-center gap-2"><Settings size={16} /> 各種設定</h3>
              <button onClick={onClose} className="text-slate-400 font-bold">✕</button>
            </div>
            <div className="space-y-1">
              <label className="text-xs font-semibold text-slate-700">性別</label>
              <div className="flex gap-2">
                <button onClick={() => onChangeGender('male')} className={`flex-1 py-1.5 text-xs font-bold rounded-lg border ${userGender === 'male' ? 'bg-emerald-600 text-white' : 'bg-slate-50'}`}>男性</button>
                <button onClick={() => onChangeGender('female')} className={`flex-1 py-1.5 text-xs font-bold rounded-lg border ${userGender === 'female' ? 'bg-emerald-600 text-white' : 'bg-slate-50'}`}>女性</button>

                  <button
                    key={age}

              <label className="text-xs font-semibold text-slate-700">Gemini APIキー（AI推計用・任意）</label>
              <input
                type="password"
                value={userApiKey}
                onChange={(e) => onChangeApiKey(e.target.value)}
                placeholder="AQ... または AIzaSy..."
                className="w-full text-xs font-mono bg-slate-50 border p-2 rounded-xl"
              />
            </div>
            <button onClick={onClose} className="w-full py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold">保存して閉じる</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
