    // グラム数および廃棄率に応じた全栄養素（三大栄養素・詳細微量成分）の換算計算
    function calculateScaledNutrients(food, grams, isPurchasedWeight = false) {
      if (!food) return null;

      const rawGrams = Math.max(0, Number(grams) || 0);
      const refuseRate = Number(food.refuseRate) || 0;
      const edibleGrams = isPurchasedWeight ? rawGrams * (1 - refuseRate / 100) : rawGrams;
      const ratio = edibleGrams / 100;

      const scaleNum = (val, decimals = 1) => {
        if (val === null || val === undefined) return null;
        return +(Number(val) * ratio).toFixed(decimals);
      };
      const scaleInt = (val) => {
        if (val === null || val === undefined) return null;
        return Math.round(Number(val) * ratio);
      };

      const energy = Math.round((food.energy ?? 0) * ratio);
      const energyKj = Math.round((food.energyKj ?? (food.energy ?? 0) * 4.184) * ratio);
      const water = scaleNum(food.water, 1);
      const protein = +( (food.protein ?? 0) * ratio ).toFixed(1);
      const proteinAmino = scaleNum(food.proteinAmino, 1);
      const fat = +( (food.fat ?? 0) * ratio ).toFixed(1);
      const carb = +( (food.carb ?? 0) * ratio ).toFixed(1);
      const fiber = +( (food.fiber ?? 0) * ratio ).toFixed(1);
      const fiberSoluble = scaleNum(food.fiberSoluble, 1);
      const fiberInsoluble = scaleNum(food.fiberInsoluble, 1);
      const sugar = +( (food.sugar ?? Math.max(0, (food.carb ?? 0) - (food.fiber ?? 0))) * ratio ).toFixed(1);
      const availableCarb = scaleNum(food.availableCarb, 1);
      const salt = +( (food.salt ?? 0) * ratio ).toFixed(2);
      const ash = scaleNum(food.ash, 1);

      // ミネラル 13種
      const sodium = scaleInt(food.sodium);
      const potassium = scaleInt(food.potassium);
      const calcium = scaleInt(food.calcium);
      const magnesium = scaleInt(food.magnesium);
      const phosphorus = scaleInt(food.phosphorus);
      const iron = scaleNum(food.iron, 2);
      const zinc = scaleNum(food.zinc, 2);
      const copper = scaleNum(food.copper, 2);
      const manganese = scaleNum(food.manganese, 2);
      const iodine = scaleNum(food.iodine, 1);
      const selenium = scaleNum(food.selenium, 1);
      const chromium = scaleNum(food.chromium, 1);
      const molybdenum = scaleNum(food.molybdenum, 1);

      // ビタミン 13種 + 詳細
      const vitaminA = scaleInt(food.vitaminA);
      const retinol = scaleInt(food.retinol);
      const betaCarotene = scaleInt(food.betaCarotene);
      const vitaminD = scaleNum(food.vitaminD, 1);
      const vitaminE = scaleNum(food.vitaminE, 1);
      const vitaminK = scaleInt(food.vitaminK);
      const vitaminB1 = scaleNum(food.vitaminB1, 2);
      const vitaminB2 = scaleNum(food.vitaminB2, 2);
      const niacin = scaleNum(food.niacin, 1);
      const vitaminB6 = scaleNum(food.vitaminB6, 2);
      const vitaminB12 = scaleNum(food.vitaminB12, 1);
      const folate = scaleInt(food.folate);
      const pantothenicAcid = scaleNum(food.pantothenicAcid, 2);
      const biotin = scaleNum(food.biotin, 1);
      const vitaminC = scaleNum(food.vitaminC, 1);

      // 脂質詳細
      const saturatedFat = scaleNum(food.saturatedFat, 2);
      const monounsaturatedFat = scaleNum(food.monounsaturatedFat, 2);
      const polyunsaturatedFat = scaleNum(food.polyunsaturatedFat, 2);
      const n3Fat = scaleNum(food.n3Fat, 2);
      const n6Fat = scaleNum(food.n6Fat, 2);
      const cholesterol = scaleInt(food.cholesterol);

      // アミノ酸組成（mg）
      const isoleucine = scaleInt(food.isoleucine);
      const leucine = scaleInt(food.leucine);
      const valine = scaleInt(food.valine);
      const bcaaTotal = (isoleucine !== null && leucine !== null && valine !== null)
        ? +((isoleucine + leucine + valine) / 1000).toFixed(2)
        : null;
      const lysine = scaleInt(food.lysine);
      const methionine = scaleInt(food.methionine);
      const phenylalanine = scaleInt(food.phenylalanine);
      const threonine = scaleInt(food.threonine);
      const tryptophan = scaleInt(food.tryptophan);
      const histidine = scaleInt(food.histidine);
      const arginine = scaleInt(food.arginine);
      const alanine = scaleInt(food.alanine);
      const glutamicAcid = scaleInt(food.glutamicAcid);
      const asparticAcid = scaleInt(food.asparticAcid);

      // PFC比率
      const pKcal = protein * 4;
      const fKcal = fat * 9;
      const cKcal = carb * 4;
      const totalKcalPfc = pKcal + fKcal + cKcal;
      let pRatio = 0, fRatio = 0, cRatio = 0;
      if (totalKcalPfc > 0) {
        pRatio = Math.round((pKcal / totalKcalPfc) * 100);
        fRatio = Math.round((fKcal / totalKcalPfc) * 100);
        cRatio = Math.max(0, 100 - (pRatio + fRatio));
      }

      return {
        edibleGrams: Math.round(edibleGrams),
        energy, energyKj, water, protein, proteinAmino, fat, carb, sugar, availableCarb, fiber, fiberSoluble, fiberInsoluble, salt, ash,
        sodium, potassium, calcium, magnesium, phosphorus, iron, zinc, copper, manganese, iodine, selenium, chromium, molybdenum,
        vitaminA, retinol, betaCarotene, vitaminD, vitaminE, vitaminK, vitaminB1, vitaminB2, niacin, vitaminB6, vitaminB12, folate, pantothenicAcid, biotin, vitaminC,
        saturatedFat, monounsaturatedFat, polyunsaturatedFat, n3Fat, n6Fat, cholesterol,
        isoleucine, leucine, valine, bcaaTotal, lysine, methionine, phenylalanine, threonine, tryptophan, histidine, arginine, alanine, glutamicAcid, asparticAcid,
        aminoAcidScore: food.aminoAcidScore ?? null,
        giIndex: food.giIndex ?? null,
        pRatio, fRatio, cRatio
      };

    function loadSavedFoods() {

      if (!Array.isArray(saved)) return [];
      const seedCodes = new Set(OFFICIAL_SEED_FOODS.map((f) => f.foodCode));
      const seen = new Set();
      return saved
        .filter((f) => f && typeof f === 'object' && typeof f.id === 'string' && typeof f.displayName === 'string' && Number.isFinite(Number(f.energy)) && f.source !== 'mext_official' && !seedCodes.has(f.foodCode) && !seen.has(f.id) && seen.add(f.id))

    }

    // Gemini API 呼び出し（URLパラメータ方式 → x-goog-api-key ヘッダー方式）
    async function geminiFetch(path, apiKey, init = {}, timeoutMs = 45000) {
      const base = 'https://generativelanguage.googleapis.com/v1beta/';
      const attempts = [
        { url: `${base}${path}${path.includes('?') ? '&' : '?'}key=${encodeURIComponent(apiKey)}`, headers: {} },
        { url: `${base}${path}`, headers: { 'x-goog-api-key': apiKey } }
      ];
      let firstError = '';
      for (const a of attempts) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeoutMs);
        let res;
        try {
          res = await fetch(a.url, { ...init, headers: { ...(init.headers || {}), ...a.headers }, signal: ctrl.signal });
        } catch (e) {
          clearTimeout(timer);
          if (!firstError) firstError = e.name === 'AbortError' ? '通信がタイムアウトしました' : (e.message || '通信エラー');
          continue;
        }
        clearTimeout(timer);
        if (res.ok) return res;
        let msg = `HTTP ${res.status}`;
        try { const j = await res.json(); if (j?.error?.message) msg = j.error.message; } catch (_) {}
        if (!firstError) firstError = msg;
        if (![400, 401, 403].includes(res.status)) break;
      }
      throw new Error(firstError || '接続できませんでした');
    }

    // 利用可能モデルの自動検出（キャッシュ／ページング対応／画像・音声系除外）
    let modelCache = { key: '', model: '' };
    const EXCLUDED_MODEL = /image|tts|audio|live|embed|thinking|robotics|computer-use|learnlm|gemma|aqa|vision|imagen|veo/i;

    async function getAvailableModel(cleanKey, { force = false } = {}) {
      const key = (cleanKey || '').trim();
      if (!key) throw new Error('APIキーが入力されていません');
      if (!force && modelCache.key === key && modelCache.model) return modelCache.model;

      const models = [];
      let pageToken = '';
      for (let page = 0; page < 5; page++) {
        const res = await geminiFetch(`models?pageSize=100${pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : ''}`, key);
        const data = await res.json();
        models.push(...(data?.models || []));
        pageToken = data?.nextPageToken || '';
        if (!pageToken) break;
      }
      const candidates = models.filter((m) => m.supportedGenerationMethods?.includes('generateContent') && !EXCLUDED_MODEL.test(m.name));
      if (candidates.length === 0) throw new Error('利用可能なGeminiモデルが見つかりませんでした');
      const preferred =
        candidates.find((m) => /models\/gemini-2\.5-flash$/.test(m.name)) ||
        candidates.find((m) => m.name.includes('2.5-flash')) ||
        candidates.find((m) => m.name.includes('2.0-flash')) ||
        candidates.find((m) => m.name.includes('flash')) ||
        candidates[0];
      const model = preferred.name.replace(/^models\//, '');
      modelCache = { key, model };
      return model;
    }

    async function testGeminiApiKey(apiKeyToTest) {
      const activeModel = await getAvailableModel(apiKeyToTest, { force: true });
      return { success: true, model: activeModel };
    }

    // AI推計エンジン（Geminiによる八訂参考推計値）
    const ALL_MICRO_KEYS = [
      'sodium', 'potassium', 'calcium', 'magnesium', 'phosphorus', 'iron', 'zinc', 'copper', 'manganese', 'iodine', 'selenium', 'chromium', 'molybdenum',
      'vitaminA', 'vitaminD', 'vitaminE', 'vitaminK', 'vitaminB1', 'vitaminB2', 'niacin', 'vitaminB6', 'vitaminB12', 'folate', 'pantothenicAcid', 'biotin', 'vitaminC',
      'saturatedFat', 'cholesterol'
    ];

    async function fetchFoodFromAi(foodQuery, customApiKey) {
      const apiKey = (customApiKey || safeStorage.getText(STORAGE_KEYS.apiKey, '') || '').trim();
      if (!apiKey) throw new Error('NO_API_KEY');
      const model = await getAvailableModel(apiKey);

      const promptText = `あなたは日本食品標準成分表（八訂）に詳しい管理栄養士です。
「${foodQuery}」について、可食部100gあたりの成分値を八訂の値を参考に推計し、JSONオブジェクトのみを出力してください（マークダウンや前後の文章は一切不要）。
ルール:
- 不明な微量項目は無理に作らず null にする
- 数値はすべて number 型（文字列禁止）
- categoryCode は八訂食品群（01穀類 02いも 03砂糖 04豆 05種実 06野菜 07果実 08きのこ 09藻 10魚介 11肉 12卵 13乳 14油脂 15菓子 16嗜好飲料 17調味料 18調理済み）
キー構成:
{
  "displayName": "${foodQuery}",
  "shortName": "${foodQuery}",
  "kana": "ひらがな読み",
  "categoryCode": "06",
  "categoryName": "野菜類",
  "categoryEmoji": "🥦",
  "description": "簡単な特徴説明",
  "refuseRate": 0,
  "energy": 50,
  "protein": 2.0,
  "fat": 0.5,
  "carb": 10.0,
  "sugar": 8.0,
  "fiber": 2.0,
  "salt": 0.05,
  "potassium": 200,
  "calcium": 30,
  "magnesium": 15,
  "iron": 0.8,
  "zinc": 0.4,
  "vitaminA": 10,
  "vitaminC": 15,
  "portionUnits": [
    { "name": "1人前 (100g)", "grams": 100, "isPurchasedWeight": false, "isDefault": true }
  ]
}`;

      const payload = {
        contents: [{ role: 'user', parts: [{ text: promptText }] }],
        generationConfig: { temperature: 0.1, responseMimeType: 'application/json' }
      };

      let data;
      try {
        const res = await geminiFetch(`models/${model}:generateContent`, apiKey, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        data = await res.json();
      } catch (e) {
        modelCache = { key: '', model: '' };
        throw e;
      }

      const parts = data?.candidates?.[0]?.content?.parts || [];
      const rawText = parts.filter((p) => !p.thought && typeof p.text === 'string').map((p) => p.text).join('');
      if (!rawText) throw new Error('APIから返答がありませんでした');
      const jsonMatch = rawText.match(/\{[\s\S]*\}/);
      if (!jsonMatch) throw new Error('JSON形式の解析に失敗しました');
      let parsed;
      try { parsed = JSON.parse(jsonMatch[0]); } catch (_) { throw new Error('JSONパースに失敗しました'); }

      const name = String(parsed.displayName || foodQuery);
      const energy = numOrZero(parsed.energy);
      const carb = numOrZero(parsed.carb);
      const fiber = numOrZero(parsed.fiber);

      const food = {
        id: `food_ai_${Date.now().toString(36)}`,
        foodCode: 'AI-EST',
        source: 'ai_estimate',
        name,
        displayName: name,
        shortName: String(parsed.shortName || name),
        kana: String(parsed.kana || name),
        categoryCode: String(parsed.categoryCode ?? '').padStart(2, '0') || '06',
        categoryName: String(parsed.categoryName || '一般食品'),
        categoryEmoji: String(parsed.categoryEmoji || '🍽️'),
        description: String(parsed.description || 'Geminiによる八訂参考推計値'),
        refuseRate: Math.min(100, numOrZero(parsed.refuseRate)),
        energy,
        energyKj: Math.round(energy * 4.184),
        protein: numOrZero(parsed.protein),
        fat: numOrZero(parsed.fat),
        carb,
        sugar: numOrNull(parsed.sugar) ?? Math.max(0, carb - fiber),
        fiber,
        salt: numOrZero(parsed.salt),
        portionUnits: sanitizePortionUnits(parsed.portionUnits)
      };

      ALL_MICRO_KEYS.forEach((k) => {
        if (parsed[k] !== undefined) food[k] = numOrNull(parsed[k]);
      });

      food.warning = checkEnergyConsistency(food);
      return food;
    }

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [selectedFoodId, setSelectedFoodId] = useState('food_11221');

      // localStorageから保存済みプロファイル・レシピを復元

      const savedRecipe = useMemo(() => {

        if (!r || typeof r !== 'object' || !Array.isArray(r.items)) return null;

          .filter((i) => i && typeof i.foodId === 'string' && Number(i.grams) > 0)
          .map((i) => ({ foodId: i.foodId, grams: Number(i.grams), isPurchased: i.isPurchased === true, unitName: String(i.unitName ?? `${i.grams}g`) }));
        return { title: typeof r.title === 'string' ? r.title : '', servings: Math.min(6, Math.max(1, Number(r.servings) || 1)), items };
      }, []);

      const [foodMaster, setFoodMaster] = useState(() => [...loadSavedFoods(), ...OFFICIAL_SEED_FOODS]);
      const [isFetchingMext, setIsFetchingMext] = useState(false);
      const [isImportModalOpen, setIsImportModalOpen] = useState(false);

      const [userGender, setUserGender] = useState(savedProfile?.gender === 'female' ? 'female' : 'male');
      const [userAgeGroup, setUserAgeGroup] = useState(['18-29', '30-49', '50-64'].includes(savedProfile?.ageGroup) ? savedProfile.ageGroup : '30-49');
      const [userApiKey, setUserApiKey] = useState(() => safeStorage.getText(STORAGE_KEYS.apiKey, ''));
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);

      const [detailGrams, setDetailGrams] = useState(250);
      const [activePortionUnit, setActivePortionUnit] = useState('1枚 (約250g)');
      const [isPurchasedWeight, setIsPurchasedWeight] = useState(false);

      const [favorites, setFavorites] = useState(() => loadIdList(STORAGE_KEYS.favorites, ['food_11221', 'food_06297', 'food_01088']));
      const [history, setHistory] = useState(() => loadIdList(STORAGE_KEYS.history, ['food_11221', 'food_06297']));

      const [compareFoodA, setCompareFoodA] = useState({ id: 'food_11221', grams: 250, isPurchased: false });
      const [compareFoodB, setCompareFoodB] = useState({ id: 'food_11224', grams: 200, isPurchased: false });

      const [recipeTitle, setRecipeTitle] = useState(savedRecipe ? savedRecipe.title : '鶏もも肉ともやしの塩炒め');
      const [servings, setServings] = useState(savedRecipe ? savedRecipe.servings : 1);
      const [recipeItems, setRecipeItems] = useState(savedRecipe ? savedRecipe.items : [
        { foodId: 'food_11221', grams: 250, isPurchased: false, unitName: '鶏もも肉1枚' },
        { foodId: 'food_06297', grams: 200, isPurchased: false, unitName: 'もやし1袋' }
      ]);

      const [toastMessage, setToastMessage] = useState(null);
      const toastTimeoutRef = useRef(null);
      const [isBarcodeScannerOpen, setIsBarcodeScannerOpen] = useState(false);
      const fetchingRef = useRef(false);

      useEffect(() => {
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      }, [activeTab]);

      // 永続化（お気に入り・履歴・設定・レシピ・追加食品）
      useEffect(() => { safeStorage.setJSON(STORAGE_KEYS.favorites, favorites); }, [favorites]);
      useEffect(() => { safeStorage.setJSON(STORAGE_KEYS.history, history); }, [history]);
      useEffect(() => { safeStorage.setJSON(STORAGE_KEYS.profile, { gender: userGender, ageGroup: userAgeGroup }); }, [userGender, userAgeGroup]);
      useEffect(() => { safeStorage.setJSON(STORAGE_KEYS.recipe, { title: recipeTitle, servings, items: recipeItems }); }, [recipeTitle, servings, recipeItems]);
      useEffect(() => {
        safeStorage.setJSON(STORAGE_KEYS.foods, foodMaster.filter((f) => f.source !== 'mext_official'));
      }, [foodMaster]);

      const showToast = (msg) => {
        if (toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current);
        setToastMessage(msg);
        toastTimeoutRef.current = setTimeout(() => {
          setToastMessage(null);
          toastTimeoutRef.current = null;
        }, 4000);
      };

      const handleSelectFood = (foodId, directFood = null) => {
        const food = directFood ?? foodMaster.find((f) => f.id === foodId);
        if (!food) return;

        setSelectedFoodId(food.id);
        const defaultUnit = food.portionUnits?.find((u) => u.isDefault) ?? food.portionUnits?.[0] ?? { name: '100g', grams: 100, isPurchasedWeight: false };
        setDetailGrams(defaultUnit.grams);
        setActivePortionUnit(defaultUnit.name);
        setIsPurchasedWeight(!!defaultUnit.isPurchasedWeight);

        setHistory((prev) => [food.id, ...prev.filter((id) => id !== food.id)].slice(0, 20));
        setActiveTab('detail');
      };

      // AI推計ハンドラー（二重送信防止、同一名称の上書き対応）
      const handleQueryAi = async (keyword) => {
        const trimmed = (keyword || '').trim();
        if (!trimmed || fetchingRef.current) return;
        fetchingRef.current = true;
        setIsFetchingMext(true);
        showToast(`「${trimmed}」をAIで推計中...`);

        try {
          const fetched = await fetchFoodFromAi(trimmed, userApiKey);
          const same = foodMaster.find((f) => f.source !== 'mext_official' && f.displayName === fetched.displayName);
          const food = same ? { ...fetched, id: same.id } : fetched;
          setFoodMaster((prev) => [food, ...prev.filter((f) => f.id !== food.id)]);
          showToast(`「${food.displayName}」をAI推計で追加しました（要確認）`);
          handleSelectFood(food.id, food);
        } catch (err) {
          if (err.message === 'NO_API_KEY') {
            setIsSettingsOpen(true);
            showToast('右上の設定からGemini APIキーを設定してください');
          } else {
            console.error('Query Error:', err);
            showToast(err.message || '推計に失敗しました。再試行してください');
          }
        } finally {
          fetchingRef.current = false;
          setIsFetchingMext(false);
        }
      };

      const handleImportJsonData = (rawList) => {
        if (!Array.isArray(rawList)) return;
        const stamp = Date.now().toString(36);
        const seenCodes = new Set(foodMaster.map((f) => f.foodCode));
        const added = [];
        let skipped = 0;

        rawList.forEach((item, index) => {
          if (!item || typeof item !== 'object' || !item.displayName || !Number.isFinite(Number(item.energy))) return;
          const hasOwnCode = typeof item.foodCode === 'string' && item.foodCode.trim() !== '';
          const code = hasOwnCode ? item.foodCode.trim() : `IMP-${stamp}-${index}`;
          if (seenCodes.has(code)) { skipped += 1; return; }
          seenCodes.add(code);

          const carb = numOrZero(item.carb);
          const fiber = numOrZero(item.fiber);
          const food = {
            id: `imported_${stamp}_${index}`,
            foodCode: code,
            source: 'user_import',
            name: String(item.name ?? item.displayName),
            displayName: String(item.displayName),
            shortName: String(item.shortName ?? item.displayName),
            kana: String(item.kana ?? item.displayName),
            categoryCode: String(item.categoryCode ?? '06'),
            categoryName: item.categoryName ?? 'インポート品',
            categoryEmoji: item.categoryEmoji ?? '📦',
            refuseRate: numOrZero(item.refuseRate),
            energy: numOrZero(item.energy),
            protein: numOrZero(item.protein),
            fat: numOrZero(item.fat),
            carb,
            sugar: numOrNull(item.sugar) ?? Math.max(0, carb - fiber),
            fiber,
            salt: numOrZero(item.salt),
            portionUnits: sanitizePortionUnits(item.portionUnits)
          };
          ALL_MICRO_KEYS.forEach((k) => {
            if (item[k] !== undefined) food[k] = numOrNull(item[k]);
          });
          added.push(food);
        });

        if (added.length === 0) {
          showToast(skipped > 0 ? `すべて登録済みのためスキップしました（${skipped}件）` : '有効な食品データが見つかりませんでした');
        } else {
          setFoodMaster((prev) => [...added, ...prev]);
          showToast(`${added.length} 件を追加しました${skipped > 0 ? `（重複 ${skipped} 件はスキップ）` : ''}`);
        }
        setIsImportModalOpen(false);
      };

      const handleToggleFavorite = (foodId) => {
        setFavorites((prev) => {
          const exists = prev.includes(foodId);
          return exists ? prev.filter((id) => id !== foodId) : [...prev, foodId];
        });
        showToast(favorites.includes(foodId) ? 'お気に入りから解除しました' : 'お気に入りに追加しました');
      };

      const handleAddToCompare = (foodId) => {
        const food = foodMaster.find((f) => f.id === foodId);
        setCompareFoodB({ id: foodId, grams: 100, isPurchased: false });
        showToast(`「${food?.shortName}」を比較スロットBにセットしました`);
        setActiveTab('compare');
      };

      const handleAddToRecipe = (foodId, grams, unitName, isPurchased) => {
        const food = foodMaster.find((f) => f.id === foodId);
        setRecipeItems((prev) => [
          ...prev,
          { foodId, grams, isPurchased: !!isPurchased, unitName: unitName || `${grams}g` }
        ]);
        showToast(`「${food?.shortName} (${grams}g)」をマイレシピに追加しました`);
      };

      const handleCopySummary = (text) => {
        if (navigator?.clipboard?.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            showToast('栄養サマリーをクリップボードにコピーしました！');
          }).catch(() => {
            showToast('コピーに失敗しました');
          });
        }
      };

      const currentDri = useMemo(() => {
        return DETAILED_DRI_TABLE[userGender]?.[userAgeGroup] ?? DETAILED_DRI_TABLE.male['30-49'];
      }, [userGender, userAgeGroup]);

      const ageGroupDisplay = useMemo(() => {
        if (userAgeGroup === '18-29') return '20代以下';
        if (userAgeGroup === '30-49') return '30〜40代';
        if (userAgeGroup === '50-64') return '50〜64歳';
        return userAgeGroup;
      }, [userAgeGroup]);

      const navigationItems = [
        { id: 'home', label: 'さがす', icon: Search },
        { id: 'detail', label: '詳細・分量', icon: Sliders },
        { id: 'compare', label: 'くらべる', icon: Scale },
        { id: 'recipe', label: 'けいさん', icon: Calculator, badge: recipeItems.length > 0 ? recipeItems.length : null },
        { id: 'favorites', label: '保存・履歴', icon: Bookmark, dot: favorites.length > 0 }
      ];

      return (
        <div className="min-h-screen min-h-dvh w-full max-w-full overflow-x-hidden bg-[#F4F7F5] text-slate-800 flex flex-col font-sans">
          
          {/* ヘッダー */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-sm border-b border-emerald-100 shadow-sm w-full max-w-full">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5 sm:py-3 flex items-center justify-between gap-3 w-full">
              
              <div className="flex items-center gap-2 sm:gap-2.5 cursor-pointer group shrink-0" onClick={() => setActiveTab('home')}>
                <div className="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-600 flex items-center justify-center font-black text-white shadow-sm group-hover:scale-105 transition-transform shrink-0">
                  <Flame size={19} className="fill-white text-white" />
                </div>
                <div className="min-w-0">
                  <div className="flex items-center gap-1.5">
                    <span className="font-extrabold tracking-tight text-base sm:text-xl text-slate-900 truncate">NutriDex</span>
                    <span className="text-[10px] font-black px-1.5 py-0.5 rounded-md bg-slate-900 text-white font-mono tracking-tighter shrink-0 shadow-sm">
                      {APP_VERSION}
                    </span>
                    <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200 shrink-0 hidden sm:inline-block">
                      八訂準拠・参考値
                    </span>
                  </div>
                  <p className="text-[10px] text-emerald-700/90 font-medium hidden sm:block truncate">八訂準拠の栄養辞書（一部AI推計）</p>
                </div>
              </div>

              {/* PC用ナビゲーション */}
              <nav className="hidden md:flex items-center gap-1 lg:gap-2 shrink-0">
                {navigationItems.map((item) => {
                  const Icon = item.icon;
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => {
                        if (item.id === 'detail' && !selectedFoodId) setSelectedFoodId('food_11221');
                        setActiveTab(item.id);
                      }}
                      className={`px-3 lg:px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 relative ${
                        isActive
                          ? 'bg-emerald-50 text-emerald-700 border border-emerald-200/80 shadow-sm'
                          : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100/70'
                      }`}
                    >
                      <Icon size={16} className={isActive ? 'text-emerald-600' : 'text-slate-400'} />
                      <span>{item.label}</span>
                      {item.badge && (
                        <span className="w-4 h-4 bg-emerald-600 text-white rounded-full text-[9px] flex items-center justify-center font-extrabold">
                          {item.badge}
                        </span>
                      )}
                      {item.dot && <span className="w-1.5 h-1.5 bg-amber-400 rounded-full" />}
                    </button>
                  );
                })}
              </nav>

              {/* 右側アクションエリア */}
              <div className="flex items-center gap-1.5 sm:gap-2 shrink-0">
                <button
                  onClick={() => setIsImportModalOpen(true)}
                  className="p-2 sm:px-2.5 sm:py-1.5 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 transition-all shadow-sm flex items-center gap-1.5"
                  title="公的JSON取込"
                >
                  <Upload size={16} />
                  <span className="text-xs font-semibold hidden lg:inline">取込</span>
                </button>

                <button
                  onClick={() => setIsBarcodeScannerOpen(true)}
                  className="p-2 sm:px-2.5 sm:py-1.5 rounded-xl bg-emerald-50/80 hover:bg-emerald-100 text-emerald-700 border border-emerald-200/80 transition-all shadow-sm flex items-center gap-1.5"
                  title="バーコード読取"
                >
                  <Scan size={16} className="text-emerald-600" />
                  <span className="text-xs font-semibold hidden lg:inline">読取</span>
                </button>

                <button
                  onClick={() => setIsSettingsOpen(true)}
                  className="px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-xl bg-white hover:bg-emerald-50 text-xs font-semibold text-slate-700 border border-slate-200 transition-all flex items-center gap-1.5 shadow-sm"
                >
                  <Settings size={14} className="text-emerald-600" />
                  <span className="font-bold">{userGender === 'male' ? '男性' : '女性'} {ageGroupDisplay}</span>
                </button>
              </div>
            </div>

          <main className="flex-1 w-full max-w-7xl mx-auto p-3.5 sm:p-6 lg:p-8 pb-28 md:pb-12 box-border">
            {activeTab === 'home' && (
              <HomeScreen
                foods={foodMaster}
                onSelectFood={handleSelectFood}
                onQueryAi={handleQueryAi}
                isFetchingMext={isFetchingMext}
                onQuickCompare={(idA, idB) => {
                  setCompareFoodA({ id: idA, grams: 250, isPurchased: false });
                  setCompareFoodB({ id: idB, grams: 200, isPurchased: false });
                  setActiveTab('compare');
                }}
                onOpenBarcode={() => setIsBarcodeScannerOpen(true)}
              />
            )}

            {activeTab === 'detail' && (
              <DetailScreen
                foodMaster={foodMaster}
                foodId={selectedFoodId}
                currentGrams={detailGrams}
                onChangeGrams={setDetailGrams}
                activeUnit={activePortionUnit}
                onChangeUnit={setActivePortionUnit}
                isPurchasedWeight={isPurchasedWeight}
                onChangePurchasedWeight={setIsPurchasedWeight}
                currentDri={currentDri}
                isFavorite={favorites.includes(selectedFoodId)}
                onToggleFavorite={() => handleToggleFavorite(selectedFoodId)}
                onBack={() => setActiveTab('home')}
                onAddToCompare={handleAddToCompare}
                onAddToRecipe={handleAddToRecipe}
                onCopySummary={handleCopySummary}
              />
            )}

            {activeTab === 'compare' && (
              <CompareScreen

    function DetailScreen({
      foodMaster, foodId, currentGrams, onChangeGrams, activeUnit, onChangeUnit,
      isPurchasedWeight, onChangePurchasedWeight, currentDri, isFavorite, onToggleFavorite,
      onBack, onAddToCompare, onAddToRecipe, onCopySummary

      const [activeNutrientCategory, setActiveNutrientCategory] = useState('all');
      const [nutrientFilterKeyword, setNutrientFilterKeyword] = useState('');

      const food = foodMaster.find((f) => f.id === foodId) ?? foodMaster[0];
      const n = useMemo(() => calculateScaledNutrients(food, currentGrams, isPurchasedWeight), [food, currentGrams, isPurchasedWeight]);

      const mealDri = useMemo(() => {
        const res = {};
        Object.keys(currentDri).forEach((k) => {
          res[k] = (currentDri[k] ?? 0) / 3.0;
        });
        return res;
      }, [currentDri]);

      const handleUnitSelect = (u) => {
        onChangeUnit(u.name);
        onChangeGrams(u.grams);
        onChangePurchasedWeight(!!u.isPurchasedWeight);
      };

      // 廃棄率フラグを破壊しない安全なグラム増減
      const adjustGrams = (diff) => {
        const nextVal = Math.max(5, Math.min(Math.max(500, currentGrams), currentGrams + diff));
        onChangeGrams(nextVal);
        onChangeUnit('カスタム');
      };

      // カロリーSlism準拠：全詳細栄養素定義
      const allNutrients = useMemo(() => {
        if (!n) return [];
        return [
          // 【基本・熱量】

          { category: 'basic', name: '水分', val: n.water, unit: 'g', dri: null },

    function CompareScreen({ foodMaster, foodAConfig, foodBConfig, onChangeFoodA, onChangeFoodB }) {
      const foodA = foodMaster.find((f) => f.id === foodAConfig.id) ?? foodMaster[0];
      const foodB = foodMaster.find((f) => f.id === foodBConfig.id) ?? foodMaster[1];

      const nA = useMemo(() => calculateScaledNutrients(foodA, foodAConfig.grams, foodAConfig.isPurchased), [foodA, foodAConfig]);
      const nB = useMemo(() => calculateScaledNutrients(foodB, foodBConfig.grams, foodBConfig.isPurchased), [foodB, foodBConfig]);

      const handleSwap = () => {
        const temp = { ...foodAConfig };
        onChangeFoodA(foodBConfig);
        onChangeFoodB(temp);
      };

      return (
        <div className="max-w-4xl mx-auto space-y-4 sm:space-y-5 w-full">
          <div className="flex items-center justify-between w-full">
            <div className="flex items-center gap-2">
              <Scale size={20} className="text-emerald-600 shrink-0" />
              <h2 className="text-base sm:text-lg font-extrabold text-slate-900">食品くらべる（VS比較）</h2>
            </div>
            <button
              onClick={handleSwap}
              className="px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl bg-white hover:bg-emerald-50 text-xs sm:text-sm font-bold text-emerald-700 border border-emerald-200 flex items-center gap-1.5 shadow-sm transition-colors shrink-0"
            >
              <RotateCcw size={15} />
              <span>左右スワップ</span>
            </button>
          </div>

          <div className="grid grid-cols-2 gap-3 sm:gap-4 w-full">
            <div className="bg-white p-3.5 sm:p-5 rounded-3xl border border-slate-200/80 space-y-3 shadow-sm w-full box-border">
              <div className="text-center w-full">
                <span className="text-3xl sm:text-4xl">{foodA?.categoryEmoji}</span>
                <select
                  value={foodA?.id}
                  onChange={(e) => onChangeFoodA({ ...foodAConfig, id: e.target.value })}
                  className="w-full mt-2 bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold text-slate-800 text-center"
                >
                  {foodMaster.map((f) => <option key={f.id} value={f.id}>{f.shortName}</option>)}
                </select>
              </div>
              <div className="space-y-1.5 w-full">
                <div className="flex justify-between text-xs text-slate-500">
                  <span>分量:</span>
                  <span className="font-extrabold text-slate-900">{foodAConfig.grams}g</span>
                </div>
                <input
                  type="range"
                  min="10"
                  max="400"
                  step="10"
                  value={foodAConfig.grams}
                  onChange={(e) => onChangeFoodA({ ...foodAConfig, grams: Number(e.target.value) })}
                  className="w-full accent-emerald-600 h-2 bg-slate-200 rounded-lg cursor-pointer"
                />
              </div>
            </div>

            <div className="bg-white p-3.5 sm:p-5 rounded-3xl border border-slate-200/80 space-y-3 shadow-sm w-full box-border">
              <div className="text-center w-full">
                <span className="text-3xl sm:text-4xl">{foodB?.categoryEmoji}</span>
                <select
                  value={foodB?.id}
                  onChange={(e) => onChangeFoodB({ ...foodBConfig, id: e.target.value })}
                  className="w-full mt-2 bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold text-slate-800 text-center"
                >
                  {foodMaster.map((f) => <option key={f.id} value={f.id}>{f.shortName}</option>)}
                </select>
              </div>
              <div className="space-y-1.5 w-full">
                <div className="flex justify-between text-xs text-slate-500">
                  <span>分量:</span>
                  <span className="font-extrabold text-slate-900">{foodBConfig.grams}g</span>
                </div>
                <input
                  type="range"
                  min="10"
                  max="400"
                  step="10"
                  value={foodBConfig.grams}
                  onChange={(e) => onChangeFoodB({ ...foodBConfig, grams: Number(e.target.value) })}
                  className="w-full accent-teal-600 h-2 bg-slate-200 rounded-lg cursor-pointer"
                />
              </div>
            </div>
          </div>

          <div className="bg-white rounded-3xl border border-slate-200/80 p-4 sm:p-5 space-y-4 shadow-sm text-xs sm:text-sm w-full box-border">
            <div>
              <div className="font-bold text-slate-500 text-center mb-1.5">カロリー (kcal)</div>
              <div className="grid grid-cols-2 gap-2.5 sm:gap-4 items-center w-full">
                <div className={`p-3 sm:p-4 rounded-2xl text-center border min-w-0 ${nA.energy < nB.energy ? 'bg-emerald-50 border-emerald-300' : 'bg-slate-50 border-slate-200'}`}>

                </div>
                <div className={`p-2.5 sm:p-3 rounded-2xl text-center border min-w-0 ${nB.protein > nA.protein ? 'bg-rose-50 border-rose-300 text-rose-700' : 'bg-slate-50 border-slate-200 text-slate-700'}`}>
                  <div className="font-extrabold text-sm sm:text-base truncate">{nB.protein} g</div>
                  {nB.protein > nA.protein && <span className="text-[10px] sm:text-xs font-bold text-rose-600 truncate block">★ 高タンパク</span>}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function RecipeScreen({ foodMaster, title, onChangeTitle, servings, onChangeServings, items, onChangeItems, onAddMoreFood, onCopySummary }) {
      const handleItemGramChange = (index, delta) => {
        onChangeItems(items.map((item, i) => i === index ? { ...item, grams: Math.max(5, item.grams + delta) } : item));
      };

      const handleRemoveItem = (index) => {
        onChangeItems(items.filter((_, i) => i !== index));
      };

      const totals = useMemo(() => {
        let energy = 0, protein = 0, fat = 0, carb = 0, sugar = 0, fiber = 0, salt = 0;
        items.forEach((item) => {
          const food = foodMaster.find((f) => f.id === item.foodId);
          if (food) {
            const sc = calculateScaledNutrients(food, item.grams, item.isPurchased);
            energy += sc.energy;
            protein += sc.protein;
            fat += sc.fat;
            carb += sc.carb;
            sugar += sc.sugar;
            fiber += sc.fiber;
            salt += sc.salt;
          }
        });

        const divisor = Math.max(1, servings);
        const perServing = {
          energy: Math.round(energy / divisor),
          protein: +(protein / divisor).toFixed(1),
          fat: +(fat / divisor).toFixed(1),
          carb: +(carb / divisor).toFixed(1),
          sugar: +(sugar / divisor).toFixed(1),
          fiber: +(fiber / divisor).toFixed(1),
          salt: +(salt / divisor).toFixed(2)
        };

        const pKcal = perServing.protein * 4;
        const fKcal = perServing.fat * 9;
        const cKcal = perServing.carb * 4;
        const totalPfc = pKcal + fKcal + cKcal || 1;

        return {
          totalEnergy: Math.round(energy),
          perServing,
          pRatio: Math.round((pKcal / totalPfc) * 100),
          fRatio: Math.round((fKcal / totalPfc) * 100),
          cRatio: Math.max(0, 100 - (Math.round((pKcal / totalPfc) * 100) + Math.round((fKcal / totalPfc) * 100)))
        };
      }, [foodMaster, items, servings]);

      const [jsonInput, setJsonInput] = useState('');

        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (Array.isArray(parsed)) onImport(parsed);
            else setErrorMsg('JSONは配列形式である必要があります');
          } catch (_) {
            setErrorMsg('パースに失敗しました');
          }
        };
        reader.readAsText(file);
      };

      const handlePasteImport = () => {
        try {
          const parsed = JSON.parse(jsonInput);
          if (Array.isArray(parsed)) onImport(parsed);
          else setErrorMsg('配列形式で貼り付けてください');
        } catch (_) {
          setErrorMsg('有効なJSONではありません');
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">

                <h3 className="text-base font-bold text-slate-900">バーコード認識シミュレーター</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
            </div>

            <div className="relative w-full h-36 bg-slate-900 rounded-2xl border-2 border-dashed border-emerald-500 flex flex-col items-center justify-center text-center p-4">
              <Camera size={32} className="text-slate-500 mb-1" />
              <p className="text-xs text-white font-bold">バーコード読取シミュレーター</p>
            </div>

            <div className="space-y-1.5">
              <span className="text-xs font-bold text-slate-600">検証用サンプル:</span>
              <div className="grid grid-cols-1 gap-2 max-h-36 overflow-y-auto">
                {sampleBarcodes.map((item) => (
                  <button
                    key={item.id}
                    onClick={() => onDetected(item.id)}
                    className="bg-slate-50 hover:bg-emerald-50 p-2.5 rounded-xl text-left border border-slate-200 flex items-center justify-between text-xs"
                  >
                    <span className="font-bold text-slate-800">{item.name}</span>
                    <span className="font-mono text-emerald-700">{item.code}</span>
                  </button>
                ))}
              </div>
            </div>

            <button onClick={onClose} className="w-full py-2 bg-slate-100 text-slate-700 rounded-2xl text-xs font-bold">
              閉じる
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
