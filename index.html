      getJSON(k, fb) {
        try {
          const r = localStorage.getItem(k);
          return r === null ? fb : JSON.parse(r);
        } catch (_) { return fb; }
      },
      setJSON(k, v) {
        try {
          localStorage.setItem(k, JSON.stringify(v));
          return true;
        } catch (_) { return false; }
      },
      getText(k, fb = '') {
        try {
          const r = localStorage.getItem(k);
          return r === null ? fb : r;
        } catch (_) { return fb; }
      },
      setText(k, v) {
        try {
          localStorage.setItem(k, v);
          return true;
        } catch (_) { return false; }
      }
    };

    const loadIdList = (key, fb) => {
      const v = safeStorage.getJSON(key, null);
      return Array.isArray(v) ? v.filter((x) => typeof x === 'string') : fb;

    const numOrNull = (v) => {
      if (v === null || v === undefined || v === '') return null;
      const n = Number(v);
      return Number.isFinite(n) && n >= 0 ? n : null;

    const numOrZero = (v) => numOrNull(v) ?? 0;

    // --- カタカナ・ひらがな相互変換ヘルパー ---
    function katakanaToHiragana(str) {
      return String(str ?? '').replace(/[\u30a1-\u30f6]/g, (m) => String.fromCharCode(m.charCodeAt(0) - 0x60));
    }
    function hiraganaToKatakana(str) {
      return String(str ?? '').replace(/[\u3041-\u3096]/g, (m) => String.fromCharCode(m.charCodeAt(0) + 0x60));
    }

    // 入力クエリを漢字・ひらがな・カタカナ・同義語へ双方向展開する関数
    function expandSearchTerms(rawQuery) {
      const q = String(rawQuery ?? '').trim();
      if (!q) return [];
      
      // スペース区切りの複数単語（アンド検索）対応
      const subQueries = q.split(/[\s　]+/).filter(Boolean);

      return subQueries.map((subQ) => {
        const hira = katakanaToHiragana(subQ.toLowerCase());
        const kata = hiraganaToKatakana(hira);
        const variants = new Set([subQ, hira, kata, subQ.toLowerCase()]);

        // シノニム辞書から該当する漢字・ひらがな・カタカナをすべて連結
        SYNONYM_DICTIONARY.forEach((entry) => {
          const matchKanji = entry.kanji.some(k => subQ.includes(k) || k.includes(subQ));
          const matchKana = entry.kana.some(k => hira.includes(k) || k.includes(hira));
          if (matchKanji || matchKana) {
            entry.kanji.forEach(k => {
              variants.add(k);
              variants.add(katakanaToHiragana(k));
              variants.add(hiraganaToKatakana(k));
            });
            entry.kana.forEach(k => {
              variants.add(k);
              variants.add(katakanaToHiragana(k));
              variants.add(hiraganaToKatakana(k));
            });
          }
        });

        return Array.from(variants).map(v => normalizeSearch(v)).filter(Boolean);
      });
    }

    function sanitizePortionUnits(units) {
      const cleaned = (Array.isArray(units) ? units : [])
        .map((u) => ({
          name: String(u?.name ?? '').trim(),
          grams: Number(u?.grams),
          isPurchasedWeight: u?.isPurchasedWeight === true || u?.isPurchasedWeight === 'true',
          isDefault: u?.isDefault === true
        }))
        .filter((u) => u.name && Number.isFinite(u.grams) && u.grams > 0);
      if (cleaned.length === 0) return [{ name: '100g', grams: 100, isPurchasedWeight: false, isDefault: true }];
      if (!cleaned.some((u) => u.isDefault)) cleaned[0].isDefault = true;
      return cleaned;
    }

    function calculateScaledNutrients(food, grams, isPurchasedWeight = false) {
      if (!food) return null;
      const rawGrams = Math.max(0, Number(grams) || 0);
      const refuseRate = Number(food.refuseRate) || 0;
      const edibleGrams = isPurchasedWeight ? rawGrams * (1 - refuseRate / 100) : rawGrams;
      const ratio = edibleGrams / 100;

      const scaleNum = (val, decimals = 1) => (val === null || val === undefined) ? null : +(Number(val) * ratio).toFixed(decimals);
      const scaleInt = (val) => (val === null || val === undefined) ? null : Math.round(Number(val) * ratio);

      const energy = Math.round((food.energy ?? 0) * ratio);
      const energyKj = Math.round((food.energyKj ?? (food.energy ?? 0) * 4.184) * ratio);
      const protein = +( (food.protein ?? 0) * ratio ).toFixed(1);
      const fat = +( (food.fat ?? 0) * ratio ).toFixed(1);
      const carb = +( (food.carb ?? 0) * ratio ).toFixed(1);
      const fiber = +( (food.fiber ?? 0) * ratio ).toFixed(1);
      const sugar = +( (food.sugar ?? Math.max(0, (food.carb ?? 0) - (food.fiber ?? 0))) * ratio ).toFixed(1);
      const salt = +( (food.salt ?? 0) * ratio ).toFixed(2);

      const potassium = scaleInt(food.potassium);
      const calcium = scaleInt(food.calcium);
      const magnesium = scaleInt(food.magnesium);
      const iron = scaleNum(food.iron, 2);
      const zinc = scaleNum(food.zinc, 2);
      const vitaminA = scaleInt(food.vitaminA);
      const vitaminD = scaleNum(food.vitaminD, 1);
      const vitaminE = scaleNum(food.vitaminE, 1);
      const vitaminK = scaleInt(food.vitaminK);
      const vitaminB1 = scaleNum(food.vitaminB1, 2);
      const vitaminB2 = scaleNum(food.vitaminB2, 2);
      const vitaminC = scaleNum(food.vitaminC, 1);
      const saturatedFat = scaleNum(food.saturatedFat, 2);
      const monounsaturatedFat = scaleNum(food.monounsaturatedFat, 2);
      const polyunsaturatedFat = scaleNum(food.polyunsaturatedFat, 2);

      const pKcal = protein * 4;
      const fKcal = fat * 9;
      const cKcal = carb * 4;
      const totalKcalPfc = pKcal + fKcal + cKcal;
      let pRatio = 0, fRatio = 0, cRatio = 0;
      if (totalKcalPfc > 0) {
        pRatio = Math.round((pKcal / totalKcalPfc) * 100);
        fRatio = Math.round((fKcal / totalKcalPfc) * 100);
        cRatio = Math.max(0, 100 - (pRatio + fRatio));
      }

      return {
        edibleGrams: Math.round(edibleGrams),
        energy, energyKj, protein, fat, carb, sugar, fiber, salt,
        potassium, calcium, magnesium, iron, zinc,
        vitaminA, vitaminD, vitaminE, vitaminK, vitaminB1, vitaminB2, vitaminC,
        saturatedFat, monounsaturatedFat, polyunsaturatedFat,
        pRatio, fRatio, cRatio
      };
    }

      if (name.includes('れんこん')) extraKeywords.push('蓮根 レンコン');
      if (name.includes('ごぼう')) extraKeywords.push('牛蒡 ゴボウ');
      if (name.includes('しょうが')) extraKeywords.push('生姜 ショウガ');
      if (name.includes('にんにく')) extraKeywords.push('大蒜 ニンニク');
      if (name.includes('しいたけ')) extraKeywords.push('椎茸 シイタケ');
      if (name.includes('えのき')) extraKeywords.push('榎茸 エノキ');
      if (name.includes('しめじ')) extraKeywords.push('占地 シメジ');
      if (name.includes('まいたけ')) extraKeywords.push('舞茸 マイタケ');
      if (name.includes('さけ') || name.includes('しゃけ')) extraKeywords.push('鮭 サケ シャケ サーモン');
      if (name.includes('まぐろ')) extraKeywords.push('鮪 マグロ ツナ');
      if (name.includes('さば')) extraKeywords.push('鯖 サバ');
      if (name.includes('あじ')) extraKeywords.push('鯵 アジ');
      if (name.includes('さんま')) extraKeywords.push('秋刀魚 サンマ');
      if (name.includes('たい')) extraKeywords.push('鯛 タイ');
      if (name.includes('たら')) extraKeywords.push('鱈 タラ');
      if (name.includes('ぶり')) extraKeywords.push('鰤 ブリ');
      if (name.includes('えび')) extraKeywords.push('海老 エビ 蝦');
      if (name.includes('いか')) extraKeywords.push('烏賊 イカ');
      if (name.includes('たこ')) extraKeywords.push('蛸 タコ');
      if (name.includes('わかめ')) extraKeywords.push('若布 ワカメ');
      if (name.includes('こんぶ')) extraKeywords.push('昆布 コンブ');
      if (name.includes('のり')) extraKeywords.push('海苔 ノリ');
      if (name.includes('ひじき')) extraKeywords.push('羊栖菜 ヒジキ');
      if (name.includes('とうふ')) extraKeywords.push('豆腐 トウフ');
      if (name.includes('なっとう')) extraKeywords.push('納豆 ナットウ');
      if (name.includes('オリーブ油')) extraKeywords.push('オリーブオイル エクストラバージン おりーぶおいる 油');
      if (name.includes('米ぬか油')) extraKeywords.push('こめあぶら 米油 こめ油 ライスオイル 油');
      if (name.includes('ごま油')) extraKeywords.push('胡麻油 セサミオイル ごま ゴマ 油');

      let kana = `${String(raw.kana || name)} ${extraKeywords.join(' ')}`;

      let portionUnits = raw.portionUnits;
      if (!portionUnits || portionUnits.length === 0) {
        if (grp === '14') {
          portionUnits = [
            { name: '大さじ1 (12g)', grams: 12, isPurchasedWeight: false, isDefault: true },
            { name: '小さじ1 (4g)', grams: 4, isPurchasedWeight: false, isDefault: false },
            { name: '100g', grams: 100, isPurchasedWeight: false, isDefault: false }
          ];
        } else {
          portionUnits = [{ name: '100g', grams: 100, isPurchasedWeight: false, isDefault: true }];
        }
      }

      return {
        id: `mext_${code}`,
        foodCode: code,
        source: 'mext_official',
        name,
        displayName: name,
        shortName: name.split('/')[name.split('/').length - 1].split(' ')[0],
        kana,
        categoryCode: grp,
        categoryName: cat.name,
        categoryEmoji: cat.emoji,
        refuseRate,
        energy,
        energyKj: Math.round(energy * 4.184),
        protein,
        fat,
        carb,
        sugar,
        fiber,
        salt,
        potassium: numOrNull(raw.k ?? raw.potassium),
        calcium: numOrNull(raw.ca ?? raw.calcium),
        magnesium: numOrNull(raw.mg ?? raw.magnesium),
        iron: numOrNull(raw.fe ?? raw.iron),
        zinc: numOrNull(raw.zn ?? raw.zinc),
        vitaminA: numOrNull(raw.vitaRae ?? raw.vitaminA),
        vitaminD: numOrNull(raw.vitD ?? raw.vitaminD),
        vitaminE: numOrNull(raw.tocphA ?? raw.vitaminE),
        vitaminK: numOrNull(raw.vitK ?? raw.vitaminK),
        vitaminB1: numOrNull(raw.thia ?? raw.vitaminB1),
        vitaminB2: numOrNull(raw.ribf ?? raw.vitaminB2),
        vitaminC: numOrNull(raw.vitC ?? raw.vitaminC),
        saturatedFat: numOrNull(raw.fasat ?? raw.saturatedFat),
        monounsaturatedFat: numOrNull(raw.fams ?? raw.monounsaturatedFat),
        polyunsaturatedFat: numOrNull(raw.fapu ?? raw.polyunsaturatedFat),
        portionUnits: sanitizePortionUnits(portionUnits)
      };
    }

    function mergeFoodLists(base, incoming) {
      const codeMap = new Map();
      base.forEach(f => codeMap.set(f.foodCode, f));
      incoming.forEach(f => {
        if (f && f.foodCode) codeMap.set(f.foodCode, f);
      });
      return Array.from(codeMap.values());
    }

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [selectedFoodId, setSelectedFoodId] = useState('food_14003');

      const [foodMaster, setFoodMaster] = useState(INTRINSIC_OFFICIAL_FOODS);
      const [dbSyncStatus, setDbSyncStatus] = useState('syncing');

      const [userGender, setUserGender] = useState('male');
      const [userAgeGroup, setUserAgeGroup] = useState('30-49');
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);

      const [detailGrams, setDetailGrams] = useState(12);
      const [activePortionUnit, setActivePortionUnit] = useState('大さじ1 (12g)');
      const [isPurchasedWeight, setIsPurchasedWeight] = useState(false);

      const [favorites, setFavorites] = useState(() => loadIdList(STORAGE_KEYS.favorites, ['food_14003', 'food_14001', 'food_11221']));
      const [history, setHistory] = useState(() => loadIdList(STORAGE_KEYS.history, ['food_14003', 'food_14001']));

      const [compareFoodA, setCompareFoodA] = useState({ id: 'food_14003', grams: 12, isPurchased: false });
      const [compareFoodB, setCompareFoodB] = useState({ id: 'food_14001', grams: 12, isPurchased: false });

      // レシピアイテム管理
      const savedRecipeData = useMemo(() => safeStorage.getJSON(STORAGE_KEYS.recipe, null), []);
      const [recipeTitle, setRecipeTitle] = useState(savedRecipeData?.title || 'マイレシピ');
      const [servings, setServings] = useState(savedRecipeData?.servings || 1);
      const [recipeItems, setRecipeItems] = useState(Array.isArray(savedRecipeData?.items) ? savedRecipeData.items : []);

      const [toastData, setToastData] = useState(null);
      const toastTimeoutRef = useRef(null);
      const [isManualSyncing, setIsManualSyncing] = useState(false);

      const showToast = (msg, actionLabel = null, onAction = null) => {
        if (toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current);
        setToastData({ msg, actionLabel, onAction });
        toastTimeoutRef.current = setTimeout(() => setToastData(null), 4000);
      };

      // 画面切り替え時にスクロールを上部へ
      useEffect(() => {
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      }, [activeTab]);

      // データベース同期
      const syncDatabase = async (isManual = false) => {
        if (isManual) setIsManualSyncing(true);
        const endpoints = [
          './mext_foods.json',
          'https://raw.githubusercontent.com/katoharu432/standards-tables-of-food-composition-in-japan/master/data.json',
          'https://fastly.jsdelivr.net/gh/katoharu432/standards-tables-of-food-composition-in-japan@master/data.json',
          'https://cdn.jsdelivr.net/gh/katoharu432/standards-tables-of-food-composition-in-japan@master/data.json'
        ];

        let success = false;
        for (const url of endpoints) {
          try {
            const res = await fetch(url, { cache: isManual ? 'reload' : 'force-cache' });
            if (res.ok) {
              const rawData = await res.json();
              if (Array.isArray(rawData) && rawData.length > 500) {
                const formatted = rawData.map(transformExternalMextItem).filter(Boolean);
                setFoodMaster(prev => mergeFoodLists(prev, formatted));
                setDbSyncStatus('synced');
                showToast(isManual ? `データを最新に更新しました（${formatted.length}品目）` : `八訂公式 ${formatted.length}品目を同期完了！`);
                success = true;
                break;
              }
            }
          } catch (_) {}
        }

        if (!success) {
          setDbSyncStatus('builtin_ready');
          if (isManual) showToast('内蔵マスターデータを再読み込みしました');
        }
        if (isManual) setIsManualSyncing(false);
      };

      useEffect(() => {
        syncDatabase(false);
      }, []);

      useEffect(() => { safeStorage.setJSON(STORAGE_KEYS.favorites, favorites); }, [favorites]);
      useEffect(() => { safeStorage.setJSON(STORAGE_KEYS.history, history); }, [history]);
      useEffect(() => { safeStorage.setJSON(STORAGE_KEYS.recipe, { title: recipeTitle, servings, items: recipeItems }); }, [recipeTitle, servings, recipeItems]);

      const handleSelectFood = (foodId, directFood = null) => {
        const food = directFood ?? foodMaster.find((f) => f.id === foodId);
        if (!food) return;
        setSelectedFoodId(food.id);
        const defaultUnit = food.portionUnits?.[0] || { name: '100g', grams: 100, isPurchasedWeight: false };
        setDetailGrams(defaultUnit.grams);
        setActivePortionUnit(defaultUnit.name);
        setIsPurchasedWeight(!!defaultUnit.isPurchasedWeight);
        setHistory((prev) => [food.id, ...prev.filter((id) => id !== food.id)].slice(0, 20));
        setActiveTab('detail');
      };

      // レシピ追加
      const handleAddToRecipe = (foodId, grams, unitName, isPurchased) => {
        const targetFood = foodMaster.find(f => f.id === foodId);
        setRecipeItems(prev => [
          ...prev,
          {
            foodId,
            grams: Number(grams) || 100,
            unitName: unitName || `${grams}g`,
            isPurchased: !!isPurchased
          }
        ]);
        showToast(
          `「${targetFood?.shortName || '食材'} (${grams}g)」をレシピに追加しました`,
          'レシピを見る ➔',
          () => setActiveTab('recipe')
        );
      };

      const currentDri = useMemo(() => DETAILED_DRI_TABLE[userGender]?.[userAgeGroup] || DETAILED_DRI_TABLE.male['30-49'], [userGender, userAgeGroup]);

      const navItems = [
        { id: 'home', label: 'さがす', icon: Search },
        { id: 'detail', label: '詳細・分量', icon: Sliders },
        { id: 'compare', label: 'くらべる', icon: Scale },
        { id: 'recipe', label: 'けいさん', icon: Calculator, badgeCount: recipeItems.length },
        { id: 'favorites', label: '保存・履歴', icon: Bookmark }
      ];

      return (
        <div className="min-h-screen min-h-dvh w-full max-w-full overflow-x-hidden bg-[#F4F7F5] text-slate-800 flex flex-col font-sans">
          
          {/* ヘッダー */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-sm border-b border-emerald-100 shadow-sm w-full">
            <div className="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-2.5 sm:py-3 flex items-center justify-between gap-2 sm:gap-3">
              
              {/* ブランドロゴ ＆ アプリ名 ＆ バージョン */}
              <div className="flex items-center gap-2 cursor-pointer group shrink-0 min-w-0" onClick={() => setActiveTab('home')}>
                <div className="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-600 flex items-center justify-center font-black text-white shadow-sm group-hover:scale-105 transition-transform shrink-0">
                  <Flame size={18} className="fill-white text-white" />
                </div>
                <div className="flex items-center gap-1.5 shrink-0">
                  <span className="font-extrabold tracking-tight text-base sm:text-xl text-slate-900 shrink-0">NutriDex</span>
                  <span className="text-[10px] font-black px-1.5 py-0.5 rounded-md bg-slate-900 text-white font-mono tracking-tighter shrink-0 shadow-sm">
                    {APP_VERSION}
                  </span>
                  <span className={`text-[10px] font-bold px-1.5 sm:px-2 py-0.5 rounded-full border shrink-0 flex items-center gap-1 ${
                    dbSyncStatus === 'synced' ? 'bg-emerald-100 text-emerald-800 border-emerald-200' :
                    dbSyncStatus === 'syncing' ? 'bg-amber-100 text-amber-800 border-amber-200 animate-pulse' :
                    'bg-slate-100 text-slate-700 border-slate-200'
                  }`}>
                    <Database size={11} />
                    <span className="hidden xs:inline sm:inline">
                      {dbSyncStatus === 'synced' ? `八訂 ${foodMaster.length}品目` : dbSyncStatus === 'syncing' ? '同期中...' : `内蔵 ${foodMaster.length}品目`}
                    </span>
                    <span className="inline xs:hidden sm:hidden">
                      {foodMaster.length}
                    </span>
                  </span>
                </div>
              </div>

              {/* PCナビゲーション */}
              <nav className="hidden md:flex items-center gap-1 lg:gap-2">
                {navItems.map((item) => {
                  const Icon = item.icon;
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`px-3 lg:px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 relative ${
                        isActive ? 'bg-emerald-50 text-emerald-700 border border-emerald-200 shadow-sm' : 'text-slate-600 hover:bg-slate-100'
                      }`}
                    >
                      <Icon size={16} />
                      <span>{item.label}</span>
                      {item.badgeCount > 0 && (
                        <span className="px-1.5 py-0.2 rounded-full bg-emerald-600 text-white text-[10px] font-black">
                          {item.badgeCount}
                        </span>
                      )}
                    </button>
                  );
                })}
              </nav>

              {/* 右側：更新ボタン ＆ 設定ボタン */}
              <div className="flex items-center gap-1.5 sm:gap-2 shrink-0">
                <button
                  onClick={() => syncDatabase(true)}
                  disabled={isManualSyncing}
                  className="p-2 sm:px-2.5 sm:py-1.5 rounded-xl bg-white hover:bg-emerald-50 text-slate-700 border border-slate-200 shadow-sm flex items-center gap-1.5 transition-all active:scale-95 shrink-0"
                  title="食品データを最新に再同期"
                  aria-label="データ再同期"
                >
                  <RotateCcw size={14} className={`text-emerald-600 ${isManualSyncing ? 'animate-spin' : ''}`} />
                  <span className="text-xs font-bold hidden sm:inline">更新</span>
                </button>

                <button
                  onClick={() => setIsSettingsOpen(true)}
                  className="px-2 sm:px-2.5 py-1.5 rounded-xl bg-white hover:bg-emerald-50 text-xs font-semibold text-slate-700 border border-slate-200 transition-all flex items-center gap-1 sm:gap-1.5 shadow-sm shrink-0"
                >
                  <Settings size={14} className="text-emerald-600 shrink-0" />
                  <span className="font-bold text-[11px] sm:text-xs">{userGender === 'male' ? '男性' : '女性'} {userAgeGroup}</span>
                </button>
              </div>
            </div>
          </header>

          {/* メインコンテンツ */}
          <main className="flex-1 w-full max-w-7xl mx-auto p-3.5 sm:p-6 lg:p-8 pb-32 md:pb-16 box-border">
            {activeTab === 'home' && (
              <HomeScreen
                foods={foodMaster}
                totalCount={foodMaster.length}
                onSelectFood={handleSelectFood}
              />
            )}
            {activeTab === 'detail' && (
              <DetailScreen
                food={foodMaster.find(f => f.id === selectedFoodId) || foodMaster[0]}
                currentGrams={detailGrams}
                onChangeGrams={setDetailGrams}
                activeUnit={activePortionUnit}
                onChangeUnit={setActivePortionUnit}
                isPurchasedWeight={isPurchasedWeight}
                onChangePurchasedWeight={setIsPurchasedWeight}
                currentDri={currentDri}
                isFavorite={favorites.includes(selectedFoodId)}
                onToggleFavorite={() => {
                  setFavorites(prev => prev.includes(selectedFoodId) ? prev.filter(id => id !== selectedFoodId) : [...prev, selectedFoodId]);
                  showToast(favorites.includes(selectedFoodId) ? 'お気に入りを解除' : 'お気に入りに追加');
                }}
                onBack={() => setActiveTab('home')}
                onAddToRecipe={handleAddToRecipe}
                onAddToCompare={(id) => {
                  setCompareFoodB({ id, grams: 12, isPurchased: false });
                  setActiveTab('compare');
                }}
                onCopySummary={(txt) => {
                  const el = document.createElement('textarea');
                  el.value = txt;
                  document.body.appendChild(el);
                  el.select();
                  document.execCommand('copy');
                  document.body.removeChild(el);
                  showToast('栄養サマリーをコピーしました！');
                }}
              />
            )}
            {activeTab === 'compare' && (
              <CompareScreen
                foodMaster={foodMaster}
                foodAConfig={compareFoodA}
                foodBConfig={compareFoodB}
                onChangeFoodA={setCompareFoodA}
                onChangeFoodB={setCompareFoodB}
              />
            )}
            {activeTab === 'recipe' && (
              <RecipeScreen
                foodMaster={foodMaster}
                title={recipeTitle}
                onChangeTitle={setRecipeTitle}
                servings={servings}
                onChangeServings={setServings}
                items={recipeItems}
                onChangeItems={setRecipeItems}
                onAddMore={() => setActiveTab('home')}
                onSelectFood={handleSelectFood}
              />
            )}
            {activeTab === 'favorites' && (
              <FavoritesScreen
                foodMaster={foodMaster}
                favoriteIds={favorites}
                historyIds={history}
                onSelectFood={handleSelectFood}

          </main>

          {/* モバイル用ボトムナビゲーション */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200/90 px-2 py-1.5 flex items-center justify-around shadow-lg pb-safe">
            {navItems.map((item) => {
              const Icon = item.icon;
              const isActive = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`flex flex-col items-center justify-center py-1 px-3 rounded-xl transition-all relative ${
                    isActive ? 'text-emerald-700 font-extrabold' : 'text-slate-500 hover:text-slate-800'
                  }`}
                >
                  <Icon size={20} className={isActive ? 'text-emerald-600 scale-110 transition-transform' : ''} />
                  <span className="text-[10px] mt-0.5">{item.label}</span>
                  {item.badgeCount > 0 && (
                    <span className="absolute top-0.5 right-2 min-w-[16px] h-4 px-1 bg-emerald-600 text-white rounded-full text-[9px] flex items-center justify-center font-black shadow">
                      {item.badgeCount}
                    </span>
                  )}
                </button>
              );
            })}
          </nav>

          {/* トースト表示 */}
          {toastData && (
            <div className="fixed bottom-20 md:bottom-8 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 text-white px-4 py-2.5 rounded-2xl shadow-2xl flex items-center gap-3 text-xs font-bold backdrop-blur-md max-w-[92%] sm:max-w-md border border-slate-700">
              <Check size={16} className="text-emerald-400 shrink-0" />
              <span className="truncate flex-1">{toastData.msg}</span>
              {toastData.actionLabel && (
                <button
                  onClick={() => {
                    if (toastData.onAction) toastData.onAction();
                    setToastData(null);
                  }}
                  className="px-2.5 py-1 bg-emerald-500 hover:bg-emerald-400 text-white rounded-lg font-black shrink-0 shadow-sm transition-all text-[11px]"
                >
                  {toastData.actionLabel}
                </button>
              )}
            </div>
          )}

          {/* 設定モーダル */}
          {isSettingsOpen && (
            <SettingsModal
              userGender={userGender}
              onChangeGender={setUserGender}
              userAgeGroup={userAgeGroup}
              onChangeAgeGroup={setUserAgeGroup}
              onClose={() => setIsSettingsOpen(false)}
            />
          )}
        </div>
      );
    }

    // --- 検索画面（漢字・ひらがな・カタカナ・スペース区切りアンド検索に完全対応） ---
    function HomeScreen({ foods, totalCount, onSelectFood }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');

      const filteredFoods = useMemo(() => {
        const queryGroups = expandSearchTerms(searchQuery);
        const hasQuery = queryGroups.length > 0;

        if (!hasQuery && selectedCategory === 'all') return foods.slice(0, 48);

        return foods.filter((f) => {
          // カテゴリ判定
          const matchCat = selectedCategory === 'all' || f.categoryCode === selectedCategory;
          if (!matchCat) return false;

          // 検索語判定（複数単語がある場合は全単語を満たすAND検索）
          if (!hasQuery) return true;

          const foodTargetString = normalizeSearch(
            `${f.name || ''} ${f.displayName || ''} ${f.shortName || ''} ${f.kana || ''} ${f.foodCode || ''}`
          );

          // すべての単語群（subQuery）について、その同義語のいずれかが含まれているか検証
          return queryGroups.every((synonymVariants) => {
            return synonymVariants.some((variant) => foodTargetString.includes(variant));
          });
        }).slice(0, 96);
      }, [foods, searchQuery, selectedCategory]);

      return (
        <div className="space-y-4 w-full">
          {/* 検索入力 */}
          <div className="bg-white p-4 sm:p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3">
            <div className="flex items-center justify-between px-1 text-xs text-slate-500 font-bold">
              <span>登録食品数: <span className="text-emerald-700 font-extrabold">{totalCount}品目</span></span>
              <span className="text-[11px] text-slate-400">※漢字・ひらがな・カタカナ全対応</span>
            </div>

            <div className="relative">
              <div className="absolute inset-y-0 left-3.5 flex items-center pointer-events-none text-emerald-600">
                <Search size={19} />
              </div>
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="鶏もも肉, 豚バラ, 鮭, 玉ねぎ, 米油, もち麦 など"
                className="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-11 pr-10 py-3 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
              />
              {searchQuery && (
                <button onClick={() => setSearchQuery('')} className="absolute inset-y-0 right-3 flex items-center text-slate-400 font-bold">×</button>
              )}
            </div>

            {/* カテゴリ */}
            <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none">
              {[
                { id: 'all', name: 'すべて', emoji: '🍽️' },
                { id: '11', name: '肉類', emoji: '🍗' },
                { id: '10', name: '魚介類', emoji: '🐟' },
                { id: '06', name: '野菜類', emoji: '🥦' },
                { id: '14', name: '油脂類', emoji: '🫒' },

    function DetailScreen({

                <h1 className="text-lg sm:text-xl font-black text-slate-900 mt-1">{food.displayName}</h1>

            </div>

            {/* 分量スライダー & 生活単位 */}
            <div className="bg-slate-50 p-4 rounded-2xl space-y-3">
              <div className="flex justify-between items-center text-xs font-bold">
                <span>食べる分量: {currentGrams}g ({activeUnit})</span>
                {food.refuseRate > 0 && <span className="text-amber-700">廃棄率: {food.refuseRate}% (可食部: {n.edibleGrams}g)</span>}

            {/* PFCサマリー */}

              <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                <div className="text-[10px] text-slate-500 font-bold">エネルギー</div>
                <div className="text-lg font-black text-slate-900 mt-0.5">{n.energy} <span className="text-xs">kcal</span></div>

                <div className="text-lg font-black mt-0.5">{n.protein}g</div>
              </div>
              <div className="bg-amber-50 p-3 rounded-2xl text-amber-700 border border-amber-100">
                <div className="text-[10px] font-bold">脂質 ({n.fRatio}%)</div>

              </div>

            {/* レシピ追加アクション */}

                <Plus size={16} />

              </button>

            <button
              onClick={() => onCopySummary(summaryText)}
              className="w-full py-2.5 bg-slate-50 hover:bg-slate-100 text-slate-700 border rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5"
            >

          {/* 詳細栄養成分 */}
          <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3">
            <h3 className="text-sm font-extrabold text-slate-900 flex items-center gap-1.5">
              <Activity size={18} className="text-emerald-600" />

                <span className="text-slate-500 block">ビタミンE (α-トコフェロール)</span>

              </div>
              <div className="p-3 bg-slate-50 rounded-2xl border">
                <span className="text-slate-500 block">ビタミンK</span>
                <span className="text-base font-black text-slate-900">{n.vitaminK ?? '—'} <span className="text-xs">μg</span></span>
              </div>
              <div className="p-3 bg-slate-50 rounded-2xl border">
                <span className="text-slate-500 block">一価不飽和脂肪酸 (オレイン酸等)</span>
                <span className="text-base font-black text-slate-900">{n.monounsaturatedFat ?? '—'} <span className="text-xs">g</span></span>
              </div>
              <div className="p-3 bg-slate-50 rounded-2xl border">
                <span className="text-slate-500 block">多価不飽和脂肪酸 (リノール酸等)</span>

              </div>

                <span className="text-slate-500 block">飽和脂肪酸</span>
                <span className="text-base font-black text-slate-900">{n.saturatedFat ?? '—'} <span className="text-xs">g</span></span>
              </div>
              <div className="p-3 bg-slate-50 rounded-2xl border">
                <span className="text-slate-500 block">食塩相当量</span>

              </div>

      );
    }

    function CompareScreen({ foodMaster, foodAConfig, foodBConfig, onChangeFoodA, onChangeFoodB }) {
      const fA = foodMaster.find(f => f.id === foodAConfig.id) || foodMaster[0];
      const fB = foodMaster.find(f => f.id === foodBConfig.id) || foodMaster[1] || foodMaster[0];
      const nA = calculateScaledNutrients(fA, foodAConfig.grams);
      const nB = calculateScaledNutrients(fB, foodBConfig.grams);

      const handleSwap = () => {
        const temp = { ...foodAConfig };
        onChangeFoodA(foodBConfig);
        onChangeFoodB(temp);
      };

      return (
        <div className="max-w-3xl mx-auto space-y-4">
          <div className="flex items-center justify-between">
            <h2 className="text-base font-extrabold flex items-center gap-2"><Scale size={18} /> 食品くらべる (VS)</h2>
            <button onClick={handleSwap} className="px-3 py-1.5 bg-white border border-slate-200 text-xs font-bold rounded-xl flex items-center gap-1 shadow-sm">
              <RotateCcw size={14} />
              <span>左右スワップ</span>
            </button>
          </div>

          <div className="grid grid-cols-2 gap-3">
            {[ { f: fA, n: nA, cfg: foodAConfig, setCfg: onChangeFoodA }, { f: fB, n: nB, cfg: foodBConfig, setCfg: onChangeFoodB } ].map((slot, i) => (
              <div key={i} className="bg-white p-4 rounded-3xl border border-slate-200 text-center space-y-2 shadow-sm">
                <span className="text-3xl">{slot.f.categoryEmoji}</span>
                <select
                  value={slot.f.id}
                  onChange={(e) => slot.setCfg({ ...slot.cfg, id: e.target.value })}
                  className="w-full text-xs font-bold p-1 border rounded-lg"
                >
                  {foodMaster.slice(0, 100).map(food => <option key={food.id} value={food.id}>{food.shortName}</option>)}
                </select>
                <div className="text-xs text-slate-500 font-bold">{slot.cfg.grams}g</div>
                <div className="text-base font-black text-slate-900">{slot.n.energy} kcal</div>
              </div>
            ))}
          </div>

          <div className="bg-white p-4 rounded-3xl border border-slate-200 space-y-2 text-xs">
            <div className="flex justify-between border-b pb-1">
              <span>脂質</span>
              <span>{nA.fat}g vs {nB.fat}g</span>
            </div>
            <div className="flex justify-between border-b pb-1">
              <span>一価不飽和脂肪酸（オレイン酸等）</span>
              <span>{nA.monounsaturatedFat ?? '—'}g vs {nB.monounsaturatedFat ?? '—'}g</span>
            </div>
            <div className="flex justify-between border-b pb-1">
              <span>ビタミンE</span>
              <span>{nA.vitaminE ?? '—'}mg vs {nB.vitaminE ?? '—'}mg</span>
            </div>
            <div className="flex justify-between">
              <span>ビタミンK</span>
              <span>{nA.vitaminK ?? '—'}μg vs {nB.vitaminK ?? '—'}μg</span>
            </div>
          </div>
        </div>
      );
    }

    function RecipeScreen({ foodMaster, title, onChangeTitle, servings, onChangeServings, items, onChangeItems, onAddMore, onSelectFood }) {
      const handleGramChange = (idx, delta) => {
        onChangeItems(items.map((it, i) => {
          if (i === idx) {
            const nextG = Math.max(1, it.grams + delta);
            return { ...it, grams: nextG };
          }
          return it;
        }));
      };

      const handleRemove = (idx) => {
        onChangeItems(items.filter((_, i) => i !== idx));
      };

      const totals = useMemo(() => {
        let energy = 0, protein = 0, fat = 0, carb = 0, sugar = 0, fiber = 0, salt = 0;
        items.forEach(item => {
          const f = foodMaster.find(x => x.id === item.foodId);
          if (f) {
            const sc = calculateScaledNutrients(f, item.grams, item.isPurchased);
            energy += sc.energy;
            protein += sc.protein;
            fat += sc.fat;
            carb += sc.carb;
            sugar += sc.sugar;
            fiber += sc.fiber;
            salt += sc.salt;
          }
        });

        const s = Math.max(1, Number(servings) || 1);
        const perServing = {
          energy: Math.round(energy / s),
          protein: +(protein / s).toFixed(1),
          fat: +(fat / s).toFixed(1),
          carb: +(carb / s).toFixed(1),
          sugar: +(sugar / s).toFixed(1),
          fiber: +(fiber / s).toFixed(1),
          salt: +(salt / s).toFixed(2)
        };

        const pKcal = perServing.protein * 4;
        const fKcal = perServing.fat * 9;
        const cKcal = perServing.carb * 4;
        const totalPfc = pKcal + fKcal + cKcal;
        let pRatio = 0, fRatio = 0, cRatio = 0;
        if (totalPfc > 0) {
          pRatio = Math.round((pKcal / totalPfc) * 100);
          fRatio = Math.round((fKcal / totalPfc) * 100);
          cRatio = Math.max(0, 100 - (pRatio + fRatio));
        }

        return {
          totalEnergy: Math.round(energy),
          perServing,
          pRatio, fRatio, cRatio
        };
      }, [foodMaster, items, servings]);

      const recipeSummaryText = `【NutriDex レシピ計算】\n料理名: ${title}\n登録食材: ${items.length}品\n出来上がり: ${servings}人前\n1人前あたり: ${totals.perServing.energy} kcal\nPFC: P ${totals.perServing.protein}g (${totals.pRatio}%) / F ${totals.perServing.fat}g (${totals.fRatio}%) / C ${totals.perServing.carb}g (${totals.cRatio}%)\n糖質: ${totals.perServing.sugar}g / 食物繊維: ${totals.perServing.fiber}g / 食塩: ${totals.perServing.salt}g`;

      const copyToClipboard = () => {
        const el = document.createElement('textarea');
        el.value = recipeSummaryText;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        alert('レシピ栄養サマリーをコピーしました！');
      };

      return (
        <div className="max-w-3xl mx-auto space-y-4">
          <div className="bg-white p-4 sm:p-5 rounded-3xl border border-slate-200 space-y-3 shadow-sm">
            <div className="flex items-center justify-between flex-wrap gap-2">
              <div className="flex items-center gap-2">
                <Calculator size={18} className="text-emerald-600 shrink-0" />
                <span className="font-extrabold text-slate-800 text-sm">マイレシピ・合算栄養計算</span>
              </div>
              <div className="flex items-center gap-2 text-xs">
                <span className="text-slate-500 font-bold">出来上がり:</span>
                <select
                  value={servings}
                  onChange={(e) => onChangeServings(Number(e.target.value))}
                  className="bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1 text-slate-800 font-bold focus:outline-none"
                >
                  {[1, 2, 3, 4, 5, 6].map(num => <option key={num} value={num}>{num} 人前</option>)}
                </select>
              </div>
            </div>

            <input
              type="text"
              value={title}
              onChange={(e) => onChangeTitle(e.target.value)}
              placeholder="料理名を入力（例: 鶏もも肉と野菜の炒め物）"
              className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3.5 py-2.5 text-xs sm:text-sm font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
            />
          </div>

          <div className="space-y-2.5">
            <div className="flex items-center justify-between px-1 text-xs font-bold text-slate-500">
              <span>登録食材（{items.length}品）</span>
              <button
                onClick={onAddMore}
                className="flex items-center gap-1 text-emerald-700 hover:text-emerald-800 font-bold"
              >
                <Plus size={15} />
                <span>食材を検索して追加</span>
              </button>
            </div>

            {items.length === 0 ? (
              <div className="bg-white p-8 rounded-3xl border border-dashed border-slate-300 text-center space-y-3 shadow-sm">
                <div className="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto text-xl">
                  🛒
                </div>
                <div className="space-y-1">
                  <h4 className="text-xs sm:text-sm font-extrabold text-slate-800">レシピに食材が入っていません</h4>
                  <p className="text-[11px] text-slate-400">
                    「さがす」画面や食材詳細画面の <span className="font-bold text-emerald-700">「レシピに追加」</span> ボタンを押すと、ここに食材が追加されて合計栄養が自動計算されます。
                  </p>
                </div>
                <button
                  onClick={onAddMore}
                  className="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold shadow-sm inline-flex items-center gap-1.5"
                >
                  <Search size={14} />
                  <span>食材を探しにいく</span>
                </button>
              </div>
            ) : (
              items.map((item, idx) => {
                const f = foodMaster.find(x => x.id === item.foodId);
                if (!f) return null;
                const sc = calculateScaledNutrients(f, item.grams, item.isPurchased);

                return (
                  <div key={idx} className="bg-white p-3.5 sm:p-4 rounded-3xl border border-slate-200 flex items-center justify-between gap-3 shadow-sm">
                    <div
                      className="flex items-center gap-3 min-w-0 flex-1 cursor-pointer"
                      onClick={() => onSelectFood(f.id)}
                      title="タップして詳細を確認"
                    >
                      <span className="text-2xl sm:text-3xl shrink-0">{f.categoryEmoji}</span>
                      <div className="min-w-0 flex-1">
                        <h4 className="text-xs sm:text-sm font-bold text-slate-800 truncate hover:text-emerald-700">{f.shortName}</h4>
                        <p className="text-[11px] text-slate-500 mt-0.5 truncate">
                          {item.grams}g • <span className="text-slate-900 font-black">{sc.energy} kcal</span> (P:{sc.protein}g F:{sc.fat}g C:{sc.carb}g)
                        </p>
                      </div>
                    </div>

                    <div className="flex items-center gap-1 sm:gap-2 shrink-0">
                      <div className="flex items-center bg-slate-50 rounded-xl border border-slate-200 p-0.5">
                        <button
                          onClick={() => handleGramChange(idx, -10)}
                          className="w-7 h-7 flex items-center justify-center text-slate-600 hover:bg-slate-200 rounded-lg"
                          title="10g減らす"
                        >
                          <Minus size={13} />
                        </button>
                        <span className="px-2 text-xs font-bold text-slate-900 min-w-[2.5rem] text-center">
                          {item.grams}g
                        </span>
                        <button
                          onClick={() => handleGramChange(idx, 10)}
                          className="w-7 h-7 flex items-center justify-center text-slate-600 hover:bg-slate-200 rounded-lg"
                          title="10g増やす"
                        >
                          <Plus size={13} />
                        </button>
                      </div>

                      <button
                        onClick={() => handleRemove(idx)}
                        className="p-1.5 text-slate-400 hover:text-rose-500 rounded-xl"
                        title="削除"
                      >
                        <Trash2 size={16} />
                      </button>
                    </div>
                  </div>
                );
              })
            )}
          </div>

          {items.length > 0 && (
            <div className="bg-gradient-to-br from-emerald-50 via-teal-50/40 to-white p-4 sm:p-5 rounded-3xl border border-emerald-200 space-y-4 shadow-sm">
              <div className="flex items-baseline justify-between border-b border-emerald-100 pb-3 flex-wrap gap-2">
                <div>
                  <span className="text-xs font-bold text-emerald-800">
                    1人前あたり ({servings}人前換算 / 料理全体 {totals.totalEnergy} kcal)
                  </span>
                  <div className="flex items-baseline gap-1.5 mt-0.5">
                    <span className="text-3xl sm:text-4xl font-black text-slate-900">{totals.perServing.energy}</span>
                    <span className="text-sm font-bold text-emerald-700">kcal</span>
                  </div>
                </div>

                <div className="text-right text-xs text-slate-600 space-y-0.5">
                  <div>糖質: <span className="font-bold text-slate-800">{totals.perServing.sugar}g</span></div>
                  <div>食物繊維: <span className="font-bold text-emerald-700">{totals.perServing.fiber}g</span></div>
                  <div>食塩: <span className="font-bold text-slate-800">{totals.perServing.salt}g</span></div>
                </div>
              </div>

              <div className="space-y-1.5">
                <div className="flex justify-between text-[11px] font-bold text-slate-600">
                  <span>PFC比率</span>
                  <span>P:{totals.pRatio}% / F:{totals.fRatio}% / C:{totals.cRatio}%</span>
                </div>
                <div className="h-3.5 w-full bg-slate-100 rounded-full overflow-hidden flex shadow-inner">
                  <div style={{ width: `${totals.pRatio}%` }} className="bg-rose-500" />
                  <div style={{ width: `${totals.fRatio}%` }} className="bg-amber-400" />
                  <div style={{ width: `${totals.cRatio}%` }} className="bg-sky-400" />
                </div>
              </div>

              <div className="grid grid-cols-3 gap-2 text-center text-xs">
                <div className="bg-white/80 border border-rose-200 rounded-2xl p-2 min-w-0">
                  <div className="text-[10px] text-rose-600 font-bold">タンパク質</div>
                  <div className="font-black text-slate-900 text-sm">{totals.perServing.protein}g</div>
                </div>
                <div className="bg-white/80 border border-amber-200 rounded-2xl p-2 min-w-0">
                  <div className="text-[10px] text-amber-600 font-bold">脂質</div>
                  <div className="font-black text-slate-900 text-sm">{totals.perServing.fat}g</div>
                </div>
                <div className="bg-white/80 border border-sky-200 rounded-2xl p-2 min-w-0">
                  <div className="text-[10px] text-sky-600 font-bold">炭水化物</div>
                  <div className="font-black text-slate-900 text-sm">{totals.perServing.carb}g</div>
                </div>
              </div>

              <button
                onClick={copyToClipboard}
                className="w-full py-2.5 sm:py-3 bg-white hover:bg-emerald-50 text-emerald-800 text-xs font-bold rounded-2xl flex items-center justify-center gap-2 border border-emerald-200 shadow-sm transition-colors"
              >
                <Copy size={15} />
                <span>レシピ栄養サマリーをコピー</span>
              </button>
            </div>
          )}
        </div>
      );
    }

    function FavoritesScreen({ foodMaster, favoriteIds, onSelectFood }) {
      const favs = useMemo(() => favoriteIds.map(id => foodMaster.find(f => f.id === id)).filter(Boolean), [foodMaster, favoriteIds]);
      return (
        <div className="max-w-2xl mx-auto space-y-3">
          <h2 className="text-base font-extrabold flex items-center gap-2"><Bookmark size={18} /> お気に入り食品 ({favs.length})</h2>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {favs.map(f => (
              <div key={f.id} onClick={() => onSelectFood(f.id)} className="bg-white p-4 rounded-2xl border flex items-center justify-between cursor-pointer shadow-sm">
                <div className="flex items-center gap-2">
                  <span className="text-2xl">{f.categoryEmoji}</span>
                  <span className="text-xs font-bold">{f.displayName}</span>
                </div>
                <ChevronRight size={16} className="text-slate-400" />
              </div>
            ))}
          </div>
        </div>
      );
    }

    function SettingsModal({ userGender, onChangeGender, userAgeGroup, onChangeAgeGroup, onClose }) {
      return (
        <div className="fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4">
          <div className="bg-white border w-full max-w-md rounded-3xl p-5 space-y-4 shadow-2xl">
            <div className="flex justify-between items-center border-b pb-3">
              <h3 className="text-sm font-bold flex items-center gap-2"><Settings size={16} /> 各種設定</h3>
              <button onClick={onClose} className="text-slate-400 font-bold">✕</button>
            </div>
            <div className="space-y-1">
              <label className="text-xs font-semibold text-slate-700">性別</label>
              <div className="flex gap-2">
                <button onClick={() => onChangeGender('male')} className={`flex-1 py-1.5 text-xs font-bold rounded-lg border ${userGender === 'male' ? 'bg-emerald-600 text-white' : 'bg-slate-50'}`}>男性</button>
                <button onClick={() => onChangeGender('female')} className={`flex-1 py-1.5 text-xs font-bold rounded-lg border ${userGender === 'female' ? 'bg-emerald-600 text-white' : 'bg-slate-50'}`}>女性</button>
              </div>
            </div>
            <div className="space-y-1">
              <label className="text-xs font-semibold text-slate-700">年齢区分</label>
              <div className="grid grid-cols-3 gap-2">
                {['18-29', '30-49', '50-64'].map(age => (
                  <button
                    key={age}
                    onClick={() => onChangeAgeGroup(age)}
                    className={`py-1.5 text-xs font-bold rounded-lg border ${userAgeGroup === age ? 'bg-emerald-600 text-white' : 'bg-slate-50'}`}
                  >
                    {age}
                  </button>
                ))}
              </div>
            </div>
            <button onClick={onClose} className="w-full py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold">保存して閉じる</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
