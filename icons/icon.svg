<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景グラデーション: 深みのあるエメラルドからティールへ -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="40%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>

    <!-- 炎の内側グラデーション -->
    <linearGradient id="flameInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- 微細なグローシャドウ -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064E3B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 角丸スクワークル背景 (iOS アプリアイコン仕様) -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- アイコンシンボル (炎 & 科学的生命力) -->
  <g filter="url(#shadow)" transform="translate(106, 86) scale(12.5)">
    <!-- 炎メインパス -->
    <path fill="url(#flameInner)" stroke="#FFFFFF" stroke-width="0.3" stroke-linecap="round" stroke-linejoin="round" d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
    <!-- コアエネルギーのきらめき -->
    <path fill="#059669" opacity="0.85" d="M12 12c.5 1.5.5 3-1 4.5 2.5 0 3-2 2.5-3-.5-1-1.5-1.5-1.5-1.5z"/>
  </g>
</svg>
