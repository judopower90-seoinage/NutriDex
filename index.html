    // グラム数および廃棄率に応じた全栄養素の換算計算
    function calculateScaledNutrients(food, grams, isPurchasedWeight = false) {
      if (!food) return null;

      const rawGrams = Math.max(0, Number(grams) || 0);
      const refuseRate = Number(food.refuseRate) || 0;
      const edibleGrams = isPurchasedWeight ? rawGrams * (1 - refuseRate / 100) : rawGrams;
      const ratio = edibleGrams / 100;

      const scaleNum = (val, decimals = 1) => {
        if (val === null || val === undefined) return null;
        return +(Number(val) * ratio).toFixed(decimals);
      };
      const scaleInt = (val) => {
        if (val === null || val === undefined) return null;
        return Math.round(Number(val) * ratio);
      };

      const energy = Math.round((food.energy ?? 0) * ratio);
      const energyKj = Math.round((food.energyKj ?? (food.energy ?? 0) * 4.184) * ratio);
      const water = scaleNum(food.water, 1);
      const protein = +( (food.protein ?? 0) * ratio ).toFixed(1);
      const proteinAmino = scaleNum(food.proteinAmino, 1);
      const fat = +( (food.fat ?? 0) * ratio ).toFixed(1);
      const carb = +( (food.carb ?? 0) * ratio ).toFixed(1);
      const fiber = +( (food.fiber ?? 0) * ratio ).toFixed(1);
      const fiberSoluble = scaleNum(food.fiberSoluble, 1);
      const fiberInsoluble = scaleNum(food.fiberInsoluble, 1);
      const sugar = +( (food.sugar ?? Math.max(0, (food.carb ?? 0) - (food.fiber ?? 0))) * ratio ).toFixed(1);
      const availableCarb = scaleNum(food.availableCarb, 1);
      const salt = +( (food.salt ?? 0) * ratio ).toFixed(2);
      const ash = scaleNum(food.ash, 1);

      // ミネラル 13種
      const sodium = scaleInt(food.sodium);
      const potassium = scaleInt(food.potassium);
      const calcium = scaleInt(food.calcium);
      const magnesium = scaleInt(food.magnesium);
      const phosphorus = scaleInt(food.phosphorus);
      const iron = scaleNum(food.iron, 2);
      const zinc = scaleNum(food.zinc, 2);
      const copper = scaleNum(food.copper, 2);
      const manganese = scaleNum(food.manganese, 2);
      const iodine = scaleNum(food.iodine, 1);
      const selenium = scaleNum(food.selenium, 1);
      const chromium = scaleNum(food.chromium, 1);
      const molybdenum = scaleNum(food.molybdenum, 1);

      // ビタミン 13種 + 詳細
      const vitaminA = scaleInt(food.vitaminA);
      const retinol = scaleInt(food.retinol);
      const betaCarotene = scaleInt(food.betaCarotene);
      const vitaminD = scaleNum(food.vitaminD, 1);
      const vitaminE = scaleNum(food.vitaminE, 1);
      const vitaminK = scaleInt(food.vitaminK);
      const vitaminB1 = scaleNum(food.vitaminB1, 2);
      const vitaminB2 = scaleNum(food.vitaminB2, 2);
      const niacin = scaleNum(food.niacin, 1);
      const vitaminB6 = scaleNum(food.vitaminB6, 2);
      const vitaminB12 = scaleNum(food.vitaminB12, 1);
      const folate = scaleInt(food.folate);
      const pantothenicAcid = scaleNum(food.pantothenicAcid, 2);
      const biotin = scaleNum(food.biotin, 1);
      const vitaminC = scaleNum(food.vitaminC, 1);

      // 脂質詳細
      const saturatedFat = scaleNum(food.saturatedFat, 2);
      const monounsaturatedFat = scaleNum(food.monounsaturatedFat, 2);
      const polyunsaturatedFat = scaleNum(food.polyunsaturatedFat, 2);
      const n3Fat = scaleNum(food.n3Fat, 2);
      const n6Fat = scaleNum(food.n6Fat, 2);
      const cholesterol = scaleInt(food.cholesterol);

      // アミノ酸組成（mg）
      const isoleucine = scaleInt(food.isoleucine);
      const leucine = scaleInt(food.leucine);
      const valine = scaleInt(food.valine);
      const bcaaTotal = (isoleucine !== null && leucine !== null && valine !== null)
        ? +((isoleucine + leucine + valine) / 1000).toFixed(2)
        : null;
      const lysine = scaleInt(food.lysine);
      const methionine = scaleInt(food.methionine);
      const phenylalanine = scaleInt(food.phenylalanine);
      const threonine = scaleInt(food.threonine);
      const tryptophan = scaleInt(food.tryptophan);
      const histidine = scaleInt(food.histidine);
      const arginine = scaleInt(food.arginine);
      const alanine = scaleInt(food.alanine);
      const glutamicAcid = scaleInt(food.glutamicAcid);
      const asparticAcid = scaleInt(food.asparticAcid);

      // PFCエネルギー比率
      const pKcal = protein * 4;
      const fKcal = fat * 9;

      for (const model of ACTIVE_GEMINI_MODELS) {

        try {

          const res = await fetch(url, {

          // 試行2: x-goog-api-key ヘッダー方式
          const resHeader = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": key
            },
            body: JSON.stringify(payload)
          });
          if (resHeader.ok) return { success: true, model };

          // エラー詳細の抽出
          let errDetail = `HTTP ${res.status}`;
          try {
            const errJson = await res.json();

          } catch (_) {}

          });
          if (fallbackRes.ok) {
            successResponse = fallbackRes;
            break;
          }

          try {
            const errJson = await res.json();
            if (errJson?.error?.message) lastErrMsg = errJson.error.message;
          } catch (_) {}
        } catch (netErr) {
          lastErrMsg = netErr.message;
        }
      }

      if (!successResponse) {
        throw new Error(lastErrMsg || "Google APIとの通信に失敗しました。キーをご確認ください");
      }

      const data = await successResponse.json();
      const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!rawText) throw new Error("Google APIからの返答が空でした");

      let cleaned = rawText.trim();
      if (cleaned.startsWith("```json")) {
        cleaned = cleaned.replace(/^```json\s*/, "").replace(/\s*```$/, "");
      } else if (cleaned.startsWith("```")) {
        cleaned = cleaned.replace(/^```\s*/, "").replace(/\s*```$/, "");
      }

      let parsed;
      try {
        parsed = JSON.parse(cleaned);
      } catch (parseErr) {
        throw new Error("データのJSON解析に失敗しました。再試行してください");
      }

      const generatedId = `food_ai_${Date.now().toString(36)}`;
      return {
        id: generatedId,
        foodCode: parsed.foodCode ?? "AI-EST",
        source: 'ai_estimate',
        name: parsed.displayName || foodQuery,
        displayName: parsed.displayName || foodQuery,
        shortName: parsed.shortName ?? parsed.displayName ?? foodQuery,
        kana: parsed.kana ?? parsed.displayName ?? foodQuery,
        categoryCode: parsed.categoryCode ?? "06",
        categoryName: parsed.categoryName ?? "一般食品",
        categoryEmoji: parsed.categoryEmoji ?? "🥗",
        description: parsed.description ?? "文部科学省八訂成分表基準に基づく推計値です。",
        refuseRate: parsed.refuseRate ?? 0.0,
        energy: Number(parsed.energy) || 0,
        energyKj: Math.round((Number(parsed.energy) || 0) * 4.184),
        water: parsed.water !== undefined ? parsed.water : null,
        protein: Number(parsed.protein) || 0.0,
        fat: Number(parsed.fat) || 0.0,
        carb: Number(parsed.carb) || 0.0,
        sugar: parsed.sugar !== undefined ? Number(parsed.sugar) : Math.max(0, (Number(parsed.carb) || 0) - (Number(parsed.fiber) || 0)),
        fiber: Number(parsed.fiber) || 0.0,
        fiberSoluble: parsed.fiberSoluble !== undefined ? parsed.fiberSoluble : null,
        fiberInsoluble: parsed.fiberInsoluble !== undefined ? parsed.fiberInsoluble : null,
        salt: Number(parsed.salt) || 0.0,
        sodium: parsed.sodium !== undefined ? parsed.sodium : null,
        potassium: parsed.potassium !== undefined ? parsed.potassium : null,
        calcium: parsed.calcium !== undefined ? parsed.calcium : null,
        magnesium: parsed.magnesium !== undefined ? parsed.magnesium : null,
        phosphorus: parsed.phosphorus !== undefined ? parsed.phosphorus : null,
        iron: parsed.iron !== undefined ? parsed.iron : null,
        zinc: parsed.zinc !== undefined ? parsed.zinc : null,
        copper: parsed.copper !== undefined ? parsed.copper : null,
        manganese: parsed.manganese !== undefined ? parsed.manganese : null,
        iodine: parsed.iodine !== undefined ? parsed.iodine : null,
        selenium: parsed.selenium !== undefined ? parsed.selenium : null,
        chromium: parsed.chromium !== undefined ? parsed.chromium : null,
        molybdenum: parsed.molybdenum !== undefined ? parsed.molybdenum : null,
        vitaminA: parsed.vitaminA !== undefined ? parsed.vitaminA : null,
        vitaminD: parsed.vitaminD !== undefined ? parsed.vitaminD : null,
        vitaminE: parsed.vitaminE !== undefined ? parsed.vitaminE : null,
        vitaminK: parsed.vitaminK !== undefined ? parsed.vitaminK : null,
        vitaminB1: parsed.vitaminB1 !== undefined ? parsed.vitaminB1 : null,
        vitaminB2: parsed.vitaminB2 !== undefined ? parsed.vitaminB2 : null,
        niacin: parsed.niacin !== undefined ? parsed.niacin : null,
        vitaminB6: parsed.vitaminB6 !== undefined ? parsed.vitaminB6 : null,
        vitaminB12: parsed.vitaminB12 !== undefined ? parsed.vitaminB12 : null,
        folate: parsed.folate !== undefined ? parsed.folate : null,
        pantothenicAcid: parsed.pantothenicAcid !== undefined ? parsed.pantothenicAcid : null,
        biotin: parsed.biotin !== undefined ? parsed.biotin : null,
        vitaminC: parsed.vitaminC !== undefined ? parsed.vitaminC : null,
        saturatedFat: parsed.saturatedFat !== undefined ? parsed.saturatedFat : null,
        monounsaturatedFat: parsed.monounsaturatedFat !== undefined ? parsed.monounsaturatedFat : null,
        polyunsaturatedFat: parsed.polyunsaturatedFat !== undefined ? parsed.polyunsaturatedFat : null,
        n3Fat: parsed.n3Fat !== undefined ? parsed.n3Fat : null,
        n6Fat: parsed.n6Fat !== undefined ? parsed.n6Fat : null,
        cholesterol: parsed.cholesterol !== undefined ? parsed.cholesterol : null,
        isoleucine: parsed.isoleucine !== undefined ? parsed.isoleucine : null,
        leucine: parsed.leucine !== undefined ? parsed.leucine : null,
        valine: parsed.valine !== undefined ? parsed.valine : null,
        lysine: parsed.lysine !== undefined ? parsed.lysine : null,
        methionine: parsed.methionine !== undefined ? parsed.methionine : null,
        phenylalanine: parsed.phenylalanine !== undefined ? parsed.phenylalanine : null,
        threonine: parsed.threonine !== undefined ? parsed.threonine : null,
        tryptophan: parsed.tryptophan !== undefined ? parsed.tryptophan : null,
        histidine: parsed.histidine !== undefined ? parsed.histidine : null,
        aminoAcidScore: parsed.aminoAcidScore ?? null,
        giIndex: parsed.giIndex ?? null,
        portionUnits: Array.isArray(parsed.portionUnits) && parsed.portionUnits.length > 0
          ? parsed.portionUnits.map(u => ({ ...u, isPurchasedWeight: !!u.isPurchasedWeight }))
          : [{ name: "100g", grams: 100, isPurchasedWeight: false, isDefault: true }]
      };
    }

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [selectedFoodId, setSelectedFoodId] = useState('food_06297');
      const [foodMaster, setFoodMaster] = useState(COMPREHENSIVE_FOOD_MASTER);
      const [isFetchingMext, setIsFetchingMext] = useState(false);
      const [isImportModalOpen, setIsImportModalOpen] = useState(false);

      const [userGender, setUserGender] = useState('male');
      const [userAgeGroup, setUserAgeGroup] = useState('30-49');
      const [userApiKey, setUserApiKey] = useState(() => localStorage.getItem('nutridex_gemini_api_key') || '');
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);

      const [detailGrams, setDetailGrams] = useState(200);
      const [activePortionUnit, setActivePortionUnit] = useState('市販1袋 (200g)');
      const [isPurchasedWeight, setIsPurchasedWeight] = useState(false);

      const [favorites, setFavorites] = useState(['food_06297', 'food_01088', 'food_11075']);
      const [history, setHistory] = useState(['food_06297', 'food_01088', 'food_04032']);

      const [compareFoodA, setCompareFoodA] = useState({ id: 'food_06297', grams: 200, isPurchased: false });
      const [compareFoodB, setCompareFoodB] = useState({ id: 'food_06299', grams: 200, isPurchased: false });

      const [recipeTitle, setRecipeTitle] = useState('豚バラとシャキシャキもやしのヘルシー蒸し');
      const [servings, setServings] = useState(1);
      const [recipeItems, setRecipeItems] = useState([
        { foodId: 'food_06297', grams: 200, isPurchased: false, unitName: 'もやし1袋 (200g)' },
        { foodId: 'food_11145', grams: 100, isPurchased: false, unitName: '豚バラ100g' }
      ]);

      const [toastMessage, setToastMessage] = useState(null);
      const toastTimeoutRef = useRef(null);
      const [isBarcodeScannerOpen, setIsBarcodeScannerOpen] = useState(false);

      useEffect(() => {
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      }, [activeTab]);

      const showToast = (msg) => {
        if (toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current);
        setToastMessage(msg);
        toastTimeoutRef.current = setTimeout(() => {
          setToastMessage(null);
          toastTimeoutRef.current = null;
        }, 4500);
      };

      const handleSelectFood = (foodId, directFood = null) => {
        const food = directFood ?? foodMaster.find((f) => f.id === foodId);
        if (!food) return;

        setSelectedFoodId(food.id);
        const defaultUnit = food.portionUnits?.find((u) => u.isDefault) ?? food.portionUnits?.[0] ?? { name: '100g', grams: 100, isPurchasedWeight: false };
        setDetailGrams(defaultUnit.grams);
        setActivePortionUnit(defaultUnit.name);
        setIsPurchasedWeight(!!defaultUnit.isPurchasedWeight);

        setHistory((prev) => [food.id, ...prev.filter((id) => id !== food.id)].slice(0, 20));
        setActiveTab('detail');
      };

      // 文科省八訂外部照会ハンドラー
      const handleQueryMextDatabase = async (keyword) => {
        if (!keyword || !keyword.trim()) return;
        const trimmed = keyword.trim();
        setIsFetchingMext(true);
        showToast(`「${trimmed}」を文科省八訂基準で照会中...`);

        try {
          const fetchedFood = await fetchMextFoodFromApi(trimmed, userApiKey);
          if (fetchedFood) {
            setFoodMaster((prev) => [fetchedFood, ...prev.filter(f => f.displayName !== fetchedFood.displayName)]);
            showToast(`「${fetchedFood.displayName}」の栄養データを取得しました！`);
            handleSelectFood(fetchedFood.id, fetchedFood);
          }
        } catch (err) {
          if (err.message === "NO_API_KEY") {
            setIsSettingsOpen(true);
            showToast("右上の設定からGemini APIキーを設定してください");
          } else {
            console.error("MEXT Query Error:", err);
            showToast(err.message || "照会に失敗しました。キーを確認してください");
          }
        } finally {
          setIsFetchingMext(false);
        }
      };

      // JSON一括インポートハンドラー
      const handleImportJsonData = (rawList) => {
        if (!Array.isArray(rawList)) return;
        const validated = [];
        rawList.forEach((item, index) => {
          if (item && typeof item === 'object' && item.displayName && item.energy !== undefined) {
            validated.push({
              id: item.id ?? `imported_${Date.now()}_${index}`,
              foodCode: item.foodCode ?? `IMP${index}`,
              source: item.source ?? 'user_import',
              name: item.name ?? item.displayName,
              displayName: item.displayName,
              shortName: item.shortName ?? item.displayName,
              kana: item.kana ?? item.displayName,
              categoryCode: item.categoryCode ?? '06',
              categoryName: item.categoryName ?? 'インポート品',
              categoryEmoji: item.categoryEmoji ?? '📦',
              description: item.description ?? '外部インポート公的データ',
              refuseRate: Number(item.refuseRate) || 0,
              energy: Number(item.energy) || 0,
              energyKj: Number(item.energyKj) || Math.round((Number(item.energy) || 0) * 4.184),
              protein: Number(item.protein) || 0,
              fat: Number(item.fat) || 0,
              carb: Number(item.carb) || 0,
              sugar: item.sugar !== undefined ? Number(item.sugar) : Math.max(0, (Number(item.carb) || 0) - (Number(item.fiber) || 0)),
              fiber: Number(item.fiber) || 0,
              salt: Number(item.salt) || 0,
              potassium: item.potassium !== undefined ? Number(item.potassium) : null,
              calcium: item.calcium !== undefined ? Number(item.calcium) : null,
              magnesium: item.magnesium !== undefined ? Number(item.magnesium) : null,
              iron: item.iron !== undefined ? Number(item.iron) : null,
              zinc: item.zinc !== undefined ? Number(item.zinc) : null,
              vitaminA: item.vitaminA !== undefined ? Number(item.vitaminA) : null,
              vitaminC: item.vitaminC !== undefined ? Number(item.vitaminC) : null,
              vitaminB1: item.vitaminB1 !== undefined ? Number(item.vitaminB1) : null,
              vitaminB2: item.vitaminB2 !== undefined ? Number(item.vitaminB2) : null,
              folate: item.folate !== undefined ? Number(item.folate) : null,
              portionUnits: Array.isArray(item.portionUnits) && item.portionUnits.length > 0
                ? item.portionUnits
                : [{ name: '100g', grams: 100, isPurchasedWeight: false, isDefault: true }]
            });
          }
        });

        if (validated.length === 0) {
          showToast('有効な食品データが見つかりませんでした');
          return;
        }

        setFoodMaster((prev) => {
          const existingCodes = new Set(prev.map(f => f.foodCode));
          const newlyAdded = validated.filter(f => !existingCodes.has(f.foodCode));
          showToast(`${newlyAdded.length} 件の公的食品を追加しました`);
          return [...newlyAdded, ...prev];
        });

        setIsImportModalOpen(false);
      };

      const handleToggleFavorite = (foodId) => {
        setFavorites((prev) => {
          const exists = prev.includes(foodId);
          return exists ? prev.filter((id) => id !== foodId) : [...prev, foodId];
        });
        showToast(favorites.includes(foodId) ? 'お気に入りから解除しました' : 'お気に入りに追加しました');
      };

      const handleAddToCompare = (foodId) => {
        const food = foodMaster.find((f) => f.id === foodId);
        setCompareFoodB({ id: foodId, grams: 100, isPurchased: false });
        showToast(`「${food?.shortName}」を比較スロットBにセットしました`);
        setActiveTab('compare');
      };

      const handleAddToRecipe = (foodId, grams, unitName, isPurchased) => {
        const food = foodMaster.find((f) => f.id === foodId);
        setRecipeItems((prev) => [
          ...prev,
          { foodId, grams, isPurchased: !!isPurchased, unitName: unitName || `${grams}g` }
        ]);
        showToast(`「${food?.shortName} (${grams}g)」をマイレシピに追加しました`);
      };

      const handleCopySummary = (text) => {
        if (navigator?.clipboard?.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            showToast('栄養サマリーをクリップボードにコピーしました！');
          }).catch(() => {
            showToast('コピーに失敗しました');
          });
        } else {
          const textArea = document.createElement('textarea');
          textArea.value = text;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          showToast('栄養サマリーをクリップボードにコピーしました！');
        }
      };

      const currentDri = useMemo(() => {
        return DETAILED_DRI_TABLE[userGender]?.[userAgeGroup] ?? DETAILED_DRI_TABLE.male['30-49'];
      }, [userGender, userAgeGroup]);

      const ageGroupDisplay = useMemo(() => {
        if (userAgeGroup === '18-29') return '20代以下';
        if (userAgeGroup === '30-49') return '30〜40代';
        if (userAgeGroup === '50-64') return '50〜64歳';
        return userAgeGroup;
      }, [userAgeGroup]);

      const navigationItems = [
        { id: 'home', label: 'さがす', icon: Search },
        { id: 'detail', label: '詳細・分量', icon: Sliders },
        { id: 'compare', label: 'くらべる', icon: Scale },
        { id: 'recipe', label: 'けいさん', icon: Calculator, badge: recipeItems.length > 0 ? recipeItems.length : null },
        { id: 'favorites', label: '保存・履歴', icon: Bookmark, dot: favorites.length > 0 }
      ];

      return (
        <div className="min-h-screen min-h-dvh w-full max-w-full overflow-x-hidden bg-[#F4F7F5] text-slate-800 flex flex-col font-sans">
          
          {/* ヘッダー */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-emerald-100 shadow-xs w-full max-w-full">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5 sm:py-3 flex items-center justify-between gap-3 w-full">
              
              <div className="flex items-center gap-2 sm:gap-2.5 cursor-pointer group shrink-0" onClick={() => setActiveTab('home')}>
                <div className="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-600 flex items-center justify-center font-black text-white shadow-xs group-hover:scale-105 transition-transform shrink-0">
                  <Flame size={19} className="fill-white text-white" />
                </div>
                <div className="min-w-0">
                  <div className="flex items-center gap-1.5">
                    <span className="font-extrabold tracking-tight text-base sm:text-xl text-slate-900 truncate">NutriDex</span>
                    {/* ヘッダー端のバージョンバッジ */}
                    <span className="text-[10px] font-black px-1.5 py-0.5 rounded-md bg-slate-900 text-white font-mono tracking-tighter shrink-0 shadow-xs">
                      {APP_VERSION}
                    </span>
                    <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200 shrink-0 hidden sm:inline-block">
                      八訂2541品目
                    </span>
                  </div>
                  <p className="text-[10px] text-emerald-700/90 font-medium hidden sm:block truncate">文部科学省食品成分表 準拠辞書</p>
                </div>
              </div>

              {/* PC用ナビゲーション */}
              <nav className="hidden md:flex items-center gap-1 lg:gap-2 shrink-0">
                {navigationItems.map((item) => {
                  const Icon = item.icon;
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => {
                        if (item.id === 'detail' && !selectedFoodId) setSelectedFoodId('food_06297');
                        setActiveTab(item.id);
                      }}
                      className={`px-3 lg:px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 relative ${
                        isActive
                          ? 'bg-emerald-50 text-emerald-700 border border-emerald-200/80 shadow-xs'
                          : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100/70'
                      }`}
                    >
                      <Icon size={16} className={isActive ? 'text-emerald-600' : 'text-slate-400'} />
                      <span>{item.label}</span>
                      {item.badge && (
                        <span className="w-4 h-4 bg-emerald-600 text-white rounded-full text-[9px] flex items-center justify-center font-extrabold">
                          {item.badge}
                        </span>
                      )}
                      {item.dot && <span className="w-1.5 h-1.5 bg-amber-400 rounded-full" />}
                    </button>
                  );
                })}
              </nav>

              {/* 右側アクションエリア */}
              <div className="flex items-center gap-1.5 sm:gap-2 shrink-0">
                <button
                  onClick={() => setIsImportModalOpen(true)}
                  className="p-2 sm:px-2.5 sm:py-1.5 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 transition-all shadow-xs flex items-center gap-1.5"
                  title="公的JSON一括インポート"
                >
                  <Upload size={16} />
                  <span className="text-xs font-semibold hidden lg:inline">取込</span>
                </button>

                <button
                  onClick={() => setIsBarcodeScannerOpen(true)}
                  className="p-2 sm:px-2.5 sm:py-1.5 rounded-xl bg-emerald-50/80 hover:bg-emerald-100 text-emerald-700 border border-emerald-200/80 transition-all shadow-xs flex items-center gap-1.5"
                  title="バーコード読取シミュレーター"
                >
                  <Scan size={16} className="text-emerald-600" />
                  <span className="text-xs font-semibold hidden lg:inline">読取</span>
                </button>

                <button
                  onClick={() => setIsSettingsOpen(true)}
                  className="px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-xl bg-white hover:bg-emerald-50 text-xs font-semibold text-slate-700 border border-slate-200 transition-all flex items-center gap-1.5 shadow-xs"
                >
                  <Settings size={14} className="text-emerald-600" />
                  <span className="font-bold">{userGender === 'male' ? '男性' : '女性'} {ageGroupDisplay}</span>
                </button>
              </div>
            </div>
          </header>

          {/* メインコンテンツ */}
          <main className="flex-1 w-full max-w-7xl mx-auto p-3.5 sm:p-6 lg:p-8 pb-28 md:pb-12 box-border">
            {activeTab === 'home' && (
              <HomeScreen
                foods={foodMaster}
                onSelectFood={handleSelectFood}
                onQueryMextDb={handleQueryMextDatabase}
                isFetchingMext={isFetchingMext}
                onQuickCompare={(idA, idB) => {
                  setCompareFoodA({ id: idA, grams: 200, isPurchased: false });
                  setCompareFoodB({ id: idB, grams: 200, isPurchased: false });
                  setActiveTab('compare');
                }}
                onOpenBarcode={() => setIsBarcodeScannerOpen(true)}
              />
            )}

            {activeTab === 'detail' && (
              <DetailScreen
                foodMaster={foodMaster}
                foodId={selectedFoodId}
                currentGrams={detailGrams}
                onChangeGrams={setDetailGrams}
                activeUnit={activePortionUnit}
                onChangeUnit={setActivePortionUnit}
                isPurchasedWeight={isPurchasedWeight}
                onChangePurchasedWeight={setIsPurchasedWeight}
                currentDri={currentDri}
                isFavorite={favorites.includes(selectedFoodId)}
                onToggleFavorite={() => handleToggleFavorite(selectedFoodId)}
                onBack={() => setActiveTab('home')}
                onAddToCompare={handleAddToCompare}
                onAddToRecipe={handleAddToRecipe}
                onCopySummary={handleCopySummary}
              />
            )}

            {activeTab === 'compare' && (
              <CompareScreen
                foodMaster={foodMaster}
                foodAConfig={compareFoodA}
                foodBConfig={compareFoodB}
                onChangeFoodA={setCompareFoodA}
                onChangeFoodB={setCompareFoodB}
              />
            )}

            {activeTab === 'recipe' && (
              <RecipeScreen
                foodMaster={foodMaster}
                title={recipeTitle}
                onChangeTitle={setRecipeTitle}
                servings={servings}
                onChangeServings={setServings}
                items={recipeItems}
                onChangeItems={setRecipeItems}
                onAddMoreFood={() => setActiveTab('home')}
                onCopySummary={handleCopySummary}
              />
            )}

            {}
            {activeTab === 'favorites' && (
              <FavoritesScreen
                foodMaster={foodMaster}
                favoriteIds={favorites}
                historyIds={history}
                onSelectFood={handleSelectFood}
                onClearHistory={() => {
                  setHistory([]);
                  showToast('閲覧履歴をクリアしました');
                }}
              />
            )}

            {/* バージョン表記 */}
            <div className="text-center text-[10px] text-slate-400 pt-8 pb-4">
              NutriDex {APP_VERSION} • 文部科学省八訂準拠 2,541品目照会エンジン (Gemini 2.5 Flash 対応)
            </div>
          </main>

          {/* 画面端（右下）常時フローティング・バージョンバッジ */}
          <aside className="fixed bottom-14 md:bottom-3 right-3 z-30 pointer-events-none select-none">
            <span className="px-2 py-0.5 rounded-full bg-slate-900/75 backdrop-blur-xs text-white/95 text-[10px] font-mono font-black shadow-md border border-white/20 tracking-tight">
              {APP_VERSION}
            </span>
          </aside>

          {/* トースト表示 */}
          {toastMessage && (
            <div className="fixed bottom-24 md:bottom-8 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 text-white border border-slate-700/60 px-4 py-2.5 rounded-2xl shadow-xl flex items-center gap-2 text-xs font-bold backdrop-blur-md max-w-[90%] md:max-w-md pointer-events-none">
              <Check size={16} className="text-emerald-400 shrink-0" />
              <span className="truncate">{toastMessage}</span>
            </div>
          )}

          {/* モバイルボトムナビゲーション */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 flex justify-center pointer-events-none pb-safe">

    function RecipeScreen({ foodMaster, title, onChangeTitle, servings, onChangeServings, items, onChangeItems, onAddMoreFood, onCopySummary }) {
      const handleItemGramChange = (index, delta) => {
        onChangeItems(items.map((item, i) => i === index ? { ...item, grams: Math.max(5, item.grams + delta) } : item));
      };

      const handleRemoveItem = (index) => {
        onChangeItems(items.filter((_, i) => i !== index));
      };

      const totals = useMemo(() => {
        let energy = 0, protein = 0, fat = 0, carb = 0, sugar = 0, fiber = 0, salt = 0;
        items.forEach((item) => {
          const food = foodMaster.find((f) => f.id === item.foodId);
          if (food) {
            const sc = calculateScaledNutrients(food, item.grams, item.isPurchased);
            energy += sc.energy;
            protein += sc.protein;
            fat += sc.fat;
            carb += sc.carb;
            sugar += sc.sugar;
            fiber += sc.fiber;
            salt += sc.salt;
          }
        });

        const divisor = Math.max(1, servings);
        const perServing = {
          energy: Math.round(energy / divisor),
          protein: +(protein / divisor).toFixed(1),
          fat: +(fat / divisor).toFixed(1),
          carb: +(carb / divisor).toFixed(1),
          sugar: +(sugar / divisor).toFixed(1),
          fiber: +(fiber / divisor).toFixed(1),
          salt: +(salt / divisor).toFixed(2)
        };

        const pKcal = perServing.protein * 4;
        const fKcal = perServing.fat * 9;
        const cKcal = perServing.carb * 4;
        const totalPfc = pKcal + fKcal + cKcal || 1;

        return {
          totalEnergy: Math.round(energy),
          perServing,
          pRatio: Math.round((pKcal / totalPfc) * 100),
          fRatio: Math.round((fKcal / totalPfc) * 100),
          cRatio: Math.max(0, 100 - (Math.round((pKcal / totalPfc) * 100) + Math.round((fKcal / totalPfc) * 100)))
        };
      }, [foodMaster, items, servings]);

      const recipeSummaryText = `【NutriDex レシピ計算】\n料理名: ${title}\n出来上がり: ${servings}人前\n1人前あたり: ${totals.perServing.energy}kcal\nPFC: P ${totals.perServing.protein}g (${totals.pRatio}%) / F ${totals.perServing.fat}g (${totals.fRatio}%) / C ${totals.perServing.carb}g (${totals.cRatio}%)\n糖質: ${totals.perServing.sugar}g / 食物繊維: ${totals.perServing.fiber}g / 食塩: ${totals.perServing.salt}g`;

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-5 items-start w-full">
          <div className="lg:col-span-7 space-y-4 w-full">
            <div className="bg-white p-4 sm:p-5 rounded-3xl border border-slate-200/80 space-y-3.5 shadow-xs w-full box-border">
              <div className="flex items-center justify-between flex-wrap gap-2">
                <div className="flex items-center gap-1.5 text-xs sm:text-sm font-bold text-slate-800">
                  <Calculator size={18} className="text-emerald-600 shrink-0" />
                  <span>マイレシピ・合算栄養計算</span>
                </div>
                <div className="flex items-center gap-2 text-xs sm:text-sm text-slate-500">
                  <span>分量:</span>
                  <select
                    value={servings}
                    onChange={(e) => onChangeServings(Number(e.target.value))}
                    className="bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1 text-slate-800 font-bold focus:outline-none"
                  >
                    {[1, 2, 3, 4, 5, 6].map((num) => <option key={num} value={num}>{num} 人前</option>)}
                  </select>
                </div>
              </div>
              <input
                type="text"
                value={title}
                onChange={(e) => onChangeTitle(e.target.value)}
                placeholder="レシピ名を入力"
                className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500/30 box-border"
              />
            </div>

            <div className="space-y-2.5 w-full">
              <div className="flex items-center justify-between px-1 text-xs sm:text-sm text-slate-500 font-semibold">
                <span>使用食材（{items.length}品）</span>
                <button onClick={onAddMoreFood} className="flex items-center gap-1.5 text-emerald-700 hover:text-emerald-600 font-bold text-xs sm:text-sm">
                  <Plus size={16} />
                  <span>食材を追加</span>
                </button>
              </div>

              {items.map((item, idx) => {
                const food = foodMaster.find((f) => f.id === item.foodId);
                if (!food) return null;
                const sc = calculateScaledNutrients(food, item.grams, item.isPurchased);

                return (
                  <div key={idx} className="bg-white p-3.5 sm:p-4 rounded-3xl border border-slate-200/80 flex items-center justify-between gap-3 shadow-xs w-full box-border">
                    <div className="flex items-center gap-3 min-w-0 flex-1">
                      <span className="text-2xl sm:text-3xl shrink-0">{food.categoryEmoji}</span>
                      <div className="min-w-0 flex-1">
                        <h4 className="text-xs sm:text-sm font-bold text-slate-800 truncate">{food.shortName}</h4>
                        <p className="text-[11px] sm:text-xs text-slate-500 mt-0.5 truncate">
                          {item.grams}g • <span className="text-slate-900 font-bold">{sc.energy}kcal</span> (P:{sc.protein}g)
                        </p>
                      </div>
                    </div>
                    <div className="flex items-center gap-1.5 sm:gap-2 shrink-0">
                      <div className="flex items-center bg-slate-50 rounded-xl border border-slate-200 p-0.5">
                        <button onClick={() => handleItemGramChange(idx, -10)} className="w-7 h-7 flex items-center justify-center text-slate-600 hover:bg-slate-200 rounded-lg">
                          <Minus size={13} />
                        </button>
                        <span className="px-2 text-xs font-bold text-slate-900 min-w-[2.5rem] text-center">{item.grams}g</span>
                        <button onClick={() => handleItemGramChange(idx, 10)} className="w-7 h-7 flex items-center justify-center text-slate-600 hover:bg-slate-200 rounded-lg">
                          <Plus size={13} />
                        </button>
                      </div>
                      <button onClick={() => handleRemoveItem(idx)} className="p-1.5 sm:p-2 text-slate-400 hover:text-rose-500 rounded-xl">
                        <Trash2 size={16} />
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="lg:col-span-5 lg:sticky lg:top-20 space-y-4 w-full">
            {items.length > 0 && (
              <div className="bg-gradient-to-br from-emerald-50 via-teal-50/40 to-white p-4 sm:p-5 rounded-3xl border border-emerald-200 space-y-4 shadow-xs w-full box-border">
                <div className="flex items-baseline justify-between border-b border-emerald-100 pb-3 flex-wrap gap-2">
                  <div>
                    <span className="text-xs font-bold text-emerald-800">1人前あたり ({servings}人前換算)</span>
                    <div className="flex items-baseline gap-1.5 mt-0.5">
                      <span className="text-3xl sm:text-4xl font-black text-slate-900">{totals.perServing.energy}</span>
                      <span className="text-sm font-bold text-emerald-700">kcal</span>
                    </div>
                  </div>
                  <div className="text-right text-xs sm:text-sm text-slate-600 space-y-0.5">
                    <div>糖質: <span className="font-bold text-slate-800">{totals.perServing.sugar}g</span></div>
                    <div>食物繊維: <span className="font-bold text-emerald-700">{totals.perServing.fiber}g</span></div>
                    <div>食塩: <span className="font-bold text-slate-800">{totals.perServing.salt}g</span></div>
                  </div>
                </div>

                <div className="h-3.5 w-full bg-slate-100 rounded-full overflow-hidden flex shadow-inner">
                  <div style={{ width: `${totals.pRatio}%` }} className="bg-rose-500" />
                  <div style={{ width: `${totals.fRatio}%` }} className="bg-amber-400" />
                  <div style={{ width: `${totals.cRatio}%` }} className="bg-sky-400" />
                </div>

                <div className="grid grid-cols-3 gap-2 sm:gap-2.5 pt-1 text-center text-xs w-full">
                  <div className="bg-white/80 border border-rose-200 rounded-2xl p-2 sm:p-2.5 min-w-0">
                    <div className="text-[10px] sm:text-xs text-rose-600 font-bold truncate">P ({totals.pRatio}%)</div>
                    <div className="font-black text-slate-900 text-sm sm:text-base truncate">{totals.perServing.protein}g</div>
                  </div>
                  <div className="bg-white/80 border border-amber-200 rounded-2xl p-2 sm:p-2.5 min-w-0">
                    <div className="text-[10px] sm:text-xs text-amber-600 font-bold truncate">F ({totals.fRatio}%)</div>
                    <div className="font-black text-slate-900 text-sm sm:text-base truncate">{totals.perServing.fat}g</div>
                  </div>
                  <div className="bg-white/80 border border-sky-200 rounded-2xl p-2 sm:p-2.5 min-w-0">
                    <div className="text-[10px] sm:text-xs text-sky-600 font-bold truncate">C ({totals.cRatio}%)</div>
                    <div className="font-black text-slate-900 text-sm sm:text-base truncate">{totals.perServing.carb}g</div>
                  </div>
                </div>

                <button
                  onClick={() => onCopySummary(recipeSummaryText)}
                  className="w-full py-2.5 sm:py-3 bg-white hover:bg-emerald-50 text-emerald-800 text-xs sm:text-sm font-bold rounded-2xl flex items-center justify-center gap-2 border border-emerald-200 shadow-xs transition-colors box-border"
                >
                  <Copy size={15} />
                  <span>レシピ栄養サマリーをコピー</span>
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function FavoritesScreen({ foodMaster, favoriteIds, historyIds, onSelectFood, onClearHistory }) {
      const [subTab, setSubTab] = useState('favorites');
      const favoriteFoods = useMemo(() => favoriteIds.map((id) => foodMaster.find((f) => f.id === id)).filter(Boolean), [foodMaster, favoriteIds]);
      const historyFoods = useMemo(() => historyIds.map((id) => foodMaster.find((f) => f.id === id)).filter(Boolean), [foodMaster, historyIds]);

      return (
        <div className="space-y-4 sm:space-y-5 w-full">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 w-full">
            <div className="flex bg-slate-100 p-1.5 rounded-2xl border border-slate-200 max-w-md w-full">
              <button
                onClick={() => setSubTab('favorites')}
                className={`flex-1 py-2 sm:py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all flex items-center justify-center gap-2 ${
                  subTab === 'favorites' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-800'
                }`}
              >
                <Bookmark size={16} />
                <span>お気に入り ({favoriteFoods.length})</span>
              </button>
              <button
                onClick={() => setSubTab('history')}
                className={`flex-1 py-2 sm:py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all flex items-center justify-center gap-2 ${
                  subTab === 'history' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-800'
                }`}
              >
                <History size={16} />
                <span>最近見た食品 ({historyFoods.length})</span>
              </button>
            </div>

            {subTab === 'history' && historyFoods.length > 0 && (
              <button
                onClick={onClearHistory}
                className="text-xs sm:text-sm text-slate-500 hover:text-rose-600 flex items-center gap-1.5 py-1 px-2 font-bold self-end sm:self-center transition-colors shrink-0"
              >
                <Trash2 size={15} />
                <span>履歴をすべてクリア</span>
              </button>
            )}
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4 w-full">
            {(subTab === 'favorites' ? favoriteFoods : historyFoods).map((food) => (
              <div
                key={food.id}
                onClick={() => onSelectFood(food.id)}
                className="bg-white hover:bg-emerald-50/40 p-4 rounded-3xl border border-slate-200/80 flex items-center justify-between cursor-pointer shadow-xs hover:shadow-md transition-all w-full box-border"
              >
                <div className="flex items-center gap-3.5 min-w-0 flex-1">
                  <span className="text-3xl shrink-0">{food.categoryEmoji}</span>
                  <div className="min-w-0 flex-1">
                    <h4 className="text-sm sm:text-base font-bold text-slate-900 truncate">{food.displayName}</h4>
                    <p className="text-xs text-slate-500 mt-0.5 truncate">
                      <span className="text-slate-900 font-black">{food.energy} kcal</span> • P {food.protein}g • F {food.fat}g • C {food.carb}g
                    </p>
                  </div>
                </div>
                <ChevronRight size={18} className="text-slate-400 shrink-0 ml-2" />
              </div>
            ))}
          </div>
        </div>
      );
    }

    function SettingsModal({ userGender, onChangeGender, userAgeGroup, onChangeAgeGroup, userApiKey, onChangeApiKey, onClose }) {
      const [keyInput, setKeyInput] = useState(userApiKey);
      const [isTesting, setIsTesting] = useState(false);
      const [testStatus, setTestStatus] = useState(null); // { success: boolean, msg: string }

      const handleTest = async () => {
        setIsTesting(true);
        setTestStatus(null);
        try {
          const res = await testGeminiApiKey(keyInput.trim());
          setTestStatus({ success: true, msg: `接続成功！（${res.model}）` });
        } catch (err) {
          setTestStatus({ success: false, msg: `接続失敗: ${err.message}` });
        } finally {
          setIsTesting(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white border border-slate-200 w-full max-w-md rounded-3xl p-5 sm:p-6 space-y-4 sm:space-y-5 shadow-2xl box-border">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <div className="flex items-center gap-2">
                <Settings size={20} className="text-emerald-600" />
                <h3 className="text-base font-bold text-slate-900">各種設定 & 文科省DB接続</h3>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-[10px] font-mono font-extrabold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 border border-slate-200">
                  {APP_VERSION}
                </span>
                <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
              </div>
            </div>

            <div className="space-y-2">
              <label className="text-xs sm:text-sm font-semibold text-slate-700">年齢区分</label>
              <div className="grid grid-cols-3 gap-2">
                {[
                  { id: '18-29', label: '18〜29歳' },
                  { id: '30-49', label: '30〜49歳' },
                  { id: '50-64', label: '50〜64歳' }
                ].map((age) => (
                  <button
                    key={age.id}
                    onClick={() => onChangeAgeGroup(age.id)}
                    className={`py-2.5 rounded-xl text-xs sm:text-sm font-bold border transition-all ${
                      userAgeGroup === age.id ? 'bg-emerald-600 text-white border-emerald-600 shadow-xs' : 'bg-slate-50 border-slate-200 text-slate-600'
                    }`}
                  >
                    {age.label}
                  </button>
                ))}
              </div>
            </div>

            {/* APIキー設定 & 即時テストエリア */}
            <div className="space-y-2 pt-2 border-t border-slate-100">
              <div className="flex items-center justify-between">
                <label className="text-xs sm:text-sm font-semibold text-slate-800 flex items-center gap-1.5">
                  <Key size={15} className="text-emerald-600" />
                  <span>文科省2,541品目 外部照会キー（無料）</span>
                </label>
              </div>
              <p className="text-[11px] text-slate-500 leading-relaxed">
                Google AI Studioで取得したキー（<code>AQ.</code> または <code>AIzaSy</code> で始まるキー）を貼り付けてください。
              </p>
              
              <div className="flex gap-2">
                <input
                  type="password"
                  value={keyInput}
                  onChange={(e) => {
                    setKeyInput(e.target.value);
                    setTestStatus(null);
                  }}
                  placeholder="AQ... または AIzaSy..."
                  className="flex-1 text-xs font-mono bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:ring-1 focus:ring-emerald-500"
                />
                <button
                  onClick={handleTest}
                  disabled={isTesting || !keyInput.trim()}
                  className="px-3 py-2 bg-slate-100 hover:bg-slate-200 disabled:opacity-50 text-slate-700 text-xs font-bold rounded-xl border border-slate-200 shrink-0 transition-all flex items-center gap-1"
                >
                  {isTesting ? <Loader2 size={13} className="animate-spin" /> : "テスト"}
                </button>
              </div>

              {testStatus && (
                <div className={`p-2.5 rounded-xl text-xs font-bold flex items-center gap-1.5 ${
                  testStatus.success ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-rose-50 text-rose-800 border border-rose-200'
                }`}>
                  {testStatus.success ? <Check size={14} className="text-emerald-600 shrink-0" /> : <span className="text-rose-600 shrink-0">✕</span>}
                  <span className="truncate">{testStatus.msg}</span>
                </div>
              )}
            </div>

            <button
              onClick={() => {
                onChangeApiKey(keyInput.trim());
                onClose();
              }}
              className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-2xl text-xs sm:text-sm font-bold shadow-xs transition-all"
            >
              設定を保存して閉じる
            </button>
          </div>
        </div>
      );
    }

    function ImportDataModal({ currentCount, onClose, onImport }) {
      const [jsonInput, setJsonInput] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (Array.isArray(parsed)) {
              onImport(parsed);
            } else {
              setErrorMsg('JSONは配列形式（[ {...}, {...} ]）である必要があります');
            }
          } catch (err) {
            setErrorMsg('JSONファイルのパースに失敗しました');
          }
        };
        reader.readAsText(file);
      };

      const handlePasteImport = () => {
        try {
          const parsed = JSON.parse(jsonInput);
          if (Array.isArray(parsed)) {
            onImport(parsed);
          } else {
            setErrorMsg('配列形式（[ {...} ]）で貼り付けてください');
          }
        } catch (err) {
          setErrorMsg('有効なJSONではありません');
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white border border-slate-200 w-full max-w-md rounded-3xl p-5 sm:p-6 space-y-4 shadow-2xl box-border">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <div className="flex items-center gap-2">
                <FileSpreadsheet size={20} className="text-emerald-600" />
                <h3 className="text-base font-bold text-slate-900">公的成分表データ一括インポート</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
            </div>

            <div className="text-xs sm:text-sm text-slate-600 space-y-1">
              <p className="font-semibold text-slate-800">現在の登録食品数: <span className="text-emerald-700 font-bold">{currentCount}件</span></p>
              <p className="text-xs text-slate-500">
                Pythonスクリプト等で書き出した全件JSONファイルを選択して直接追加できます。
              </p>
            </div>

            <label className="block p-4 sm:p-5 border-2 border-dashed border-slate-300 hover:border-emerald-500 rounded-2xl text-center cursor-pointer transition-colors bg-slate-50/50">
              <Upload size={28} className="mx-auto text-emerald-600 mb-1.5" />
              <span className="text-xs sm:text-sm font-bold text-slate-700">JSONファイルを選択</span>
              <input type="file" accept=".json" onChange={handleFileUpload} className="hidden" />
            </label>

            <div className="space-y-1.5">
              <label className="text-xs font-bold text-slate-700">またはJSONテキストを直接貼り付け:</label>
              <textarea
                value={jsonInput}
                onChange={(e) => {
                  setJsonInput(e.target.value);
                  setErrorMsg('');
                }}
                placeholder='[ { "foodCode": "06061", "displayName": "キャベツ", "energy": 21, ... } ]'
                className="w-full h-20 text-xs font-mono p-2 border border-slate-200 rounded-xl bg-slate-50 focus:outline-none focus:ring-1 focus:ring-emerald-500 box-border"
              />
            </div>

            {errorMsg && <p className="text-xs text-rose-500 font-bold">{errorMsg}</p>}

            <div className="flex gap-2.5 pt-1">
              <button onClick={onClose} className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-2xl text-xs sm:text-sm font-bold transition-all">
                閉じる
              </button>
              <button onClick={handlePasteImport} disabled={!jsonInput.trim()} className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-300 text-white rounded-2xl text-xs sm:text-sm font-bold transition-all">
                取り込む
              </button>
            </div>
          </div>
        </div>
      );
    }

    function BarcodeScannerModal({ foodMaster, onClose, onDetected }) {
      const sampleBarcodes = [
        { name: '緑豆もやし (公的06297)', code: 'DEMO-06297', id: 'food_06297' },
        { name: '大豆もやし (公的06299)', code: 'DEMO-06299', id: 'food_06299' },
        { name: '豚バラ肉 (公的11145)', code: 'DEMO-11145', id: 'food_11145' },
        { name: '白米 (公的01088)', code: 'DEMO-01088', id: 'food_01088' },
        { name: '木綿豆腐 (公的04032)', code: 'DEMO-04032', id: 'food_04032' }
      ];

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white border border-slate-200 w-full max-w-md rounded-3xl p-5 sm:p-6 space-y-4 shadow-2xl box-border">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <div className="flex items-center gap-2">
                <Scan size={20} className="text-emerald-600" />
                <h3 className="text-base font-bold text-slate-900">バーコード認識シミュレーター</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
            </div>

            <div className="relative w-full h-40 sm:h-44 bg-slate-900 rounded-2xl border-2 border-dashed border-emerald-500 overflow-hidden flex flex-col items-center justify-center text-center p-4 box-border">
              <div className="absolute inset-x-8 top-1/2 -translate-y-1/2 h-0.5 bg-rose-500 animate-pulse" />
              <Camera size={36} className="text-slate-500 mb-2" />
              <p className="text-xs sm:text-sm text-white font-bold">バーコード読取シミュレーター</p>
              <p className="text-[11px] text-slate-400 mt-1">※検証用サンプルコードをタップして動作を確認できます</p>
            </div>

            <div className="space-y-2">
              <span className="text-xs font-bold text-slate-600">検証用サンプルバーコード:</span>
              <div className="grid grid-cols-1 gap-2 max-h-40 overflow-y-auto pr-1">
                {sampleBarcodes.map((item) => (
                  <button
                    key={item.id}
                    onClick={() => onDetected(item.id)}
                    className="bg-slate-50 hover:bg-emerald-50 p-2.5 rounded-xl text-left border border-slate-200 flex items-center justify-between text-xs sm:text-sm transition-colors"
                  >
                    <span className="font-bold text-slate-800">{item.name}</span>
                    <span className="text-xs font-mono text-emerald-700">{item.code}</span>
                  </button>
                ))}
              </div>
            </div>

            <button onClick={onClose} className="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-2xl text-xs sm:text-sm font-bold transition-all">
              閉じる
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
